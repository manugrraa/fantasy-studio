name: Actualizar datos Fantasy

on:
  schedule:
    # Cada 15 minutos: la app va casi en tiempo real (puntos en jornada, estados,
    # valores de madrugada). El script solo commitea si algo cambió, y las
    # estadísticas pesadas (1 petición/jugador) solo se bajan una vez al día.
    - cron: "6,21,36,51 * * * *"
    # Refuerzo de la 01:00 de Madrid: el juego publica los valores nuevos a esa
    # hora. GitHub ignora a menudo el cron frecuente, pero los diarios suelen
    # entrar; 23h UTC cubre el verano (CEST) y 0h UTC el invierno (CET).
    - cron: "10,40 23 * * *"
    - cron: "10,40 0 * * *"
  workflow_dispatch:
  # disparador TEMPORAL: reenvío del parte de precios a petición (se quita después)
  push:
    paths:
      - ".github/workflows/datos.yml"

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar datos de la API
        run: python scripts/update_data.py

      - name: Alertas al instante (objetivos y plantilla)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FANTASY_SYNC_KEY: ${{ secrets.FANTASY_SYNC_KEY }}
        run: python scripts/alertas_telegram.py

      - name: Publicar cambios
        run: |
          git config user.name "fantasy-studio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
          else
            git commit -m "datos: actualización automática"
            git push
          fi
