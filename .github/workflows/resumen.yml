name: Resumen diario Telegram

on:
  schedule:
    # 8:45 España (verano). Los valores del juego cambian de madrugada y el
    # workflow de datos (cada 15 min) los captura antes de esta hora.
    - cron: "45 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resumen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enviar resumen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FANTASY_SYNC_KEY: ${{ secrets.FANTASY_SYNC_KEY }}
        run: python scripts/resumen_telegram.py

      - name: Guardar estado
        run: |
          git config user.name "fantasy-studio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/resumen_state.json 2>/dev/null || true
          git add data/telegram_chat.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin estado nuevo"
          else
            git commit -m "resumen: enviado"
            # el ciclo de datos sube cambios a menudo: traer lo último y reintentar
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          fi
