function squadRow(e){
  const c = comp();
  const p = e.custom ? null : state.byId[c].get(String(e.pid));
  const current = p ? pVal(p) : null;
  const pl = current != null ? current - (e.buyPrice||0) : null;
  const stt = p ? STATUS[p.playerStatus] : null;
  const t = p ? teamOf(p) : null;
  return `<div class="p-row" onclick="${p ? `openPlayer('${e.pid}')` : `openEditEntry('${e.id}')`}">
    ${p ? `<img class="p-photo" loading="lazy" src="${esc(p.image)}" alt="" onerror="this.style.visibility='hidden'">`
        : `<div class="p-photo" style="display:flex;align-items:center;justify-content:center;font-size:15px">👤</div>`}
    <div class="p-main">
      <div class="p-name">${esc(e.name)}
        ${stt && p.playerStatus !== "ok" ? `<span class="status-dot" style="background:${stt.color}" title="${stt.label}"></span>` : ""}
      </div>
      <div class="p-meta">
        ${t ? `<img src="${esc(t.badgeColor)}" alt="" loading="lazy"> ${esc(t.shortName||t.name)} · ` : ""}
        compra ${fmtM(e.buyPrice||0)}${e.buyDate ? " · " + fmtDate(e.buyDate) : ""}
      </div>
    </div>
    <div class="p-right">
      <div class="p-val">${current != null ? fmtM(current) + " €" : "—"}</div>
      <div class="p-sub ${pl != null ? cls(pl) : ""}">${pl != null ? fmtMSign(pl) : "manual"}</div>
    </div>
    <button class="icon-btn" style="width:30px;height:30px" onclick="event.stopPropagation();openEditEntry('${e.id}')" title="Editar">${IC.edit.replace('class="ic"','class="ic" style="width:13px;height:13px"')}</button>
  </div>`;
}

/* selector de jugador para fichar */
function openPicker(){
  openModal(`
    ${modalHead("Fichar jugador")}
    <div class="modal-body">
      <div class="search-box">${IC.search}<input id="pickerSearch" placeholder="Buscar jugador…" autocomplete="off" autofocus></div>
      <div id="pickerList"></div>
      <button class="btn-ghost" style="width:100%;margin-top:10px" onclick="openBuyCustom()">¿No aparece? Añadir manualmente</button>
    </div>`, ov => {
      const inp = ov.querySelector("#pickerSearch");
      const listEl = ov.querySelector("#pickerList");
      const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
      const c = comp();
      const renderList = () => {
        const q = norm(inp.value || "");
        let list = (state.players[c] || []).filter(p => !squadEntry(p.id) && (!q || norm(p.nickname).includes(q)));
        list.sort((a,b) => pVal(b) - pVal(a));
        list = list.slice(0, 30);
        listEl.innerHTML = `<div class="card">` + (list.length ? list.map(p => {
          const pos = POS[String(p.positionId)] || POS["3"];
          const t = teamOf(p);
          return `<div class="p-row" onclick="openBuy('${p.id}')">
            <img class="p-photo sm" loading="lazy" src="${esc(p.image)}" alt="" onerror="this.style.visibility='hidden'">
            <div class="p-main">
              <div class="p-name">${esc(p.nickname)}</div>
              <div class="p-meta"><span class="pos-chip" style="color:${pos.color};background:${pos.bg}">${pos.tag}</span>${t ? ` ${esc(t.shortName||t.name)}` : ""} · ${fmtM(pVal(p))} €</div>
            </div>
            <div class="picker-add">${IC.plus.replace('class="ic"','class="ic" style="width:15px;height:15px"')}</div>
          </div>`;
        }).join("") : `<div class="empty-state" style="padding:22px">Sin resultados</div>`) + `</div>`;
      };
      inp.addEventListener("input", renderList);
      renderList();
      setTimeout(() => inp.focus(), 120);
    });
}

/* =====================================================================
   VISTA: MOVIMIENTOS
   ===================================================================== */
function viewMovs(){
  const c = comp();
  const moves = [...state.moves[c]].sort((a,b) => (b.date||"").localeCompare(a.date||"") || b.id.localeCompare(a.id));
  const buys = moves.filter(m => m.type === "buy");
  const sells = moves.filter(m => m.type === "sell");
  const totalBuy = buys.reduce((a,m)=>a+(m.price||0),0);
  const totalSell = sells.reduce((a,m)=>a+(m.price||0),0);
  const realized = sells.reduce((a,m)=>a+(m.profit||0),0);
  const f = state.moveFilter;
  const filtered = f === "all" ? moves : moves.filter(m => m.type === f);

  let listHtml;
  if (!filtered.length) {
    listHtml = `<div class="card"><div class="empty-state"><div class="big">📒</div>Sin movimientos todavía.<br>Se crean solos al fichar y vender desde Mi Plantilla.</div></div>`;
  } else {
    const groups = new Map();
    for (const m of filtered) {
      const d = m.date ? new Date(m.date + "T12:00:00") : new Date();
      const key = d.toLocaleDateString("es-ES", { month:"long", year:"numeric" });
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(m);
    }
    listHtml = [...groups.entries()].map(([label, ms]) =>
      `<div class="month-lbl">${label}</div><div class="card">${ms.map(moveRow).join("")}</div>`).join("");
  }

  return `
  <div class="stat-grid" style="margin-bottom:16px">
    ${statTile("Compras", fmtM(totalBuy) + " €", buys.length + " operaciones")}
    ${statTile("Ventas", fmtM(totalSell) + " €", sells.length + " operaciones")}
    ${statTile("Beneficio realizado", `<span class="${cls(realized)}">${fmtMSign(realized)}</span>`, "")}
    ${statTile("ROI de ventas", `<span class="${cls(realized)}">${sells.length && totalSell-realized > 0 ? (realized/(totalSell-realized)*100).toLocaleString("es-ES",{maximumFractionDigits:1}) + " %" : "—"}</span>`, "sobre lo invertido")}
  </div>
  <div class="chips-row no-scrollbar">
    <button class="chip ${f==="all"?"active":""}" onclick="state.moveFilter='all';render()">Todos</button>
    <button class="chip ${f==="buy"?"active":""}" onclick="state.moveFilter='buy';render()">Compras</button>
    <button class="chip ${f==="sell"?"active":""}" onclick="state.moveFilter='sell';render()">Ventas</button>
  </div>
  ${listHtml}`;
}

function moveRow(m){
  const pos = POS[String(m.pos)] || null;
  const isBuy = m.type === "buy";
  return `<div class="mv-row">
    <div class="mv-icon ${isBuy?"buy":"sell"}">${isBuy ? IC.down : IC.upar}</div>
    <div class="p-main">
      <div class="p-name">${esc(m.name)}</div>
      <div class="p-meta">${isBuy ? "Compra" : "Venta"}${pos ? " · " + pos.tag : ""}${m.date ? " · " + fmtDate(m.date) : ""}</div>
    </div>
    <div class="p-right">
      <div class="p-val">${isBuy ? "−" : "+"}${fmtM(m.price||0)} €</div>
      ${!isBuy ? `<div class="p-sub ${cls(m.profit||0)}">${fmtMSign(m.profit||0)}</div>` : ""}
    </div>
    <button class="icon-btn" style="width:30px;height:30px" onclick="delMove('${m.id}')" title="Borrar">${IC.trash.replace('class="ic"','class="ic" style="width:13px;height:13px"')}</button>
  </div>`;
}
function delMove(id){
  const c = comp();
  const m = state.moves[c].find(x => x.id === id);
  if (!m) return;
  const extra = m.type === "buy" && state.squad[c].some(e => e.id === m.linkedEntry)
    ? "\n\nOJO: su jugador sigue en Mi Plantilla; esto solo borra el registro."
    : "";
  if (!confirm("¿Borrar este movimiento de " + m.name + "?" + extra)) return;
  state.moves[c] = state.moves[c].filter(x => x.id !== id);
  persist(); render(); toast("Movimiento borrado");
}

/* =====================================================================
   MENÚ: EXPORTAR / IMPORTAR
   ===================================================================== */
function openMenu(){
  const updated = state.meta ? new Date(state.meta.updatedAt).toLocaleString("es-ES") : "—";
  openModal(`
    ${modalHead("Fantasy Studio")}
    <div class="modal-body">
      <div class="card" style="padding:13px 15px;margin-bottom:14px;font-size:12.5px;color:var(--text-2);line-height:1.55">
        Datos de la API oficial de LaLiga Fantasy, actualizados automáticamente varias veces al día.<br>
        Última publicación: <b>${updated}</b><br><br>
        Tu plantilla, movimientos y vigilados se guardan <b>en este dispositivo</b>. Usa Exportar para hacer copia o pasarlos a otro móvil.
      </div>
      ${("Notification" in window) ? (Notification.permission === "granted"
        ? `<div class="badge green" style="margin-bottom:12px">${IC.bell.replace('class="ic"','class="ic" style="width:12px;height:12px"')} Avisos de objetivos activados</div>`
        : `<button class="btn-ghost" style="width:100%;margin-bottom:9px" onclick="Notification.requestPermission().then(()=>{closeModal();openMenu()})">${IC.bell.replace('class="ic"','class="ic" style="width:14px;height:14px"')} Activar avisos de objetivos</button>`) : ""}
      <button class="btn-acc" style="width:100%" onclick="exportData()">Exportar mis datos</button>
      <button class="btn-ghost" style="width:100%;margin-top:9px" onclick="document.getElementById('importFile').click()">Importar datos</button>
      <button class="btn-ghost btn-danger" style="width:100%;margin-top:9px" onclick="wipeData()">Borrar todos mis datos</button>
    </div>`);
}
function exportData(){
  const payload = {
    app: "FantasyStudio", version: 1, exportedAt: new Date().toISOString(),
    squad: state.squad, moves: state.moves, watch: state.watch,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "FantasyStudio_datos_" + todayISO() + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("Datos exportados", "ok");
}
document.getElementById("importFile").addEventListener("change", async e => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== "FantasyStudio" || !data.squad || !data.moves) throw new Error("formato");
    if (!confirm("Esto sustituirá tu plantilla, movimientos y vigilados actuales por los del archivo. ¿Continuar?")) return;
    state.squad = Object.assign({"1":[], "2":[]}, data.squad);
    state.moves = Object.assign({"1":[], "2":[]}, data.moves);
    state.watch = Object.assign({"1":[], "2":[]}, data.watch || {});
    persist();
    closeModal();
    render();
    toast("Datos importados", "ok");
  } catch(err) {
    toast("Archivo no válido", "err");
  }
});
function wipeData(){
  if (!confirm("¿Borrar plantilla, movimientos y vigilados de LAS DOS ligas? Esta acción no se puede deshacer.")) return;
  if (!confirm("¿Seguro? Se borrará todo lo tuyo (los datos de jugadores no se tocan).")) return;
  state.squad = {"1":[], "2":[]};
  state.moves = {"1":[], "2":[]};
  state.watch = {"1":[], "2":[]};
  persist();
  closeModal();
  render();
  toast("Datos borrados");
}

/* =====================================================================
   ARRANQUE
   ===================================================================== */
for (const id of ["modeSwitch", "modeSwitchSide"]) {
  document.getElementById(id)?.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (b) setMode(b.dataset.m);
  });
}
document.getElementById("btnTheme").addEventListener("click", toggleTheme);
document.getElementById("btnThemeSide")?.addEventListener("click", toggleTheme);
document.getElementById("btnMenu").addEventListener("click", openMenu);
document.getElementById("btnMenuSide")?.addEventListener("click", openMenu);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

/* --- refresco automático: si data/ se ha republicado, recarga sin tocar nada --- */
let _lastMetaAt = null;
async function autoCheck(){
  if (!state.meta) return;
  try {
    const m = await fetchJSON("data/meta.json");
    if (_lastMetaAt === null) _lastMetaAt = state.meta.updatedAt;
    if (m.updatedAt !== _lastMetaAt) {
      _lastMetaAt = m.updatedAt;
      await loadAll();
      render();
      checkTargets();
      toast("Datos actualizados automáticamente", "ok");
    }
  } catch(e) { /* sin red: lo intentamos más tarde */ }
}

(function init(){
  const theme = localStorage.getItem(LS.theme);
  if (theme) document.documentElement.dataset.theme = theme;
  applyThemeBtn();
  applyMode();
  renderNav();
  loadAll().then(() => {
    render();
    checkTargets({ silent: true });
  }).catch(err => {
    document.getElementById("main").innerHTML =
      `<div class="empty-state"><div class="big">📡</div>No se pudieron cargar los datos.<br>
      <span style="font-size:12px">${esc(err.message)}</span><br><br>
      <button class="btn-acc" onclick="location.reload()">Reintentar</button></div>`;
  });
  // refresco del contador de jornada cada minuto
  setInterval(() => { if (state.view === "resumen" && state.meta) render(); }, 60000);
  // comprobación de datos nuevos (meta.json pesa ~400 bytes, es baratísimo):
  // cada 2 min con jornada en vivo, cada 5 min si no
  setInterval(() => {
    const live = state.meta?.comps?.[comp()]?.isLive;
    const mins = Math.floor(Date.now() / 60000);
    if (mins % (live ? 2 : 5) === 0) autoCheck();
  }, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) autoCheck(); });
  // service worker: notificaciones en Android + app instalable
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
})();
</script>
