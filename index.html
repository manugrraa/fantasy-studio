/* =====================================================================
   CUENTA FANTASY: login oficial + servidor puente + MI LIGA
   El login va DIRECTO navegador -> login.laliga.es (servidor oficial B2C,
   admite CORS). La contraseña no pasa por ningún otro sitio y no se guarda.
   Las llamadas de datos con tu sesión van por TU Cloudflare Worker.
   ===================================================================== */
const AUTHCFG = {
  tokenBase: "https://login.laliga.es/laligadspprob2c.onmicrosoft.com/oauth2/v2.0/token",
  authorizeBase: "https://login.laliga.es/laligadspprob2c.onmicrosoft.com/oauth2/v2.0/authorize",
  loginPolicy: "B2C_1A_ResourceOwnerv2",
  altPolicy: "B2C_1A_5ULAIP_PARAMETRIZED_SIGNIN",
  clientId: "af88bcff-1157-40a0-b579-030728aacf0b",
  redirect: "authredirect://com.lfp.laligafantasy",
  socialRedirect: "https://jwt.ms", // única URL https registrada; jwt.ms solo muestra el code, no lo usa
};

/* --- Login social (Google / Apple / Facebook): flujo Authorization Code + PKCE.
   El usuario inicia sesión en la página OFICIAL de LaLiga y copia el enlace de
   vuelta (que lleva el ?code=). El intercambio code->token va directo del
   navegador al servidor de LaLiga (tiene CORS). No pasa por ningún tercero. --- */
function b64url(bytes){
  return btoa(String.fromCharCode(...bytes)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
async function pkcePair(){
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier));
  return { verifier, challenge: b64url(new Uint8Array(digest)) };
}
async function buildSocialUrl(){
  const { verifier, challenge } = await pkcePair();
  const stt = b64url(crypto.getRandomValues(new Uint8Array(12)));
  // localStorage y no sessionStorage: en iOS, al saltar a Safari para el login,
  // el sistema puede congelar la app instalada y perder la sesión temporal
  localStorage.setItem("fs_pkce", JSON.stringify({ verifier, state: stt, at: Date.now() }));
  const params = new URLSearchParams({
    p: AUTHCFG.altPolicy, client_id: AUTHCFG.clientId, response_type: "code",
    redirect_uri: AUTHCFG.socialRedirect, scope: "openid offline_access",
    code_challenge: challenge, code_challenge_method: "S256", state: stt, nonce: stt,
    response_mode: "query",
  });
  return `${AUTHCFG.authorizeBase}?${params.toString()}`;
}
async function socialExchange(pastedUrl){
  const raw = String(pastedUrl).trim();
  const errM = raw.match(/[?&#]error_description=([^&\s]+)/);
  if (errM) {
    const msg = decodeURIComponent(errM[1].replace(/\+/g, " ")).split("Correlation")[0];
    throw new Error("LaLiga devolvió un error: " + msg);
  }
  // acepta la URL completa de jwt.ms o el código suelto pegado a mano
  const m = raw.match(/[?&#]code=([^&\s]+)/) || (/^[A-Za-z0-9._~-]{20,}$/.test(raw) ? [null, raw] : null);
  if (!m) throw new Error("Ahí no viene el código. En la pestaña de jwt.ms, TOCA la barra de direcciones (se desplegará la dirección completa), cópiala entera y pégala aquí.");
  const code = decodeURIComponent(m[1]);
  const saved = JSON.parse(localStorage.getItem("fs_pkce") || "{}");
  if (!saved.verifier || (saved.at && Date.now() - saved.at > 30 * 60000)) {
    throw new Error("Sesión de login caducada. Pulsa de nuevo «Entrar con Google» y repite.");
  }
  const body = new URLSearchParams({
    grant_type: "authorization_code", client_id: AUTHCFG.clientId, code,
    redirect_uri: AUTHCFG.socialRedirect, code_verifier: saved.verifier, scope: "openid offline_access",
  });
  const r = await fetch(`${AUTHCFG.tokenBase}?p=${AUTHCFG.altPolicy}`, {
    method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body,
  });
  const d = await r.json().catch(() => ({}));
  // con login social B2C emite la sesión como id_token (sin access_token); vale igual como Bearer
  if (d.id_token && !d.access_token) d.access_token = d.id_token;
  if (!r.ok || !d.access_token) {
    const msg = (d.error_description || d.error || `El servidor respondió ${r.status} sin token (campos: ${Object.keys(d).join(",") || "ninguno"})`).split("\r")[0];
    throw new Error(msg);
  }
  d.expAt = Date.now() + ((+d.expires_in || +d.id_token_expires_in || 3000) * 1000);
  d.policy = AUTHCFG.altPolicy;
  localStorage.removeItem("fs_pkce");
  saveAuth(d);
  return d;
}
function saveAuth(a){
  state.auth = a;
  if (a) localStorage.setItem(LS.auth, JSON.stringify(a));
  else localStorage.removeItem(LS.auth);
}
function authValid(){ return !!(state.auth?.access_token && (state.auth.expAt || 0) > Date.now() + 60000); }

async function fantasyLogin(email, pass){
  const body = new URLSearchParams({
    grant_type: "password", client_id: AUTHCFG.clientId,
    scope: `openid ${AUTHCFG.clientId} offline_access`,
    redirect_uri: AUTHCFG.redirect, username: email, password: pass, response_type: "id_token",
  });
  const r = await fetch(`${AUTHCFG.tokenBase}?p=${AUTHCFG.loginPolicy}`, {
    method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body,
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok || !d.access_token) {
    const raw = (d.error_description || d.error || "Error de conexión con LaLiga").split("\r")[0];
    throw new Error(raw.includes("AADB2C90225") ? "Email o contraseña incorrectos" : raw);
  }
  d.expAt = Date.now() + ((+d.expires_in || 3000) * 1000);
  d.policy = AUTHCFG.loginPolicy;
  saveAuth(d);
  return d;
}

async function fantasyRefresh(){
  const rt = state.auth?.refresh_token;
  if (!rt) { saveAuth(null); throw new Error("Sesión caducada, vuelve a iniciar sesión"); }
  for (const pol of [state.auth.policy || AUTHCFG.loginPolicy, AUTHCFG.altPolicy]) {
    try {
      const body = new URLSearchParams({
        grant_type: "refresh_token", refresh_token: rt,
        client_id: AUTHCFG.clientId, scope: `openid ${AUTHCFG.clientId} offline_access`,
      });
      const r = await fetch(`${AUTHCFG.tokenBase}?p=${pol}`, {
        method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body,
      });
      const d = await r.json().catch(() => ({}));
      if (d.id_token && !d.access_token) d.access_token = d.id_token;
      if (r.ok && d.access_token) {
        d.expAt = Date.now() + ((+d.expires_in || +d.id_token_expires_in || 3000) * 1000);
        d.policy = pol;
        if (!d.refresh_token) d.refresh_token = rt;
        saveAuth(d);
        return d;
      }
    } catch(e) { /* probamos la otra política */ }
  }
  saveAuth(null);
  throw new Error("No se pudo renovar la sesión, vuelve a iniciar sesión");
}

function fantasyLogout(){
  saveAuth(null);
  state.liga = { loading:false, data:{}, errors:[] };
  render();
  toast("Sesión cerrada");
}

async function authFetch(path, opts){
  if (!state.workerUrl) throw new Error("Falta configurar el servidor puente");
  if (!state.auth) throw new Error("Inicia sesión primero");
  if (!authValid()) await fantasyRefresh();
  const doFetch = () => fetch(state.workerUrl.replace(/\/+$/, "") + path, {
    method: (opts && opts.method) || "GET",
    headers: {
      "Authorization": "Bearer " + state.auth.access_token, "x-lang": "es",
      ...(opts && opts.body ? { "Content-Type": "application/json" } : {}),
    },
    body: opts && opts.body ? JSON.stringify(opts.body) : undefined,
    signal: AbortSignal.timeout(15000),
  });
  let r = await doFetch();
  if (r.status === 401) { await fantasyRefresh(); r = await doFetch(); }
  const text = await r.text();
  let data = null;
  try { data = text.trim() ? JSON.parse(text) : null; } catch(e) { data = text; }
  if (!r.ok) {
    const err = new Error(`HTTP ${r.status} en ${path.split("?")[0]}`);
    err.status = r.status; err.data = data;
    throw err;
  }
  return data;
}

const unwrapList = d => Array.isArray(d) ? d : (Array.isArray(d?.elements) ? d.elements : (Array.isArray(d?.leagues) ? d.leagues : []));

async function loadLiga(force){
  const c = comp();
  const st = state.liga;
  if (st.loading) return;
  if (!force && st.data[c] && Date.now() - (st.data[c].at || 0) < 120000) return;
  if (!state.workerUrl || !state.auth) return;
  st.loading = true; st.errors = [];
  if (state.view === "liga") render();
  const out = { at: Date.now() };
  const errs = [];
  const step = async (key, fn) => {
    try { out[key] = await fn(); }
    catch(e) {
      errs.push({ key, msg: e.message, extra: (typeof e.data === "object" && e.data) ? JSON.stringify(e.data).slice(0, 200) : String(e.data || "").slice(0, 200) });
    }
  };

  await step("me", () => authFetch("/api/v4/user/me?x-lang=es"));
  await step("leagues", async () => unwrapList(await authFetch(`/api/v1/competition/${c}/leagues?x-lang=es`)));
  const leagues = out.leagues || [];
  let sel = state.myLeague[c];
  if (!sel || !leagues.some(l => String(l.id) === String(sel.leagueId))) {
    const l0 = leagues[0];
    sel = l0 ? { leagueId: String(l0.id), name: l0.name || "Mi liga", teamId: null } : null;
  }
  if (sel) {
    const lg = leagues.find(l => String(l.id) === String(sel.leagueId));
    const tid = lg?.team?.id ?? lg?.teamId ?? null;
    if (tid) sel.teamId = String(tid);
    sel.name = lg?.name || sel.name;
    state.myLeague[c] = sel;
    localStorage.setItem(LS.league, JSON.stringify(state.myLeague));

    await step("standing", async () => unwrapList(await authFetch(`/api/v1/competition/${c}/leagues/${sel.leagueId}/standing?x-lang=es`)));

    // si la liga no traía mi teamId, lo buscamos en la clasificación por el manager
    if (!sel.teamId && out.standing && out.me) {
      const meId = out.me.id ?? out.me.userId ?? null;
      const meName = out.me.managerName ?? out.me.nickname ?? out.me.name ?? null;
      const row = out.standing.find(r => {
        const m = (r.team && r.team.manager) || r.manager || {};
        return (meId && String(m.id ?? m.userId) === String(meId)) || (meName && (m.managerName === meName || m.name === meName));
      });
      const rid = row?.team?.id ?? row?.teamId ?? null;
      if (rid) { sel.teamId = String(rid); localStorage.setItem(LS.league, JSON.stringify(state.myLeague)); }
    }

    await step("market", async () => unwrapList(await authFetch(`/api/v1/competition/${c}/league/${sel.leagueId}/market?x-lang=es`)));
    await step("activity", () => authFetch(`/api/v1/competition/${c}/leagues/${sel.leagueId}/activity/0?x-lang=es`));
    if (sel.teamId) {
      await step("money", () => authFetch(`/api/v1/competition/${c}/teams/${sel.teamId}/money?x-lang=es`));
      await step("team", () => authFetch(`/api/v1/competition/${c}/leagues/${sel.leagueId}/teams/${sel.teamId}?x-lang=es`));
    }
  }
  st.data[c] = out;
  st.errors = errs;
  st.loading = false;
  if (state.view === "liga") render();
}

function ligaMoney(m){
  if (m == null) return null;
  if (typeof m === "number") return m;
  return m.teamMoney ?? m.money ?? m.balance ?? null;
}

/* =====================================================================
   MI LIGA · historial completo de actividad, presupuestos y operaciones
   ===================================================================== */
const INITIAL_BUDGET = 100000000;

async function loadFullActivity(c, force){
  const sel = state.myLeague[c];
  if (!sel) return;
  const st = state.actFull[c] || (state.actFull[c] = { items: [], done: false, loading: false });
  if (st.loading || (st.done && !force)) return;
  st.loading = true;
  if (force) { st.items = []; st.done = false; }
  try {
    for (let page = 0; page < 40; page++) {
      const raw = await authFetch(`/api/v1/competition/${c}/leagues/${sel.leagueId}/activity/${page}?x-lang=es`);
      const items = unwrapList(raw) || [];
      if (!items.length) break;
      st.items.push(...items);
      if (items.length < 5) break; // última página
    }
    st.done = true;
  } catch(e) {
    state.liga.errors.push({ key: "actividad completa", msg: e.message, extra: "" });
  }
  st.loading = false;
  if (state.view === "liga") render();
}

/* normaliza un item de actividad a {kind, teamId, manager, pid, name, money, date} */
function parseAct(a){
  const pm = a.playerMaster || a.player || null;
  const team = a.team || a.buyerTeam || null;
  const kind0 = String(a.title || a.type || a.operation || "").toLowerCase();
  let kind = "otro";
  if (/venta|vendido|sold|sale/.test(kind0)) kind = "sell";
  else if (/compra|fichaje|comprado|buy|bought|puja/.test(kind0)) kind = "buy";
  else if (/cl[aá]usula|buyout/.test(kind0)) kind = "clause";
  return {
    id: String(a.id ?? a.activityId ?? (kind0 + (a.date || "") + (pm?.id || ""))),
    kind,
    kindRaw: a.title || a.type || a.operation || "",
    teamId: team?.id != null ? String(team.id) : null,
    manager: team?.manager?.managerName || team?.manager?.name || a.managerName || "",
    pid: pm?.id != null ? String(pm.id) : null,
    name: pm?.nickname || pm?.name || "",
    money: a.money ?? a.amount ?? a.price ?? null,
    date: a.date || a.createdAt || null,
  };
}

/* presupuestos estimados de todos los equipos a partir del historial completo.
   Base: 100M + ventas − compras. Los ingresos que no vemos (premios por puntos,
   jornadas…) se calibran con MI dinero real y se reparten por puntos. */
function computeBudgets(c){
  const d = state.liga.data[c];
  const act = state.actFull[c];
  const standing = d?.standing || [];
  if (!act?.done || !standing.length) return null;

  const by = {}; // teamId -> {buys, sells, nBuys, nSells}
  for (const raw of act.items) {
    const a = parseAct(raw);
    if (!a.teamId || a.money == null) continue;
    const t = by[a.teamId] || (by[a.teamId] = { buys: 0, sells: 0, nBuys: 0, nSells: 0 });
    if (a.kind === "buy" || a.kind === "clause") { t.buys += +a.money; t.nBuys++; }
    else if (a.kind === "sell") { t.sells += +a.money; t.nSells++; }
  }

  const myId = state.myLeague[c]?.teamId;
  const myMoney = ligaMoney(d?.money);
  const rows = standing.map((r, i) => {
    const team = r.team || r;
    const tid = String(team.id ?? "");
    const ops = by[tid] || { buys: 0, sells: 0, nBuys: 0, nSells: 0 };
    return {
      tid, pos: r.position ?? i + 1,
      name: team.name || team.manager?.managerName || "Equipo",
      manager: team.manager?.managerName || team.manager?.name || "",
      points: +(r.points ?? r.teamPoints ?? 0),
      teamValue: team.teamValue != null ? +team.teamValue : null,
      ...ops,
      base: INITIAL_BUDGET - ops.buys + ops.sells,
      isMe: myId && tid === String(myId),
    };
  });

  // norma del juego: cada punto conseguido paga 100.000 €
  const rate = 100000;
  // mi dinero real sirve de contraste: si la fórmula se desvía mucho de él,
  // el historial visible no cubre toda la liga y lo avisamos
  let incomplete = false;
  const me = rows.find(r => r.isMe);
  if (me && myMoney != null) {
    const deviation = myMoney - (me.base + rate * me.points);
    if (Math.abs(deviation) > 3000000) incomplete = true;
  }
  for (const r of rows) {
    r.extra = Math.round(rate * r.points);
    r.budget = r.isMe && myMoney != null ? myMoney : r.base + r.extra;
  }
  return { rows, calibrated: false, rate, incomplete };
}

/* valor histórico de un jugador en una fecha (para profit de plantillas iniciales) */
function histValueAt(c, pid, dateInt){
  const h = (state.history[c] || {})[String(pid)];
  if (!h || !h.length) return null;
  let best = h[0];
  for (const e of h) { if (e[0] <= dateInt) best = e; else break; }
  return best[1];
}

/* mapa de precios de compra reales por equipo+jugador según la actividad */
function purchaseMap(c){
  const act = state.actFull[c];
  const map = {};
  if (!act?.done) return map;
  for (const raw of act.items) {
    const a = parseAct(raw);
    if ((a.kind === "buy" || a.kind === "clause") && a.teamId && a.pid && a.money != null) {
      map[a.teamId + ":" + a.pid] = +a.money; // la actividad viene de nueva a vieja: nos quedamos la compra más reciente
    }
  }
  return map;
}

/* ---------- sincronizar movimientos reales de mi liga ---------- */
async function syncRealMoves(){
  const c = comp();
  if (!state.auth || !state.myLeague[c]) { toast("Conéctate en Mi Liga primero", "err"); return; }
  toast("Leyendo el historial de tu liga…");
  await loadFullActivity(c);
  const act = state.actFull[c];
  if (!act?.done) { toast("No se pudo leer la actividad", "err"); return; }
  const myId = String(state.myLeague[c].teamId || "");
  const existing = new Set(state.moves[c].map(m => m.actId).filter(Boolean));
  const news = [];
  for (const raw of act.items) {
    const a = parseAct(raw);
    if (!a.teamId || a.teamId !== myId || a.money == null || !a.name) continue;
    if (a.kind !== "buy" && a.kind !== "sell" && a.kind !== "clause") continue;
    if (existing.has(a.id)) continue;
    news.push(a);
  }
  if (!news.length) { toast("Movimientos ya al día con tu liga", "ok"); return; }
  const buys = news.filter(a => a.kind !== "sell").length;
  const sells = news.length - buys;
  if (!confirm(`Se importarán ${news.length} movimientos reales de tu liga (${buys} compras, ${sells} ventas). Las ventas calculan su beneficio contra tu precio de compra en Mi Plantilla si lo tienes. ¿Continuar?`)) return;
  for (const a of news.reverse()) { // de viejo a nuevo
    const date = a.date ? String(a.date).slice(0, 10) : todayISO();
    if (a.kind === "sell") {
      const entry = state.squad[c].find(e => String(e.pid) === a.pid);
      const buyPrice = entry ? entry.buyPrice : null;
      state.moves[c].push({ id: uid(), actId: a.id, real: true, type: "sell", pid: a.pid, name: a.name, price: +a.money, date, buyPrice, profit: buyPrice != null ? +a.money - buyPrice : null });
      if (entry) state.squad[c] = state.squad[c].filter(e => e.id !== entry.id);
    } else {
      const local = state.byId[c].get(a.pid);
      state.moves[c].push({ id: uid(), actId: a.id, real: true, type: "buy", pid: a.pid, name: a.name, pos: local ? String(local.positionId) : null, price: +a.money, date });
      if (a.pid && local && !squadEntry(a.pid)) {
        state.squad[c].push({ id: uid(), pid: a.pid, name: a.name, pos: String(local.positionId), teamId: String(local.teamId), buyPrice: +a.money, buyDate: date, custom: false, imported: true });
      }
    }
  }
  persist();
  render();
  toast(news.length + " movimientos reales importados", "ok");
}

      <a class="btn-acc" id="socialLink" style="width:100%;text-decoration:none;opacity:.6;pointer-events:none" href="#" target="_blank" rel="noopener" onclick="return socialClicked()">${IC.user.replace('class="ic"','class="ic" style="width:16px;height:16px"')} Entrar con Google / Apple / Facebook</a>
      <div id="socialStep"></div>
    </div>

    <details class="card" style="padding:0" id="emailDetails">
      <summary style="padding:14px 16px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--text-2);list-style:none">
        ${IC.lock.replace('class="ic"','class="ic" style="width:14px;height:14px;vertical-align:-3px"')} Tengo email y contraseña de LaLiga</summary>
      <div style="padding:0 16px 16px">
        <div class="field"><label>Email de tu cuenta LaLiga</label>
          <input id="loginEmail" type="email" autocomplete="username" placeholder="tu@email.com"></div>
        <div class="field"><label>Contraseña</label>
          <input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••"></div>
        <button class="btn-acc" style="width:100%" id="loginGo" onclick="doLogin()">Entrar</button>
      </div>
    </details>

    <div style="font-size:11.5px;color:var(--text-3);margin-top:12px;line-height:1.5">
      ${IC.lock.replace('class="ic"','class="ic" style="width:11px;height:11px;vertical-align:-1.5px"')}
      El inicio de sesión ocurre <b>solo</b> en el servidor oficial de LaLiga (login.laliga.es). Ni tu contraseña
      ni tu login de Google pasan por Fantasy Studio ni por el servidor puente: aquí solo queda la sesión ya creada,
      guardada en este dispositivo.
    </div>
    <button class="btn-ghost" style="width:100%;margin-top:12px" onclick="changeWorkerUrl()">Cambiar servidor puente</button>`;
  }

  // Paso 3: datos de mi liga
  const d = state.liga.data[c];
  const sel = state.myLeague[c];
  if (!d) {
    setTimeout(() => loadLiga(), 30);
    return `<div class="skeleton">${state.liga.loading ? "Cargando tu liga…" : "Conectando…"}</div>`;
  }

  const me = d.me || {};
  const myName = me.managerName || me.nickname || me.name || "Mánager";
  const leagues = d.leagues || [];
  const money = ligaMoney(d.money);

  const headHtml = `
  <div class="card" style="padding:13px 15px;margin-bottom:12px;display:flex;align-items:center;gap:11px;flex-wrap:wrap">
    ${IC.user.replace('class="ic"','class="ic" style="width:20px;height:20px;color:var(--acc)"')}
    <div style="flex:1;min-width:130px">
      <div style="font-size:14px;font-weight:700">${esc(myName)}</div>
      <div style="font-size:11.5px;color:var(--text-3)">${sel ? esc(sel.name) : "Sin liga en esta competición"}${money != null ? ` · <b style="color:var(--acc)">${fmtM(money)} €</b>` : ""}</div>
    </div>
    <button class="icon-btn" onclick="loadLiga(true)" title="Recargar">${state.liga.loading ? IC.refresh.replace('class="ic"','class="ic spinning"') : IC.refresh}</button>
    <button class="btn-ghost" style="padding:8px 12px;font-size:12px" onclick="fantasyLogout()">Salir</button>
  </div>
  ${leagues.length > 1 ? `<div class="chips-row no-scrollbar">${leagues.map(l =>
    `<button class="chip ${sel && String(l.id) === String(sel.leagueId) ? "active" : ""}" onclick="pickLeague('${esc(String(l.id))}')">${esc(l.name || "Liga")}</button>`).join("")}</div>` : ""}`;

  if (!leagues.length) {
    return headHtml + `<div class="card"><div class="empty-state"><div class="big">🏝️</div>
      No se ha encontrado ninguna liga tuya en ${MODES[state.mode].label}.<br>
      Prueba a cambiar de modo arriba, o recarga.</div></div>
      ${diagHtml()}`;
  }

  const TABS = [["mercado","Mercado del día"],["equipo","Mi equipo"],["rivales","Rivales"],["actividad","Actividad"]];
  const tabsHtml = `<div class="chips-row no-scrollbar" style="margin-bottom:12px">${TABS.map(([id,l]) =>
    `<button class="chip ${state.ligaTab === id ? "active" : ""}" onclick="state.ligaTab='${id}';render()">${l}</button>`).join("")}</div>`;

  let body = "";
  if (state.ligaTab === "mercado") body = ligaTabMercado(c, d);
  else if (state.ligaTab === "equipo") body = ligaTabEquipo(c, d);
  else if (state.ligaTab === "rivales") body = ligaTabRivales(c, d);
  else body = ligaTabActividad(c, d);

  return headHtml + tabsHtml + body + diagHtml() +
    `<div style="font-size:11px;color:var(--text-3);margin-top:14px;line-height:1.5">
      Las pujas y ventas van a tu liga REAL, siempre con confirmación previa.
    </div>`;
}

/* rivales que podrían pujar un precio dado: dinero estimado + deuda permitida
   (en el juego puedes endeudarte hasta el 20% del valor de tu plantilla) */
function possibleBidders(c, price, excludeTid){
  const B = computeBudgets(c);
  if (!B) return null;
  return B.rows
    .filter(r => !r.isMe && String(r.tid) !== String(excludeTid || ""))
    .map(r => ({ ...r, maxBid: r.budget + (r.teamValue ? Math.round(r.teamValue * 0.2) : 0) }))
    .filter(r => r.maxBid >= price)
    .sort((a, b) => b.maxBid - a.maxBid);
}

/* --- pestaña: mercado del día de mi liga --- */
function ligaTabMercado(c, d){
  const market = d.market || [];
  if (!market.length) return `<div class="card"><div class="empty-state"><div class="big">🛒</div>Mercado vacío ahora mismo</div></div>`;
  const act = state.actFull[c];
  if (!act || (!act.done && !act.loading)) setTimeout(() => loadFullActivity(c), 30);
  const biddersReady = !!(act && act.done);
  return `${!biddersReady ? `<div style="font-size:11px;color:var(--text-3);margin-bottom:8px">Analizando el historial para estimar posibles pujadores…</div>` : ""}
  <div class="card">${market.map((it, idx) => {
    const pm = it.playerMaster || it.player || it;
    const pid = String(pm.id ?? "");
    const price = it.salePrice ?? it.price ?? pm.marketValue ?? 0;
    const bids = it.numberOfBids ?? it.bids ?? null;
    const sellerName = it.sellerTeam?.manager?.managerName || it.sellerTeam?.name || null;
    const mine = state.myLeague[c]?.teamId && it.sellerTeam?.id != null && String(it.sellerTeam.id) === String(state.myLeague[c].teamId);
    const exp = it.expirationDate || it.expiration || null;
    const btn = mine
      ? `<button class="btn-ghost btn-danger" style="padding:7px 11px;font-size:11.5px" onclick="event.stopPropagation();withdrawFromMarket('${esc(String(it.id))}','${esc(pm.nickname || "jugador")}')">Retirar</button>`
      : `<button class="btn-acc" style="padding:7px 13px;font-size:12px" onclick="event.stopPropagation();bidFromMarket(${idx})">Pujar</button>`;
    // posibles pujadores: rivales a los que les llega el dinero para este precio
    let biddersHtml = "";
    if (biddersReady && bids != null && bids > 0) {
      const cands = possibleBidders(c, +price, it.sellerTeam?.id);
      if (cands) biddersHtml = `<div style="padding:0 12px 10px 62px;font-size:11px;color:var(--text-3);line-height:1.6">
        ${cands.length
          ? `🎯 Posibles pujadores: ` + cands.slice(0, 4).map(r => `<span class="badge" style="font-size:10px;padding:2px 7px">${esc(r.manager || r.name)} · hasta ${fmtM(r.maxBid)}</span>`).join(" ") + (cands.length > 4 ? ` +${cands.length - 4}` : "")
          : `🎯 A ningún rival le llega el dinero para este precio`}
      </div>`;
    }
    return ligaPlayerRow(pm, `<div class="p-right" style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">
      <div><span class="p-val">${fmtM(+price)} €</span>
        <div class="p-sub">${bids != null ? bids + (bids === 1 ? " puja" : " pujas") : ""}${sellerName ? " · " + esc(sellerName) : ""}${exp ? " · hasta " + new Date(exp).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}) : ""}</div></div>
      ${btn}
    </div>`) + biddersHtml;
  }).join("")}</div>`;
}

/* abre el modal de puja leyendo el item del mercado por índice (evita
   serializar objetos en el onclick) */
function bidFromMarket(idx){
  const c = comp();
  const it = (state.liga.data[c]?.market || [])[idx];
  if (!it) return;
  const pm = it.playerMaster || it.player || it;
  const myBid = it.bid || it.myBid || null;
  openBidModal(String(it.id), String(pm.id ?? ""), +(it.salePrice ?? it.price ?? pm.marketValue ?? 0),
    myBid ? { id: String(myBid.id ?? ""), money: +(myBid.money ?? 0) } : null);
}

/* --- pestaña: mi equipo real --- */
function ligaTabEquipo(c, d){
  const teamPlayers = d.team ? (d.team.players || d.team.playerTeams || []) : [];
  if (!teamPlayers.length) return `<div class="card"><div class="empty-state"><div class="big">⚽</div>No se pudo leer tu equipo</div></div>`;
  const market = d.market || [];
  const onSale = new Set(market.filter(it => it.sellerTeam?.id != null && String(it.sellerTeam.id) === String(state.myLeague[c]?.teamId || "")).map(it => String((it.playerMaster || it.player || it).id ?? "")));
  return `
  <div class="section-title">Mi equipo real (${teamPlayers.length})
    <button style="margin-left:auto;color:var(--acc);font-size:11.5px;font-weight:700" onclick="importLigaSquad()">Importar a Mi Plantilla ›</button>
  </div>
  <div class="card">${teamPlayers.map(x => {
    const pm = x.playerMaster || x.player || x;
    const pid = String(pm.id ?? "");
    const clause = x.buyoutClause ?? null;
    const local = state.byId[c].get(pid);
    const val = local ? pVal(local) : (pm.marketValue != null ? +pm.marketValue : null);
    const dd = local ? deltas(c, pid) : null;
    const selling = onSale.has(pid);
    return ligaPlayerRow(pm, `<div class="p-right" style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">
      <div><span class="p-val">${dd ? trendIcon(dd.d1) + " " : ""}${val != null ? fmtM(val) + " €" : "—"}</span>
        <div class="p-sub">${clause != null ? "cláusula " + fmtM(+clause) : ""}</div></div>
      ${selling
        ? `<span class="badge orange">en venta</span>`
        : `<button class="btn-ghost" style="padding:7px 11px;font-size:11.5px" onclick="event.stopPropagation();openSellRealModal('${pid}')">Vender</button>`}
    </div>`);
  }).join("")}</div>`;
}

/* --- pestaña: rivales (presupuestos, equipos y profit) --- */
function ligaTabRivales(c, d){
  const act = state.actFull[c];
  if (!act || !act.done) {
    if (!act || !act.loading) setTimeout(() => loadFullActivity(c), 30);
    return `<div class="card"><div class="empty-state"><div class="big">🕵️</div>
      Analizando todo el historial de tu liga…<br>
      <span style="font-size:11.5px;color:var(--text-3)">compras, ventas y cláusulas de cada mánager</span></div></div>`;
  }
  const B = computeBudgets(c);
  if (!B) return `<div class="card"><div class="empty-state">Sin datos de clasificación todavía</div></div>`;
  const pmap = purchaseMap(c);
  const dates = act.items.map(a => { const dt = parseAct(a).date; return dt ? +String(dt).slice(0,10).replace(/-/g,"") : null; }).filter(Boolean);
  const startInt = dates.length ? Math.min(...dates) : null;

  return `
  <div style="font-size:11.5px;color:var(--text-3);margin-bottom:10px;line-height:1.5">
    Presupuesto estimado: 100M iniciales + ventas − compras + <b>100.000 € por punto</b>. Tu fila usa tu dinero real.
    ${B.incomplete ? `<br><span style="color:var(--orange)">⚠ La fórmula no cuadra con tu dinero real: el historial visible quizá no cubre toda la liga. Tómalo como aproximación.</span>` : ""}
  </div>
  ${B.rows.map(r => {
    const open = state.rivalOpen === r.tid;
    const team = (state.rivalTeams[c] || {})[r.tid];
    let bodyHtml = "";
    if (open) {
      if (!team) bodyHtml = `<div class="rival-body"><div class="empty-state" style="padding:18px">Cargando equipo…</div></div>`;
      else if (team.error) bodyHtml = `<div class="rival-body"><div class="empty-state" style="padding:18px">${esc(team.error)}</div></div>`;
      else {
        const players = team.players || team.playerTeams || [];
        bodyHtml = `<div class="rival-body">
          <div class="budget-line" style="padding-top:10px"><span>Compras (${r.nBuys})</span><b class="down">−${fmtM(r.buys)}</b></div>
          <div class="budget-line"><span>Ventas (${r.nSells})</span><b class="up">+${fmtM(r.sells)}</b></div>
          ${r.extra ? `<div class="budget-line"><span>Premios estimados (${r.points} pts)</span><b class="${cls(r.extra)}">${fmtMSign(r.extra)}</b></div>` : ""}
          <div class="budget-line total"><span>Presupuesto estimado</span><b style="color:var(--acc)">${fmtM(r.budget)} €</b></div>
          ${players.map(x => {
            const pm = x.playerMaster || x.player || x;
            const pid = String(pm.id ?? "");
            const local = state.byId[c].get(pid);
            const val = local ? pVal(local) : (pm.marketValue != null ? +pm.marketValue : null);
            const bought = pmap[r.tid + ":" + pid];
            const paid = bought != null ? bought : (startInt ? histValueAt(c, pid, startInt) : null);
            const profit = (val != null && paid != null) ? val - paid : null;
            return ligaPlayerRow(pm, `<div class="p-right">
              <div class="p-val">${val != null ? fmtM(val) + " €" : "—"}</div>
              <div class="p-sub">${profit != null ? `<span class="delta-pill ${cls(profit)}">${fmtMSign(profit)}${bought == null ? " ≈" : ""}</span>` : ""}</div>
            </div>`);
          }).join("")}
          ${players.length ? `<div style="font-size:10.5px;color:var(--text-3);padding:8px 14px">Profit = valor actual − lo que pagó. Con ≈ viene de la plantilla inicial: se usa su valor del día que arrancó la liga.</div>` : ""}
        </div>`;
      }
    }
    return `<div class="card rival-card ${r.isMe ? "obj-hit" : ""}">
      <div class="rival-head" onclick="toggleRival('${r.tid}')">
        <span class="rival-pos ${r.isMe ? "me" : ""}">${r.pos}</span>
        <div style="flex:1;min-width:0">
          <div style="font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.name)}${r.isMe ? ` <span class="badge acc" style="padding:1px 6px;font-size:9px">YO</span>` : ""}</div>
          <div style="font-size:11px;color:var(--text-3)">${esc(r.manager)} · ${r.points} pts${r.teamValue != null ? " · equipo " + fmtM(r.teamValue) : ""}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:13.5px;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums">${fmtM(r.budget)} €</div>
          <div style="font-size:10px;color:var(--text-3)">presupuesto est.</div>
        </div>
        <span style="color:var(--text-3);display:inline-block;transform:rotate(${open ? 90 : 0}deg);transition:transform .15s">›</span>
      </div>
      ${bodyHtml}
    </div>`;
  }).join("")}
  <button class="btn-ghost" style="width:100%;margin-top:6px" onclick="loadFullActivity(comp(), true)">Recalcular con el historial más reciente</button>`;
}

/* --- pestaña: actividad --- */
function ligaTabActividad(c, d){
  const act = state.actFull[c];
  const items = act && act.done ? act.items : unwrapList(d.activity) || [];
  if (!items.length) return `<div class="card"><div class="empty-state"><div class="big">📭</div>Sin actividad reciente</div></div>`;
  return `
  ${!(act && act.done) ? `<button class="btn-ghost" style="width:100%;margin-bottom:10px" onclick="loadFullActivity(comp())">Cargar historial completo</button>` : `<div style="font-size:11.5px;color:var(--text-3);margin-bottom:10px">${items.length} operaciones en total</div>`}
  <div class="card">${items.slice(0, 60).map(raw => {
    const a = parseAct(raw);
    const isSell = a.kind === "sell";
    return `<div class="mv-row">
      <div class="mv-icon ${isSell ? "sell" : "buy"}">${isSell ? IC.upar : IC.down}</div>
      <div class="p-main">
        <div class="p-name">${esc(a.name || a.kindRaw || "Operación")}</div>
        <div class="p-meta">${esc(String(a.kindRaw))}${a.manager ? " · " + esc(a.manager) : ""}${a.date ? " · " + fmtDate(a.date) : ""}</div>
      </div>
      ${a.money != null ? `<div class="p-right"><div class="p-val">${fmtM(+a.money)} €</div></div>` : ""}
    </div>`;
  }).join("")}</div>`;
}

function diagHtml(){
  const errs = state.liga.errors || [];
  if (!errs.length) return "";
  return `<div class="section-title" style="color:var(--orange)">Diagnóstico (${errs.length})</div>
  <div class="card" style="padding:12px 14px;font-size:11.5px;color:var(--text-2);line-height:1.6">
    ${errs.map(e => `<div style="margin-bottom:6px"><b>${esc(e.key)}</b>: ${esc(e.msg)}${e.extra ? `<br><span style="color:var(--text-3)">${esc(e.extra)}</span>` : ""}</div>`).join("")}
    <div style="color:var(--text-3);margin-top:6px">Haz captura de esto si algo no carga y pásasela a Claude.</div>
  </div>`;
}

function saveWorkerUrl(){
  const el = document.getElementById("workerUrl");
  let v = (el?.value || "").trim();
  if (v && !/^https?:\/\//.test(v)) v = "https://" + v;
  if (!v || !v.includes(".workers.dev")) {
    if (!v || !confirm("Esa URL no parece de un Cloudflare Worker (*.workers.dev). ¿Usarla igualmente?")) { toast("Revisa la URL del Worker", "err"); return; }
  }
  state.workerUrl = v.replace(/\/+$/, "");
  localStorage.setItem(LS.worker, state.workerUrl);
  toast("Servidor puente guardado", "ok");
  render();
}
function changeWorkerUrl(){
  const v = prompt("URL de tu Cloudflare Worker:", state.workerUrl);
  if (v === null) return;
  state.workerUrl = v.trim().replace(/\/+$/, "");
  localStorage.setItem(LS.worker, state.workerUrl);
  render();
}
async function doLogin(){
  const email = document.getElementById("loginEmail")?.value.trim();
  const pass = document.getElementById("loginPass")?.value;
  const btn = document.getElementById("loginGo");
  if (!email || !pass) { toast("Pon email y contraseña", "err"); return; }
  btn.disabled = true; btn.textContent = "Entrando…";
  try {
    await fantasyLogin(email, pass);
    toast("Sesión iniciada", "ok");
    vibrate(14);
    state.liga = { loading:false, data:{}, errors:[] };
    render();
    loadLiga(true);
  } catch(e) {
    toast(e.message, "err");
    btn.disabled = false; btn.textContent = "Entrar";
  }
}
/* Prepara el enlace de login ANTES de que el usuario toque: al ser un <a> con
   href real, Safari (incluida la app instalada en pantalla de inicio) lo abre
   siempre, sin bloqueador de ventanas emergentes. */
async function prepareSocial(){
  const a = document.getElementById("socialLink");
  if (!a) return;
  try {
    a.href = await buildSocialUrl();
    a.style.opacity = "";
    a.style.pointerEvents = "";
  } catch(e) {
    a.textContent = "Este navegador no permite el login seguro (PKCE)";
  }
}
function socialClicked(){
  const a = document.getElementById("socialLink");
  if (!a || !a.href || a.getAttribute("href") === "#") return false;
  const box = document.getElementById("socialStep");
  if (box && !box.innerHTML) box.innerHTML = `
    <div style="border-top:1px solid var(--border);margin-top:14px;padding-top:14px">
      <div style="font-size:12.5px;color:var(--text-2);line-height:1.55;margin-bottom:10px">
        Se está abriendo la página de LaLiga. Inicia sesión con tu método de siempre.
        Al terminar verás una página de <b>jwt.ms</b> (puede parecer vacía — es normal).<br><br>
        <b>1.</b> En esa página, <b>toca la barra de direcciones</b> de arriba: aunque solo se lea
        «jwt.ms», al tocarla se despliega la dirección completa (larga, con <b>code=</b> dentro).<br>
        <b>2.</b> Cópiala entera (mantén pulsado → Seleccionar todo → Copiar), vuelve aquí y pégala:
      </div>
      <div class="field" style="margin-bottom:10px">
        <input id="socialUrl" placeholder="https://jwt.ms/?code=…" autocomplete="off" inputmode="url">
      </div>
      <button class="btn-acc" style="width:100%" id="socialGo" onclick="finishSocial()">Terminar de conectar</button>
    </div>`;
  return true; // deja que el enlace navegue (nueva pestaña / Safari)
}
async function finishSocial(){
  const inp = document.getElementById("socialUrl");
  const btn = document.getElementById("socialGo");
  const val = (inp?.value || "").trim();
  if (!val) { toast("Pega el enlace de jwt.ms", "err"); return; }
  if (btn) { btn.disabled = true; btn.textContent = "Conectando…"; }
  try {
    await socialExchange(val);
    toast("Sesión iniciada", "ok");
    vibrate(14);
    state.liga = { loading:false, data:{}, errors:[] };
    render();
    loadLiga(true);
  } catch(e) {
    toast(e.message, "err");
    if (btn) { btn.disabled = false; btn.textContent = "Terminar de conectar"; }
  }
}
function pickLeague(id){
  const c = comp();
  const d = state.liga.data[c];
  const lg = (d?.leagues || []).find(l => String(l.id) === String(id));
  state.myLeague[c] = { leagueId: String(id), name: lg?.name || "Mi liga", teamId: lg?.team?.id ? String(lg.team.id) : null };
  localStorage.setItem(LS.league, JSON.stringify(state.myLeague));
  state.liga.data[c] = null;
  render();
  loadLiga(true);
}
function importLigaSquad(){
  const c = comp();
  const d = state.liga.data[c];
  const list = d?.team ? (d.team.players || d.team.playerTeams || []) : [];
  if (!list.length) { toast("No hay equipo que importar", "err"); return; }
  const nuevos = list.filter(x => { const pm = x.playerMaster || x.player || x; return pm?.id && !squadEntry(pm.id); });
  if (!nuevos.length) { toast("Ya están todos en Mi Plantilla"); return; }
  if (!confirm(`Se añadirán ${nuevos.length} jugadores a Mi Plantilla con su valor de mercado actual como precio de compra (edítalo luego si pagaste otra cosa). ¿Continuar?`)) return;
  for (const x of nuevos) {
    const pm = x.playerMaster || x.player || x;
    const local = state.byId[c].get(String(pm.id));
    const price = +(x.buyingPrice ?? x.purchasePrice ?? pm.marketValue ?? (local ? pVal(local) : 0)) || 0;
    const entry = { id: uid(), pid: String(pm.id), name: pm.nickname || pm.name || (local?.nickname ?? "Jugador"),
      pos: String(pm.positionId ?? local?.positionId ?? "3"), teamId: String(pm.teamId ?? local?.teamId ?? ""),
      buyPrice: price, buyDate: todayISO(), custom: !local, imported: true };
    state.squad[c].push(entry);
    state.moves[c].push({ id: uid(), type:"buy", pid: entry.pid, name: entry.name, pos: entry.pos, price, date: entry.buyDate, linkedEntry: entry.id, imported: true });
  }
  persist();
  toast(nuevos.length + " jugadores importados", "ok");
  render();
}

/* =====================================================================
   MENÚ: EXPORTAR / IMPORTAR
   ===================================================================== */
function openMenu(){
  const updated = state.meta ? new Date(state.meta.updatedAt).toLocaleString("es-ES") : "—";
  openModal(`
    ${modalHead("Fantasy Studio")}
    <div class="modal-body">
      <div class="card" style="padding:13px 15px;margin-bottom:14px;font-size:12.5px;color:var(--text-2);line-height:1.55">
        Datos de la API oficial de LaLiga Fantasy, actualizados automáticamente varias veces al día.<br>
        Última publicación: <b>${updated}</b><br><br>
        Tu plantilla, movimientos y vigilados se guardan <b>en este dispositivo</b>. Usa Exportar para hacer copia o pasarlos a otro móvil.
      </div>
      ${("Notification" in window) ? (Notification.permission === "granted"
        ? `<div class="badge green" style="margin-bottom:12px">${IC.bell.replace('class="ic"','class="ic" style="width:12px;height:12px"')} Avisos de objetivos activados</div>`
        : `<button class="btn-ghost" style="width:100%;margin-bottom:9px" onclick="Notification.requestPermission().then(()=>{closeModal();openMenu()})">${IC.bell.replace('class="ic"','class="ic" style="width:14px;height:14px"')} Activar avisos de objetivos</button>`) : ""}
      <button class="btn-ghost" style="width:100%;margin-bottom:9px" onclick="closeModal();setView('liga')">${IC.user.replace('class="ic"','class="ic" style="width:14px;height:14px"')} ${state.auth ? "Mi Liga (cuenta conectada)" : "Enlazar mi cuenta del Fantasy"}</button>
      <details class="card" style="padding:0;margin-bottom:9px">
        <summary style="padding:12px 15px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text-2);list-style:none">📬 Resumen diario por Telegram (configurar)</summary>
        <div style="padding:0 15px 14px;font-size:12px;color:var(--text-2);line-height:1.65">
          Cada mañana a las 8:45 puedes recibir en Telegram las subidas, bajadas y chollos del día. Configuración (una vez, 3 min):<br>
          <b>1.</b> En Telegram, habla con <b>@BotFather</b> → /newbot → ponle nombre → te da un <b>token</b>.<br>
          <b>2.</b> Escríbele un «hola» a tu bot recién creado, y luego abre
          <span style="color:var(--acc)">api.telegram.org/botTU_TOKEN/getUpdates</span> en el navegador: el número en <b>"chat":{"id":…}</b> es tu <b>chat id</b>.<br>
          <b>3.</b> En GitHub: <span style="color:var(--acc)">github.com/manugrraa/fantasy-studio</span> → Settings → Secrets and variables → Actions → New repository secret. Crea <b>TELEGRAM_BOT_TOKEN</b> (el token) y <b>TELEGRAM_CHAT_ID</b> (el número).<br>
          Y listo: el resumen llega solo cada mañana. Sin los secrets, simplemente no se envía nada.
        </div>
      </details>
      <button class="btn-acc" style="width:100%" onclick="exportData()">Exportar mis datos</button>
      <button class="btn-ghost" style="width:100%;margin-top:9px" onclick="document.getElementById('importFile').click()">Importar datos</button>
      <button class="btn-ghost btn-danger" style="width:100%;margin-top:9px" onclick="wipeData()">Borrar todos mis datos</button>
    </div>`);
}
function exportData(){
  const payload = {
    app: "FantasyStudio", version: 1, exportedAt: new Date().toISOString(),
    squad: state.squad, moves: state.moves, watch: state.watch,
    league: state.myLeague, workerUrl: state.workerUrl || undefined, // la sesión (tokens) nunca se exporta
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "FantasyStudio_datos_" + todayISO() + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("Datos exportados", "ok");
}
document.getElementById("importFile").addEventListener("change", async e => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== "FantasyStudio" || !data.squad || !data.moves) throw new Error("formato");
    if (!confirm("Esto sustituirá tu plantilla, movimientos y vigilados actuales por los del archivo. ¿Continuar?")) return;
    state.squad = Object.assign({"1":[], "2":[]}, data.squad);
    state.moves = Object.assign({"1":[], "2":[]}, data.moves);
    state.watch = Object.assign({"1":[], "2":[]}, data.watch || {});
    if (data.league) { state.myLeague = data.league; localStorage.setItem(LS.league, JSON.stringify(data.league)); }
    if (data.workerUrl && !state.workerUrl) { state.workerUrl = data.workerUrl; localStorage.setItem(LS.worker, data.workerUrl); }
    persist();
    closeModal();
    render();
    toast("Datos importados", "ok");
  } catch(err) {
    toast("Archivo no válido", "err");
  }
});
function wipeData(){
  if (!confirm("¿Borrar plantilla, movimientos y vigilados de LAS DOS ligas? Esta acción no se puede deshacer.")) return;
  if (!confirm("¿Seguro? Se borrará todo lo tuyo (los datos de jugadores no se tocan).")) return;
  state.squad = {"1":[], "2":[]};
  state.moves = {"1":[], "2":[]};
  state.watch = {"1":[], "2":[]};
  persist();
  closeModal();
  render();
  toast("Datos borrados");
}

/* =====================================================================
   ARRANQUE
   ===================================================================== */
for (const id of ["modeSwitch", "modeSwitchSide"]) {
  document.getElementById(id)?.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (b) setMode(b.dataset.m);
  });
}
document.getElementById("btnTheme").addEventListener("click", toggleTheme);
document.getElementById("btnThemeSide")?.addEventListener("click", toggleTheme);
document.getElementById("btnMenu").addEventListener("click", openMenu);
document.getElementById("btnMenuSide")?.addEventListener("click", openMenu);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

/* --- refresco automático: si data/ se ha republicado, recarga sin tocar nada --- */
let _lastMetaAt = null;
async function autoCheck(){
  if (!state.meta) return;
  try {
    const m = await fetchJSON("data/meta.json");
    if (_lastMetaAt === null) _lastMetaAt = state.meta.updatedAt;
    if (m.updatedAt !== _lastMetaAt) {
      _lastMetaAt = m.updatedAt;
      await loadAll();
      render();
      checkTargets();
      toast("Datos actualizados automáticamente", "ok");
    }
  } catch(e) { /* sin red: lo intentamos más tarde */ }
}

(function init(){
  const theme = localStorage.getItem(LS.theme);
  if (theme) document.documentElement.dataset.theme = theme;
  applyThemeBtn();
  applyMode();
  renderNav();
  loadAll().then(() => {
    render();
    checkTargets({ silent: true });
  }).catch(err => {
    document.getElementById("main").innerHTML =
      `<div class="empty-state"><div class="big">📡</div>No se pudieron cargar los datos.<br>
      <span style="font-size:12px">${esc(err.message)}</span><br><br>
      <button class="btn-acc" onclick="location.reload()">Reintentar</button></div>`;
  });
  // refresco del contador de jornada cada minuto
  setInterval(() => { if (state.view === "resumen" && state.meta) render(); }, 60000);
  // comprobación de datos nuevos (meta.json pesa ~400 bytes, es baratísimo):
  // cada 2 min con jornada en vivo, cada 5 min si no
  setInterval(() => {
    const live = state.meta?.comps?.[comp()]?.isLive;
    const mins = Math.floor(Date.now() / 60000);
    if (mins % (live ? 2 : 5) === 0) autoCheck();
  }, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) autoCheck(); });
  // Mi Liga: refresco periódico suave (loadLiga ya limita a 1 vez cada 2 min)
  setInterval(() => { if (state.view === "liga" && state.auth && !document.hidden) loadLiga(); }, 120000);
  // barra inferior: se oculta mientras el teclado está abierto para que no "flote"
  if (window.visualViewport) {
    let baseH = window.visualViewport.height;
    window.visualViewport.addEventListener("resize", () => {
      const h = window.visualViewport.height;
      if (h > baseH) baseH = h;
      document.body.classList.toggle("kb-open", h < baseH * 0.78);
    });
  }
  // service worker: notificaciones en Android + app instalable
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
})();
</script>
