/* detector de minutos: ¿está perdiendo la titularidad? (minutos por jornada
   del volcado diario de estadísticas) */
function minutesAlert(c, pid){
  const mins = state.stats[c]?.mins?.[String(pid)];
  if (!mins) return null;
  const lastW = state.meta?.comps?.[c]?.previousWeek ?? ((state.meta?.comps?.[c]?.weekNumber || 1) - 1);
  if (!lastW || lastW < 2) return null;
  const weeks = Object.keys(mins).map(Number);
  const playedBefore = weeks.filter(w => w < lastW).length;
  if (!playedBefore) return null; // nunca fue titular: no hay pérdida que detectar
  const mLast = mins[String(lastW)];
  const mPrev = mins[String(lastW - 1)];
  if (mLast == null) return { sev: 2, txt: `no jugó la J${lastW}` };
  if (mLast < 30 && (mPrev == null || mPrev < 45)) return { sev: 1, txt: `solo ${mLast}' en la J${lastW}` };
  return null;
}

/* probabilidad de titularidad: partidos con 60'+ entre las jornadas jugadas
   (minutos reales del volcado diario) */
function starterProb(c, pid){
  const mins = state.stats[c]?.mins?.[String(pid)];
  const lastW = state.meta?.comps?.[c]?.previousWeek ?? ((state.meta?.comps?.[c]?.weekNumber || 1) - 1);
  if (!lastW || lastW < 1) return null;
  if (!mins) return { prob: 0, starts: 0, weeks: lastW };
  let starts = 0;
  for (let w = 1; w <= lastW; w++) {
    if ((mins[String(w)] || 0) >= 60) starts++;
  }
  return { prob: starts / lastW, starts, weeks: lastW };
}
function starterBadge(c, pid){
  const s = starterProb(c, pid);
  if (!s || s.weeks < 1) return null;
  if (s.prob >= 0.75) return { txt: "titular fijo", cls: "green", pct: s };
  if (s.prob >= 0.4) return { txt: "rotación", cls: "orange", pct: s };
  return { txt: "suplente", cls: "red", pct: s };
}

/* radar de regresos: vuelven de lesión/sanción con el valor aún hundido */
function comebackRadar(c){
  const log = state.statusLog?.[c] || {};
  const today = +new Date().toLocaleDateString("sv-SE", { timeZone: "Europe/Madrid" }).replace(/-/g, "");
  const limit = intMinusDays(today, 8);
  const out = [];
  for (const p of state.players[c] || []) {
    if (p.playerStatus !== "ok") continue;
    const e = log[String(p.id)];
    if (!e || e.s !== "ok" || !e.prev || !["injured", "suspended", "doubtful"].includes(e.prev)) continue;
    if (e.d < limit) continue;
    const h = (state.history[c] || {})[String(p.id)] || [];
    if (h.length < 5) continue;
    const max30 = Math.max(...h.slice(-30).map(x => x[1]));
    const val = pVal(p);
    if (max30 && val <= max30 * 0.95) out.push({ p, disc: max30 - val, prev: e.prev });
  }
  return out.sort((a, b) => b.disc - a.disc).slice(0, 8);
}

/* --- consejos personalizados: MI plantilla, MI dinero y MIS objetivos --- */
function personalAdvice(c){
  const tips = [];
  const money = ligaMoney(state.liga.data[c]?.money);

  // sobre mi plantilla
  for (const e of state.squad[c]) {
    if (e.custom) continue;
    const p = state.byId[c].get(String(e.pid));
    if (!p) continue;
    const v = pVal(p), d = deltas(c, e.pid), s = streakOf(c, e.pid);
    const pl = v - (e.buyPrice || 0);
    const plPct = e.buyPrice ? pl / e.buyPrice * 100 : 0;
    if (p.playerStatus === "injured" || p.playerStatus === "suspended") {
      tips.push({ icon: "🚑", cls: "red", txt: `<b>${esc(p.nickname)}</b> está ${STATUS[p.playerStatus].label.toLowerCase()} y vale ${fmtM(v)} — si va para largo, véndelo antes de que baje más.`, pid: e.pid });
    } else if (s <= -3) {
      tips.push({ icon: "📉", cls: "red", txt: `<b>${esc(p.nickname)}</b> lleva ${Math.abs(s)} días seguidos cayendo (${fmtMSign(d.d7)} en 7d). Si no cuentas con él para puntos, es momento de soltarlo.`, pid: e.pid });
    } else if (plPct >= 30 && s <= 0) {
      tips.push({ icon: "💰", cls: "green", txt: `<b>${esc(p.nickname)}</b> te deja ${fmtMSign(pl)} (${plPct.toLocaleString("es-ES",{maximumFractionDigits:0})} %) y su subida se ha frenado: buen punto para hacer caja.`, pid: e.pid });
    } else if (s >= 4) {
      tips.push({ icon: "🔥", cls: "green", txt: `<b>${esc(p.nickname)}</b> lleva ${s} días subiendo sin parar (${fmtMSign(d.d7)} en 7d). Aguántalo, aún tiene cuerda.`, pid: e.pid });
    }
  }

  // objetivos a punto de caramelo
  for (const w of state.watch[c]) {
    if (!w.target) continue;
    const p = state.byId[c].get(String(w.pid));
    if (!p) continue;
    const v = pVal(p);
    const dist = w.dir === "above" ? (w.target - v) / w.target : (v - w.target) / w.target;
    if (dist > 0 && dist <= 0.04) {
      tips.push({ icon: "🎯", cls: "acc", txt: `<b>${esc(p.nickname)}</b> está a un ${(dist*100).toLocaleString("es-ES",{maximumFractionDigits:1})} % de tu objetivo de ${fmtM(w.target)} €. Atento.`, pid: w.pid });
    }
  }

  // qué me puedo permitir con mi dinero real
  if (money != null) {
    const afford = (state.players[c] || [])
      .filter(p => p.playerStatus === "ok" && !squadEntry(p.id) && pVal(p) <= money && (p.points || 0) >= 10)
      .sort((a, b) => ppm(b) - ppm(a))[0];
    if (afford) {
      tips.push({ icon: "🛒", cls: "acc", txt: `Con tus <b>${fmtM(money)} €</b> te llega para <b>${esc(afford.nickname)}</b> (${fmtM(pVal(afford))}, ${ppm(afford).toLocaleString("es-ES",{maximumFractionDigits:1})} pts por millón — de lo más rentable a tu alcance).`, pid: afford.id });
    }
  }
  return tips;
}

function viewConsejos(){
  const c = comp();
  const players = state.players[c] || [];
  const pool = players.filter(p => p.playerStatus !== "out_of_league");
  const values = pool.map(pVal).filter(v => v > 0).sort((a,b)=>a-b);
  const medianVal = values.length ? values[Math.floor(values.length/2)] : 0;

  // --- detector de minutos (mi plantilla + vigilados) y radar de regresos ---
  const minutesIds = [...new Set([
    ...state.squad[c].filter(e => !e.custom).map(e => String(e.pid)),
    ...state.watch[c].map(w => String(w.pid)),
  ])];
  const minAlerts = minutesIds
    .map(pid => ({ p: state.byId[c].get(pid), a: minutesAlert(c, pid) }))
    .filter(x => x.p && x.a)
    .sort((x, y) => y.a.sev - x.a.sev);
  const minutesHtml = minAlerts.length ? `
    <div class="section-title">⏱ Pierden minutos (véndelos antes que el mercado se entere)</div>
    <div class="card">${minAlerts.map(x => playerRow(x.p, { reason: `<span style="color:var(--orange)">${x.a.txt}</span>` })).join("")}</div>` : "";

  const backs = comebackRadar(c);
  const ETIQ_PREV = { injured: "lesión", suspended: "sanción", doubtful: "duda" };
  const backsHtml = backs.length ? `
    <div class="section-title">🩹 Regresos con descuento (vuelven y su valor aún no)</div>
    <div class="card">${backs.map(x => playerRow(x.p, { reason: `<span class="up">−${fmtM(x.disc)} vs su pico</span> · vuelve de ${ETIQ_PREV[x.prev] || x.prev}` })).join("")}</div>` : "";

  // --- personalizados: mi plantilla, mi dinero, mis objetivos ---
  const personal = personalAdvice(c);
  const personalHtml = personal.length ? `
    <div class="section-title">⭐ Para ti hoy</div>
    ${personal.map(t => `<div class="card clickable" style="padding:12px 14px;margin-bottom:8px;display:flex;gap:11px;align-items:flex-start" onclick="openPlayer('${t.pid}')">
      <div style="font-size:19px">${t.icon}</div>
      <div style="font-size:12.5px;line-height:1.55;color:var(--text-2)">${t.txt}</div>
    </div>`).join("")}` :
    `<div class="section-title">⭐ Para ti hoy</div>
     <div class="card" style="padding:13px 15px;margin-bottom:8px;font-size:12.5px;color:var(--text-3)">
       Sin avisos sobre tu plantilla hoy. ${state.squad[c].length ? "Todo estable." : "Añade jugadores en Mi Plantilla (o conéctate en Mi Liga) para recibir consejos personalizados."}
     </div>`;

  // --- para fichar: momentum de mercado ---
  const buys = pool
    .filter(p => p.playerStatus === "ok" && !squadEntry(p.id))
    .map(p => {
      const s = streakOf(c, p.id), pc = d7pct(c, p.id);
      return { p, s, pc, score: pc*2 + s*1.5 + form3(p) };
    })
    .filter(x => x.s >= 2 && x.pc >= 1.5)
    .sort((a,b) => b.score - a.score)
    .slice(0, 8);

  // --- chollos: rendimiento por precio ---
  const cheap = pool
    .filter(p => p.playerStatus === "ok" && pVal(p) > 0 && pVal(p) <= medianVal * 1.4 && (p.points||0) >= 8)
    .map(p => ({ p, v: ppm(p) }))
    .sort((a,b) => b.v - a.v)
    .slice(0, 8);

  // --- en racha deportiva ---
  const hot = pool
    .filter(p => p.playerStatus === "ok" && (p.weekPoints||[]).length >= 2)
    .map(p => ({ p, f: form3(p) }))
    .filter(x => x.f >= 5)
    .sort((a,b) => b.f - a.f)
    .slice(0, 8);

  // --- mi plantilla: avisos de venta / vigilancia ---
  const sellAlerts = state.squad[c]
    .filter(e => !e.custom)
    .map(e => {
      const p = state.byId[c].get(String(e.pid));
      if (!p) return null;
      const s = streakOf(c, p.id), pc = d7pct(c, p.id);
      const issues = [];
      const stt = STATUS[p.playerStatus];
      if (p.playerStatus !== "ok" && stt) issues.push(`<span style="color:${stt.color}">${stt.label}</span>`);
      if (s <= -2) issues.push(`<span class="down">${Math.abs(s)} días bajando</span>`);
      if (pc <= -3) issues.push(`<span class="down">${pc.toLocaleString("es-ES",{maximumFractionDigits:1})} % en 7d</span>`);
      if ((p.weekPoints||[]).length >= 3 && form3(p) < (p.averagePoints||0) - 2) issues.push(`forma floja`);
      return issues.length ? { p, reason: issues.join(" · ") } : null;
    })
    .filter(Boolean);

  // --- caídas fuertes del mercado ---
  const drops = pool
    .map(p => ({ p, pc: d7pct(c, p.id) }))
    .filter(x => x.pc <= -4)
    .sort((a,b) => a.pc - b.pc)
    .slice(0, 8);

  const reasonBuy = x => `<span class="up">▲ ${x.s} días</span> · <span class="up">+${x.pc.toLocaleString("es-ES",{maximumFractionDigits:1})} % 7d</span>`;
  const reasonCheap = x => `<span class="up">${x.v.toLocaleString("es-ES",{maximumFractionDigits:1})} pts/M€</span> · ${fmtM(pVal(x.p))} €`;
  const reasonHot = x => `<span class="up">forma ${x.f.toLocaleString("es-ES",{maximumFractionDigits:1})}</span> · media ${(x.p.averagePoints||0).toLocaleString("es-ES",{maximumFractionDigits:1})}`;
  const reasonDrop = x => `<span class="down">${x.pc.toLocaleString("es-ES",{maximumFractionDigits:1})} % en 7d</span>`;

  const section = (title, rows, empty) =>
    `<div class="section-title">${title}</div><div class="card">${rows.length ? rows.join("") : `<div class="empty-state" style="padding:22px">${empty}</div>`}</div>`;

  return updatedLine() + `
  <div class="card" style="padding:12px 15px;margin-bottom:16px;font-size:12px;color:var(--text-2);line-height:1.5">
    ${IC.bulb.replace('class="ic"','class="ic" style="width:14px;height:14px;vertical-align:-2px;color:var(--acc)"')}
    Señales calculadas con los datos oficiales (precio, racha, forma, rival). Son pistas para que sepas
    sobre quién informarte, no verdades absolutas: la última palabra es tuya.
  </div>
  ${personalHtml}
  ${minutesHtml}
  ${backsHtml}
  ${sellAlerts.length ? section("⚠️ Mi plantilla: vigilar o vender", sellAlerts.map(x => playerRow(x.p, { reason: x.reason })), "") : ""}
  ${section("📈 Para fichar: en plena subida", buys.map(x => playerRow(x.p, { reason: reasonBuy(x) })), "Nadie con subida clara ahora mismo")}
  ${section("💎 Chollos: puntos por millón", cheap.map(x => playerRow(x.p, { reason: reasonCheap(x) })), "Sin chollos claros con estos datos")}
  ${section("🔥 En racha (últimas jornadas)", hot.map(x => playerRow(x.p, { reason: reasonHot(x) })), "Aún pocas jornadas para medir rachas")}
  ${section("📉 Caídas fuertes (7 días)", drops.map(x => playerRow(x.p, { reason: reasonDrop(x) })), "Sin caídas destacadas")}`;
}

function statGet(c, pid, key){
  const st = state.stats[c];
  if (!st || !st.players) return null;
  const row = st.players[String(pid)];
  if (!row) return null;
  const i = st.keys.indexOf(key);
  return i >= 0 ? (row[i] || 0) : null;
}

function computeStandings(c){
  const full = state.calFull[c];
  if (!full || !full.weeks) return null;
  const table = new Map();
  const row = id => {
    id = String(id);
    if (!table.has(id)) table.set(id, { id, pj:0, g:0, e:0, p:0, gf:0, gc:0, pts:0 });
    return table.get(id);
  };
  for (const ms of Object.values(full.weeks)) {
    for (const m of ms) {
      if (m.localScore == null || m.visitorScore == null) continue;
      const L = row(m.localId), V = row(m.visitorId);
      L.pj++; V.pj++;
      L.gf += m.localScore; L.gc += m.visitorScore;
      V.gf += m.visitorScore; V.gc += m.localScore;
      if (m.localScore > m.visitorScore) { L.g++; V.p++; L.pts += 3; }
      else if (m.localScore < m.visitorScore) { V.g++; L.p++; V.pts += 3; }
      else { L.e++; V.e++; L.pts++; V.pts++; }
    }
  }
  // asegura que salgan todos los equipos de la liga aunque no hayan jugado
  for (const ms of Object.values(full.weeks)) { for (const m of ms) { row(m.localId); row(m.visitorId); } }
  return [...table.values()].sort((a,b) => b.pts - a.pts || (b.gf-b.gc) - (a.gf-a.gc) || b.gf - a.gf);
}

function zoneFor(c, pos, total){
  if (c === "2") {
    if (pos <= 2) return "zone-up";
    if (pos <= 6) return "zone-po";
    if (pos > total - 4) return "zone-down";
  } else {
    if (pos <= 4) return "zone-up";
    if (pos <= 6) return "zone-po";
    if (pos > total - 3) return "zone-down";
  }
  return "";
}

const RANKS = [
  { id:"points", label:"Puntos" },
  { id:"avg",    label:"Media" },
  { id:"form",   label:"Forma" },
  { id:"ppm",    label:"Pts/M€" },
  { id:"rise",   label:"Revalorización €" },
  { id:"risepct",label:"Revalorización %" },
  { id:"value",  label:"Más caros" },
  { id:"goals",  label:"Goles", needsStats:true },
  { id:"assists",label:"Asistencias", needsStats:true },
];

/* Mapa valor-vs-puntos: cada punto es un jugador; arriba-izquierda = chollo
   (muchos puntos, poco precio). Tocar un punto abre su ficha. */
function scatterHtml(c){
  const pool = (state.players[c] || []).filter(p => (p.points || 0) > 0 && pVal(p) > 0 && p.playerStatus !== "out_of_league");
  if (!pool.length) return `<div class="card"><div class="empty-state">Sin datos</div></div>`;
  const W = 460, H = 320, PL = 40, PB = 28, PT = 12, PR = 12;
  const maxV = Math.max(...pool.map(pVal)), maxP = Math.max(...pool.map(p => p.points));
  const x = v => PL + Math.sqrt(v / maxV) * (W - PL - PR); // raíz: despliega la zona barata
  const y = pts => H - PB - (pts / maxP) * (H - PB - PT);
  const dots = pool.map(p => {
    const pos = POS[String(p.positionId)] || POS["3"];
    const mine = !!squadEntry(p.id);
    return `<circle cx="${x(pVal(p)).toFixed(1)}" cy="${y(p.points).toFixed(1)}" r="${mine ? 6 : 3.6}"
      fill="${pos.color}" opacity="${mine ? 1 : 0.62}" ${mine ? 'stroke="var(--text)" stroke-width="1.6"' : ""}
      style="cursor:pointer" onclick="openPlayer('${p.id}')"><title>${esc(p.nickname)} · ${fmtM(pVal(p))} € · ${p.points} pts</title></circle>`;
  }).join("");
  const gridY = [0.25, 0.5, 0.75, 1].map(f => { const yy = y(maxP * f); return `<line x1="${PL}" y1="${yy}" x2="${W-PR}" y2="${yy}" stroke="var(--border)" stroke-width="0.6"/><text x="${PL-5}" y="${yy+3}" text-anchor="end" font-size="8.5" fill="var(--text-3)">${Math.round(maxP*f)}</text>`; }).join("");
  const gridX = [0.1, 0.35, 1].map(f => { const xx = x(maxV * f); return `<text x="${xx}" y="${H-10}" text-anchor="middle" font-size="8.5" fill="var(--text-3)">${fmtM(maxV*f)}</text>`; }).join("");
  return `
  <div class="card" style="padding:12px">
    <div style="font-size:11px;color:var(--text-3);margin-bottom:8px;line-height:1.5">
      ⬆️⬅️ <b>Arriba a la izquierda = chollos</b> (muchos puntos, poco precio). Tus jugadores llevan borde. Toca un punto para abrir la ficha.
    </div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
      ${gridY}${gridX}
      <text x="${PL-28}" y="${(H-PB+PT)/2}" font-size="9" fill="var(--text-3)" transform="rotate(-90 ${PL-28} ${(H-PB+PT)/2})">puntos</text>
      <text x="${(W+PL)/2}" y="${H-1}" text-anchor="middle" font-size="9" fill="var(--text-3)">valor de mercado</text>
      ${dots}
    </svg>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;font-size:10.5px;color:var(--text-3)">
      ${POS_ORDER.slice(0,4).map(k => `<span><span class="zone-dot" style="background:${POS[k].color}"></span>${POS[k].tag}</span>`).join("")}
    </div>
  </div>`;
}

/* Calendario fácil: qué equipos tienen las próximas jornadas más asequibles.
   Ficha jugadores de los de arriba ANTES de que su valor suba. */
function fixtureHtml(c){
  const full = state.calFull[c];
  const cur = state.meta?.comps?.[c]?.weekNumber || 1;
  if (!full?.weeks) return `<div class="card"><div class="empty-state">Sin calendario todavía</div></div>`;
  const N = 4;
  const strengths = {};
  const teamIds = [...new Set((state.players[c] || []).map(p => String(p.teamId)))];
  for (const t of teamIds) strengths[t] = teamStrength(c, t);
  const avg = teamIds.reduce((a, t) => a + strengths[t], 0) / (teamIds.length || 1);

  const rows = teamIds.map(tid => {
    const team = state.teams.get(tid);
    const next = [];
    for (let w = cur; w < cur + N + 2 && next.length < N; w++) {
      for (const m of full.weeks[String(w)] || []) {
        if (String(m.localId) === tid || String(m.visitorId) === tid) {
          const home = String(m.localId) === tid;
          const rivId = String(home ? m.visitorId : m.localId);
          const s = (strengths[rivId] ?? avg) + (home ? -0.5 : 0.5); // fuera pesa más
          next.push({ riv: state.teams.get(rivId), home, s, w });
          break;
        }
      }
    }
    if (!next.length) return null;
    const score = next.reduce((a, x) => a + x.s, 0) / next.length;
    return { tid, team, next, score };
  }).filter(Boolean).sort((a, b) => a.score - b.score);

  const dot = s => s < avg - 0.8 ? "🟢" : s > avg + 0.8 ? "🔴" : "🟡";
  return `
  <div class="card" style="padding:11px 14px;margin-bottom:10px;font-size:12px;color:var(--text-2);line-height:1.55">
    📅 Próximas ${N} jornadas ordenadas de <b>más fácil a más difícil</b>. Los jugadores de los equipos
    de arriba tienen papeletas de puntuar (y subir de valor): fíchalos <b>antes</b>.
  </div>
  <div class="card">${rows.map((r, i) => `
    <div class="p-row" style="cursor:default">
      <span class="rival-pos ${i < 3 ? "me" : ""}">${i + 1}</span>
      <img src="${esc(r.team?.badgeColor || "")}" alt="" style="width:26px;height:26px;object-fit:contain" loading="lazy" onerror="this.style.display='none'">
      <div class="p-main">
        <div class="p-name">${esc(r.team?.name || "?")}</div>
        <div class="p-meta" style="gap:8px">${r.next.map(x => `<span>${x.home ? "🏠" : "✈️"} ${esc(x.riv?.shortName || "?")} ${dot(x.s)}</span>`).join("")}</div>
      </div>
      <button class="btn-ghost" style="padding:6px 11px;font-size:11px" onclick="state.filters={q:'',pos:'',team:'${r.tid}',sort:'ppm',watchOnly:false,favOnly:false,limit:100};setView('mercado')">Ver jugadores</button>
    </div>`).join("")}</div>`;
}

function viewStats(){
  const c = comp();
  const tab = state.statsTab;
  const chips = `<div class="chips-row no-scrollbar">
    ${[["clasificacion","Clasificación"],["equipos","Equipos"],["rankings","Rankings"],["mapa","🗺 Mapa valor-puntos"],["fixture","📅 Calendario fácil"]].map(([id,l]) =>
      `<button class="chip ${tab===id?"active":""}" onclick="state.statsTab='${id}';render()">${l}</button>`).join("")}
  </div>`;

  let body = "";
  if (tab === "clasificacion") {
    const rows = computeStandings(c);
    if (!rows || !rows.length) body = `<div class="card"><div class="empty-state">Aún no hay resultados para calcular la clasificación</div></div>`;
    else {
      body = `<div class="card table-scroll"><table class="standings">
        <tr><th></th><th class="name-col">Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DG</th><th>Pts</th></tr>
        ${rows.map((r,i) => { const t = state.teams.get(r.id) || {}; const z = zoneFor(c, i+1, rows.length);
          return `<tr class="${z}"><td><span class="pos-n">${i+1}</span></td>
          <td class="name-col"><img src="${esc(t.badgeColor||"")}" alt="" loading="lazy" onerror="this.style.display='none'">${esc(t.name||"?")}</td>
          <td>${r.pj}</td><td>${r.g}</td><td>${r.e}</td><td>${r.p}</td><td>${r.gf}</td><td>${r.gc}</td>
          <td class="${cls(r.gf-r.gc)}">${r.gf-r.gc>0?"+":""}${r.gf-r.gc}</td><td class="pts">${r.pts}</td></tr>`; }).join("")}
      </table></div>
      <div class="zone-legend">
        ${c==="2" ? `<span><span class="zone-dot" style="background:var(--green)"></span>Ascenso directo</span>
        <span><span class="zone-dot" style="background:var(--acc)"></span>Playoff</span>
        <span><span class="zone-dot" style="background:var(--red)"></span>Descenso</span>`
        : `<span><span class="zone-dot" style="background:var(--green)"></span>Champions</span>
        <span><span class="zone-dot" style="background:var(--acc)"></span>Europa</span>
        <span><span class="zone-dot" style="background:var(--red)"></span>Descenso</span>`}
      </div>`;
    }
  } else if (tab === "mapa") {
    body = scatterHtml(c);
  } else if (tab === "fixture") {
    body = fixtureHtml(c);
  } else if (tab === "equipos") {
    const teamIds = [...new Set((state.players[c]||[]).map(p => String(p.teamId)))];
    const rows = teamIds.map(id => {
      const t = state.teams.get(id) || { name:"?" };
      const ps = (state.players[c]||[]).filter(p => String(p.teamId) === id);
      const value = ps.reduce((a,p)=>a+pVal(p),0);
      const pts = ps.reduce((a,p)=>a+(p.points||0),0);
      const top = [...ps].sort((a,b)=>(b.points||0)-(a.points||0))[0];
      return { t, id, strength: teamStrength(c, id), value, pts, top };
    }).sort((a,b) => b.strength - a.strength);
    body = `<div class="card table-scroll"><table class="standings">
      <tr><th></th><th class="name-col">Equipo</th><th>Fuerza</th><th>Pts fantasy</th><th>Valor plantilla</th><th class="name-col">Jugador top</th></tr>
      ${rows.map((r,i) => `<tr><td><span class="pos-n">${i+1}</span></td>
        <td class="name-col"><img src="${esc(r.t.badgeColor||"")}" alt="" loading="lazy" onerror="this.style.display='none'">${esc(r.t.name)}</td>
        <td class="pts">${r.strength.toLocaleString("es-ES",{maximumFractionDigits:1})}</td>
        <td>${nfES.format(r.pts)}</td>
        <td>${fmtM(r.value)} €</td>
        <td class="name-col" style="cursor:pointer" onclick="openPlayer('${r.top?.id}')">${esc(r.top?.nickname||"—")} (${r.top?.points||0})</td></tr>`).join("")}
    </table></div>
    <div class="zone-legend"><span>Fuerza = media de puntos fantasy de los 8 mejores del equipo</span></div>`;
  } else {
    const hasStats = !!state.stats[c];
    const ranks = RANKS.filter(r => !r.needsStats || hasStats);
    if (!ranks.some(r => r.id === state.rankTab)) state.rankTab = "points";
    const rt = state.rankTab;
    const pool = (state.players[c]||[]).filter(p => p.playerStatus !== "out_of_league");
    const val = {
      points: p => p.points||0, avg: p => p.averagePoints||0, form: p => form3(p), ppm: p => ppm(p),
      rise: p => deltas(c, p.id).d0, risepct: p => { const d = deltas(c,p.id).d0, v = pVal(p); return v-d>0 ? d/(v-d)*100 : 0; },
      value: p => pVal(p), goals: p => statGet(c, p.id, "goals")||0, assists: p => statGet(c, p.id, "goal_assist")||0,
    }[rt];
    const fmtV = {
      points: v => nfES.format(v) + " pts", avg: v => v.toLocaleString("es-ES",{maximumFractionDigits:1}), form: v => v.toLocaleString("es-ES",{maximumFractionDigits:1}),
      ppm: v => v.toLocaleString("es-ES",{maximumFractionDigits:1}) + " pts/M€", rise: v => fmtMSign(v), risepct: v => (v>0?"+":"") + v.toLocaleString("es-ES",{maximumFractionDigits:1}) + " %",
      value: v => fmtM(v) + " €", goals: v => v + (v===1?" gol":" goles"), assists: v => v + (v===1?" asistencia":" asistencias"),
    }[rt];
    const top = pool.map(p => ({ p, v: val(p) })).filter(x => x.v !== 0 || rt === "points")
      .sort((a,b) => b.v - a.v).slice(0, 15);
    body = `<div class="chips-row no-scrollbar">
      ${ranks.map(r => `<button class="chip ${rt===r.id?"active":""}" onclick="state.rankTab='${r.id}';render()">${r.label}</button>`).join("")}
    </div>
    <div class="card">${top.length ? top.map((x,i) =>
      `<div style="display:flex;align-items:center"><div style="width:34px;text-align:center;flex-shrink:0"><span class="pos-n">${i+1}</span></div><div style="flex:1;min-width:0">${playerRow(x.p, { reason: `<b style="color:var(--acc)">${fmtV(x.v)}</b>` })}</div></div>`).join("")
      : `<div class="empty-state">Sin datos para este ranking</div>`}</div>`;
  }
  return updatedLine() + chips + body;
}

/* =====================================================================
   VISTA: CALENDARIO
   ===================================================================== */
function viewCalendario(){
  const c = comp();
  const full = state.calFull[c];
  const curWeek = state.meta?.comps?.[c]?.weekNumber || 1;
  if (!full || !full.weeks || !Object.keys(full.weeks).length) {
    return updatedLine() + `<div class="card"><div class="empty-state"><div class="big">📅</div>El calendario completo aún no está descargado.<br>Aparecerá tras la próxima actualización de datos.</div></div>`;
  }
  const weekNums = Object.keys(full.weeks).map(Number).sort((a,b)=>a-b);
  if (!state.calWeek || !full.weeks[String(state.calWeek)]) state.calWeek = curWeek;
  const w = state.calWeek;
  const ms = [...(full.weeks[String(w)] || [])].sort((a,b) => new Date(a.matchDate) - new Date(b.matchDate));

  const groups = new Map();
  for (const m of ms) {
    const d = new Date(m.matchDate);
    const key = d.toLocaleDateString("es-ES", { weekday:"long", day:"numeric", month:"long" });
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(m);
  }
  const played = ms.filter(m => m.localScore != null).length;

  return updatedLine() + `
  <div class="week-chips no-scrollbar" id="weekChips">
    ${weekNums.map(n => `<button class="week-chip ${n===w?"sel":""} ${n===curWeek?"cur":""}" onclick="state.calWeek=${n};render()">J${n}</button>`).join("")}
  </div>
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
    <h3 style="font-size:16px;font-weight:800">Jornada ${w}</h3>
    ${w === curWeek ? `<span class="badge acc">actual</span>` : ""}
    <span style="font-size:11.5px;color:var(--text-3)">${played}/${ms.length} jugados</span>
  </div>
  ${[...groups.entries()].map(([day, list]) =>
    `<div class="day-lbl">${day}</div><div class="card">${list.map(m => matchRow(m, w)).join("")}</div>`).join("")}`;
}
function openPlayer(pid){
  const c = comp();
  const p = state.byId[c].get(String(pid));
  if (!p) return;
  const pos = POS[String(p.positionId)] || POS["3"];
  const t = teamOf(p);
  const d = deltas(c, pid);
  const stt = STATUS[p.playerStatus];
  const entry = squadEntry(pid);
  const val = pVal(p);
  const hist = (state.history[c] || {})[String(pid)] || [];

  const chips = `
    <span class="delta-chip ${cls(d.d1)}">${fmtMSign(d.d1)} hoy</span>
    <span class="delta-chip ${cls(d.d7)}">${fmtMSign(d.d7)} 7d</span>
    <span class="delta-chip ${cls(d.d0)}">${fmtMSign(d.d0)} temporada</span>`;

  const wp = (p.weekPoints || []);
  const maxAbs = Math.max(4, ...wp.map(w => Math.abs(w.points || 0)));
  const bars = wp.slice(-10).map(w => {
    const pts = w.points || 0;
    const h = Math.max(3, Math.abs(pts)/maxAbs*64);
    const color = pts < 0 ? "var(--red)" : pts >= 10 ? "var(--acc)" : pts >= 5 ? "var(--green)" : "var(--text-3)";
    return `<div class="bar-col"><div class="bar-val">${pts}</div><div class="bar" style="height:${h}px;background:${color}"></div><div class="bar-lbl">J${w.weekNumber}</div></div>`;
  }).join("");

  // señales
  const sk = streakOf(c, pid), pc = d7pct(c, pid);
  const riv = rivalDifficulty(c, p.teamId);
  const sig = [];
  if (sk >= 2) sig.push(`<span class="badge green">▲ ${sk} días subiendo</span>`);
  if (sk <= -2) sig.push(`<span class="badge red">▼ ${Math.abs(sk)} días bajando</span>`);
  if (Math.abs(pc) >= 3) sig.push(`<span class="badge ${pc>0?"green":"red"}">${(pc>0?"+":"") + pc.toLocaleString("es-ES",{maximumFractionDigits:1})} % en 7d</span>`);
  if ((p.weekPoints||[]).length >= 3) {
    const f = form3(p), avg = p.averagePoints || 0;

    sig.push(`<span class="badge ${lvl[0]}">${riv.home ? "vs" : "en casa de"} ${esc(riv.rival.shortName || riv.rival.name)} · ${lvl[1]}</span>`);
  }
  const sigHtml = sig.length ? `<div class="chart-card"><h4>Señales</h4><div style="display:flex;gap:6px;flex-wrap:wrap">${sig.join("")}</div></div>` : "";

  let ownHtml = "";
  if (entry) {
    const pl = val - (entry.buyPrice || 0);
    const v = sellVerdict(c, pid);
    ownHtml = `<div class="chart-card" style="border-color:var(--acc-border)">
      <h4>En mi plantilla</h4>

        <span>Comprado por <b>${fmt(entry.buyPrice||0)}</b>${entry.buyDate ? " · " + fmtDate(entry.buyDate) : ""}</span>
        <b class="${cls(pl)}">${fmtSign(pl)}</b>

  }

              <span class="pos-chip" style="color:${pos.color};background:${pos.bg}">${pos.tag}</span>
              ${t ? `<img src="${esc(t.badgeColor)}" alt=""> ${esc(t.name)}` : ""}
            </div>
            ${(() => {
              const chips2 = [];
              if (stt && p.playerStatus !== "ok") chips2.push(`<span class="badge" style="color:${stt.color};border-color:${stt.color}">${stt.label}</span>`);

              return chips2.length ? `<div style="margin-top:7px;display:flex;gap:5px;flex-wrap:wrap">${chips2.join("")}</div>` : "";

/* historial de copias diarias en la nube: restaurar a cualquier fecha */
async function openBackupHistory(){
  if (!state.workerUrl) { toast("Falta el servidor puente", "err"); return; }
  let days = [];
  try {
    const r = await fetch(state.workerUrl.replace(/\/+$/, "") + "/sync/" + syncKey() + "/versions", { signal: AbortSignal.timeout(10000) });
    days = (await r.json()).versions || [];
  } catch(e) { toast("No se pudo leer el historial", "err"); return; }
  if (!days.length) { toast("Aún no hay copias diarias (se crean solas al usar la app)"); return; }
  const lbl = d => `${d.slice(6,8)}/${d.slice(4,6)}/${d.slice(0,4)}`;
  openModal(`
    ${modalHead("🕐 Historial de copias")}
    <div class="modal-body">
      <div style="font-size:12px;color:var(--text-2);margin-bottom:12px;line-height:1.5">
        Una copia por día de tu plantilla, movimientos, vigilados y favoritos. Toca una fecha para restaurarla en este dispositivo.
      </div>
      <div class="card">${days.map(d => `
        <button class="p-row" style="width:100%;text-align:left" onclick="restoreBackup('${d}')">
          <div class="p-main"><div class="p-name">📦 ${lbl(d)}</div></div>
          <span style="color:var(--acc);font-size:12px;font-weight:700">Restaurar ›</span>
        </button>`).join("")}</div>
    </div>`);
}
async function restoreBackup(day){
  try {
    const r = await fetch(state.workerUrl.replace(/\/+$/, "") + "/sync/" + syncKey() + "/v/" + day, { signal: AbortSignal.timeout(10000) });
    if (!r.ok) throw new Error("no disponible");
    const data = await r.json();
    if (!data.squad) throw new Error("copia no válida");
    const lbl = `${day.slice(6,8)}/${day.slice(4,6)}`;
    if (!confirm(`¿Restaurar la copia del ${lbl}? Sustituirá plantilla, movimientos, vigilados y favoritos de ESTE dispositivo (y la copia actual de la nube en unos segundos).`)) return;
    state.squad = Object.assign({"1":[], "2":[]}, data.squad);
    state.moves = Object.assign({"1":[], "2":[]}, data.moves || {});
    state.watch = Object.assign({"1":[], "2":[]}, data.watch || {});
    state.favs = Object.assign({"1":[], "2":[]}, data.favs || {});
    if (data.wealth) try { localStorage.setItem("fs_wealth_hist", JSON.stringify(data.wealth)); } catch(e){}
    if (data.budgetHist) try { localStorage.setItem("fs_budget_hist", JSON.stringify(data.budgetHist)); } catch(e){}
    if (data.lineup) try { localStorage.setItem("fs_lineup_v1", JSON.stringify(data.lineup)); state.lineup = data.lineup; } catch(e){}
    persist();
    closeModal();
    render();
    toast("Restaurada la copia del " + lbl, "ok");
  } catch(e) { toast("No se pudo restaurar: " + e.message, "err"); }
}

    { label: "Prensa de la liga", icon: "📰", go: () => { state.ligaTab = "prensa"; setView("liga"); } },

  window._searchGo = [];
  openModal(`
    ${modalHead("🔍 Buscar")}
    <div class="modal-body">
      <div class="search-box">${IC.search}<input id="gSearch" placeholder="Jugador, mánager o apartado…" autocomplete="off"></div>
      <div id="gResults"></div>
    </div>`, ov => {
      const inp = ov.querySelector("#gSearch");

      const renderRes = () => {

        if (q) {

          const ps = (state.players[c] || []).filter(p => norm(p.nickname).includes(q)).sort((a, b) => pVal(b) - pVal(a)).slice(0, 8);
          if (ps.length) html += `<div class="section-title">Jugadores</div><div class="card">${ps.map(p => {
            const pid = String(p.id);
            return item("⚽", esc(p.nickname), `${(POS[String(p.positionId)] || {}).tag || ""} · ${fmtM(pVal(p))} € · ${p.points ?? 0} pts`, () => openPlayer(pid));
          }).join("")}</div>`;
          // mánagers de mi liga
          const standing = state.liga.data[c]?.standing || [];
          const ms = standing.filter(r => { const m = (r.team || r).manager || {}; return norm(m.managerName || (r.team || r).name || "").includes(q); }).slice(0, 4);

          }).join("")}</div>`;
        }
        out.innerHTML = html || `<div class="empty-state" style="padding:26px">Nada por aquí…</div>`;
      };
      inp.addEventListener("input", renderRes);
      renderRes();
      setTimeout(() => inp.focus(), 120);
    });

/* =====================================================================
   TARJETAS COMPARTIBLES COMO IMAGEN (canvas, sin librerías)
   ===================================================================== */
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#2EC8FF"; }

async function shareCanvas(canvas, filename){
  canvas.toBlob(async blob => {
    if (!blob) { toast("No se pudo generar la imagen", "err"); return; }
    const file = new File([blob], filename, { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; }
      catch(e) { if (e.name === "AbortError") return; }
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast("Imagen descargada", "ok");
  }, "image/png");
}

function cardCanvasBase(title, subtitle){
  const W = 1080, H = 1350;
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const g = cv.getContext("2d");
  const acc = cssVar("--acc"), logo = cssVar("--logo") || acc;
  // fondo
  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#0A1826"); bg.addColorStop(0.25, "#05070D"); bg.addColorStop(1, "#04050A");
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  // cabecera
  g.fillStyle = logo;
  g.font = "italic 900 64px Sora, Arial, sans-serif";
  g.textAlign = "left";
  g.fillText("FS", 64, 110);
  g.fillStyle = "#F5F5F5";
  g.font = "800 46px Sora, Arial, sans-serif";
  g.fillText(title, 170, 96);
  g.fillStyle = "#8a95a3";
  g.font = "500 30px Inter, Arial, sans-serif";
  g.fillText(subtitle, 170, 140);
  g.strokeStyle = acc; g.lineWidth = 5;
  g.beginPath(); g.moveTo(64, 176); g.lineTo(W - 64, 176); g.stroke();
  // pie
  g.fillStyle = "#5a6472";
  g.font = "500 28px Inter, Arial, sans-serif";
  g.textAlign = "center";
  g.fillText("manugrraa.github.io/fantasy-studio · " + new Date().toLocaleDateString("es-ES"), W / 2, H - 48);
  g.textAlign = "left";
  return { cv, g, W, H, acc };
}

/* compartir como TEXTO (formato WhatsApp: *negritas* y emojis) */
async function shareText(text){
  if (navigator.share) {
    try { await navigator.share({ text }); return; }
    catch(e) { if (e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(text); toast("Texto copiado: pégalo en WhatsApp", "ok"); }
  catch(e) { prompt("Copia el texto:", text); }
}

function startCompare(pidA){
  window._cmpA = String(pidA);
  const c = comp();
  const a = state.byId[c].get(String(pidA));
  openModal(`
    ${modalHead("Comparar con " + esc(a?.nickname || "…"))}
    <div class="modal-body">
      <div class="search-box">${IC.search}<input id="cmpSearch" placeholder="Busca al segundo jugador…" autocomplete="off"></div>
      <div id="cmpList"></div>
    </div>`, ov => {
      const inp = ov.querySelector("#cmpSearch");
      const listEl = ov.querySelector("#cmpList");
      const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
      const renderList = () => {
        const q = norm(inp.value || "");
        let list = (state.players[c] || []).filter(p => String(p.id) !== window._cmpA && (!q || norm(p.nickname).includes(q)));
        // por defecto, sugiere jugadores de la misma posición y valor parecido
        if (!q && a) list = list.filter(p => p.positionId === a.positionId).sort((x,y) => Math.abs(pVal(x)-pVal(a)) - Math.abs(pVal(y)-pVal(a)));
        else list.sort((x,y) => pVal(y) - pVal(x));
        listEl.innerHTML = `<div class="card">` + list.slice(0, 25).map(p => {
          const pos = POS[String(p.positionId)] || POS["3"];

            <img class="p-photo sm" loading="lazy" src="${esc(p.image)}" alt="" onerror="this.style.visibility='hidden'">

            <div class="picker-add">⚖</div>
          </div>`;
        }).join("") + `</div>`;
      };
      inp.addEventListener("input", renderList);
      renderList();
      setTimeout(() => inp.focus(), 120);
    });
}

function openCompare(pidB){
  const c = comp();
  const A = state.byId[c].get(String(window._cmpA));
  const B = state.byId[c].get(String(pidB));
  if (!A || !B) return;
  const dA = deltas(c, A.id), dB = deltas(c, B.id);
  const rivA = rivalDifficulty(c, A.teamId), rivB = rivalDifficulty(c, B.teamId);
  const rivTxt = r => r && r.rival ? `${r.rival.shortName || r.rival.name} ${r.level === 1 ? "🟢" : r.level === 3 ? "🔴" : "🟡"}` : "—";
  const stat = (pid, k) => statGet(c, pid, k);
  const n1 = v => v == null ? "—" : (+v).toLocaleString("es-ES", { maximumFractionDigits: 1 });
  const isPor = String(A.positionId) === "1" || String(B.positionId) === "1";
  const rows = [
    ["Valor", fmtM(pVal(A)) + " €", fmtM(pVal(B)) + " €", pVal(A) - pVal(B)],
    ["Hoy", fmtMSign(dA.d1), fmtMSign(dB.d1), dA.d1 - dB.d1],
    ["7 días", fmtMSign(dA.d7), fmtMSign(dB.d7), dA.d7 - dB.d7],
    ["Puntos", A.points ?? 0, B.points ?? 0, (A.points||0) - (B.points||0)],
    ["Media", n1(A.averagePoints), n1(B.averagePoints), (A.averagePoints||0) - (B.averagePoints||0)],
    ["Forma 3j", n1(form3(A)), n1(form3(B)), form3(A) - form3(B)],
    ["Pts/M€", n1(ppm(A)), n1(ppm(B)), ppm(A) - ppm(B)],
    ["Próx. rival", rivTxt(rivA), rivTxt(rivB), (rivB?.level ?? 2) - (rivA?.level ?? 2)],
    ["Minutos", n1(stat(A.id, "mins_played")), n1(stat(B.id, "mins_played")), (stat(A.id,"mins_played")||0) - (stat(B.id,"mins_played")||0)],
    isPor ? ["Paradas", n1(stat(A.id, "saves")), n1(stat(B.id, "saves")), (stat(A.id,"saves")||0) - (stat(B.id,"saves")||0)]
          : ["Goles", n1(stat(A.id, "goals")), n1(stat(B.id, "goals")), (stat(A.id,"goals")||0) - (stat(B.id,"goals")||0)],
    isPor ? ["Encajados", n1(stat(A.id, "goals_conceded")), n1(stat(B.id, "goals_conceded")), (stat(B.id,"goals_conceded")||0) - (stat(A.id,"goals_conceded")||0)]
          : ["Asistencias", n1(stat(A.id, "goal_assist")), n1(stat(B.id, "goal_assist")), (stat(A.id,"goal_assist")||0) - (stat(B.id,"goal_assist")||0)],
  ];
  const head = p => {
    const pos = POS[String(p.positionId)] || POS["3"];
    const t = teamOf(p);
    return `<div style="text-align:center;cursor:pointer" onclick="closeModal();openPlayer('${p.id}')">
      <img src="${esc(p.image)}" alt="" style="width:64px;height:64px;border-radius:14px;background:var(--card);border:1px solid var(--border);object-fit:cover;object-position:top" onerror="this.style.visibility='hidden'">
      <div style="font-size:13px;font-weight:800;margin-top:5px">${esc(p.nickname)}</div>
      <div style="font-size:10.5px;color:var(--text-3)"><span class="pos-chip" style="color:${pos.color};background:${pos.bg}">${pos.tag}</span> ${t ? esc(t.shortName || t.name) : ""}</div>
    </div>`;
  };
  openModal(`

/* proyección de valor a 7 días con la pendiente reciente (misma matemática
   que el objetivo inteligente) */
function projectValue(c, pid){
  const h = (state.history[c] || {})[String(pid)];
  if (!h || h.length < 4) return null;
  const seg = h.slice(-6);
  const slope = (seg[seg.length - 1][1] - seg[0][1]) / (seg.length - 1);
  const val = h[h.length - 1][1];
  return Math.round(Math.max(val * 0.75, Math.min(val * 1.25, val + slope * 7)));
}

function sparkline(hist, rangeDays, projTo){
  if (!hist || hist.length < 2) return `<div style="font-size:12px;color:var(--text-3);padding:12px 0">Aún no hay histórico suficiente. Se irá acumulando cada día.</div>`;
  const pts = rangeDays ? hist.slice(-rangeDays) : hist.slice(-120);
  if (pts.length < 2) return `<div style="font-size:12px;color:var(--text-3);padding:12px 0">Sin datos suficientes en este rango.</div>`;
  const vals = pts.map(e => e[1]);
  const min = Math.min(...vals, projTo ?? Infinity), max = Math.max(...vals, projTo ?? -Infinity);
  const range = (max - min) || 1;
  const W = 460, H = 110, PAD = 6;
  const step = (W - PAD*2) / (pts.length - 1);
  const y = v => H - PAD - ((v - min) / range) * (H - PAD*2);
  const coords = pts.map((e,i) => `${(PAD + i*step).toFixed(1)},${y(e[1]).toFixed(1)}`);
  const rising = vals[vals.length-1] >= vals[0];
  const col = rising ? "var(--green)" : "var(--red)";
  const dLast = String(pts[pts.length-1][0]);
  const dFirst = String(pts[0][0]);
  const lbl = s => s.slice(6,8) + "/" + s.slice(4,6);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${col}" stop-opacity="0.25"/><stop offset="100%" stop-color="${col}" stop-opacity="0"/>
    </linearGradient></defs>
    <polygon points="${PAD},${H-PAD} ${coords.join(" ")} ${W-PAD},${H-PAD}" fill="url(#sg)"/>
    <polyline points="${coords.join(" ")}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${coords[coords.length-1].split(",")[0]}" cy="${coords[coords.length-1].split(",")[1]}" r="3" fill="${col}"/>
    ${projTo != null ? (() => {
      const x0 = +coords[coords.length-1].split(",")[0], y0 = +coords[coords.length-1].split(",")[1];
      const x1 = W - PAD, y1 = y(projTo);
      const pcol = projTo >= vals[vals.length-1] ? "var(--green)" : "var(--red)";
      return `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1.toFixed(1)}" stroke="${pcol}" stroke-width="2" stroke-dasharray="4 5" opacity=".8"/>
        <circle cx="${x1}" cy="${y1.toFixed(1)}" r="3" fill="none" stroke="${pcol}" stroke-width="1.6"/>`;
    })() : ""}
  </svg>
  <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-3);margin-top:4px">
    <span>${lbl(dFirst)}</span>
    <span>mín ${fmtM(min)} · máx ${fmtM(max)}</span>
    <span>${lbl(dLast)}</span>
  </div>`;
}

function checkTargets(opts){
  // comprueba objetivos de las dos ligas; avisa una sola vez por objetivo
  let hits = [];
  for (const c of ["1","2"]) {
    for (const w of state.watch[c]) {
      const p = (state.byId[c] || new Map()).get(String(w.pid));
      if (!p) continue;
      if (targetReached(w, pVal(p))) {
        if (!w.notifiedAt) {
          w.notifiedAt = new Date().toISOString();
          hits.push({ p, w, c });
        }
      } else if (w.notifiedAt) {
        w.notifiedAt = null; // se desanda: podrá avisar de nuevo
      }
    }
  }
  if (hits.length) {
    persist();
    for (const h of hits) {
      const msg = h.p.nickname + " ha llegado a tu objetivo: " + fmt(pVal(h.p));
      toast("🎯 " + msg, "ok");
      sysNotify("🎯 Objetivo de mercado", msg);
    }
    if (!opts || !opts.silent) vibrate(30);
  }
  return hits.length;
}

function sysNotify(title, body){
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  const opts = { body, icon: "icon-192.png", badge: "icon-192.png" };
  navigator.serviceWorker?.getRegistration().then(reg => {
    if (reg && reg.showNotification) reg.showNotification(title, opts);
    else { try { new Notification(title, opts); } catch(e){} }
  }).catch(() => { try { new Notification(title, opts); } catch(e){} });
}
function maybeAskNotifPermission(){
  if (!("Notification" in window) || Notification.permission !== "default") return;
  setTimeout(() => {
    if (confirm("¿Quieres que el navegador te avise cuando un jugador llegue a tu precio objetivo? (funciona con la app abierta)")) {
      Notification.requestPermission();
    }
  }, 400);
}

const FORMATIONS = ["3-4-3", "3-5-2", "4-3-3", "4-4-2", "4-5-1", "5-3-2", "5-4-1"];

function saveLineup(){
  localStorage.setItem("fs_lineup_v1", JSON.stringify(state.lineup));

/* puntuación de un jugador: forma + media + dificultad del próximo rival */
function scoreLocal(c, p){
  if (!p) return { score: 0, why: "sin datos" };
  if (p.playerStatus !== "ok" && p.playerStatus !== "doubtful") {
    return { score: -100, why: (STATUS[p.playerStatus] || {}).label || "baja" };
  }
  const riv = rivalDifficulty(c, p.teamId);
  let score = form3(p) * 2 + (p.averagePoints || 0);
  let why = `forma ${form3(p).toLocaleString("es-ES",{maximumFractionDigits:1})}`;
  if (riv && riv.rival) {
    score += riv.level === 1 ? 1.5 : riv.level === 3 ? -1.5 : 0;
    why += ` · ${riv.home ? "vs" : "en"} ${riv.rival.shortName || riv.rival.name} ${riv.level === 1 ? "🟢" : riv.level === 3 ? "🔴" : "🟡"}`;
  }
  // la titularidad manda: un suplente no puntúa por bueno que sea
  const sp = starterProb(c, p.id);
  if (sp && sp.weeks >= 1) {
    score += (sp.prob - 0.5) * 5;
    if (sp.prob < 0.4) why += " · ⚠ suplente habitual";
  }
  if (p.playerStatus === "doubtful") { score -= 3; why += " · duda"; }
  return { score, why };
}

/* mejor once posible con MI plantilla (para autocompletar y para la nota) */
function bestFromSquad(c){
  const pool = state.squad[c]
    .filter(e => !e.custom && e.pos !== "5")
    .map(e => ({ e, p: state.byId[c].get(String(e.pid)) }))
    .filter(x => x.p)
    .map(x => ({ ...x, s: scoreLocal(c, x.p).score }));
  const by = k => pool.filter(x => String(x.p.positionId) === k).sort((a, b) => b.s - a.s);
  const G = by("1"), D = by("2"), M = by("3"), F = by("4");
  let best = null;
  for (const f of FORMATIONS) {
    const [nd, nm, nf] = f.split("-").map(Number);
    if (G.length < 1 || D.length < nd || M.length < nm || F.length < nf) continue;
    const xi = [G[0], ...D.slice(0, nd), ...M.slice(0, nm), ...F.slice(0, nf)];
    const total = xi.reduce((a, x) => a + Math.max(x.s, 0), 0);
    if (!best || total > best.total) best = { formation: f, ids: xi.map(x => String(x.p.id)), total };
  }
  return best;
}

function lineupTotal(c, ids){
  return (ids || []).reduce((a, pid) => a + Math.max(scoreLocal(c, state.byId[c].get(String(pid))).score, 0), 0);
}

function lineupSection(c){
  const lu = state.lineup[c];
  const best = bestFromSquad(c);
  if (!lu || !lu.ids?.length) {
    if (!best) return ""; // sin jugadores suficientes: ni se ofrece

    <div class="card" style="padding:16px;margin-bottom:14px;text-align:center">

        <button class="btn-ghost" style="flex:1" onclick="openLineupEditor()">Montarlo a mano</button>
      </div>
    </div>`;
  }
  const [nd, nm, nf] = (lu.formation || "4-4-2").split("-").map(Number);
  const ids = lu.ids;
  const groups = [ids.slice(1 + nd + nm), ids.slice(1 + nd, 1 + nd + nm), ids.slice(1, 1 + nd), ids.slice(0, 1)]; // DEL, CEN, DEF, POR
  const week = state.meta?.comps?.[c]?.weekNumber;
  const chip = pid => {
    const p = state.byId[c].get(String(pid));
    if (!p) return `<div class="pitch-chip"><div class="ph">?</div><div class="nm">—</div></div>`;
    const wp = (p.weekPoints || []).find(w => w.weekNumber === week);
    const stt = STATUS[p.playerStatus];
    return `<div class="pitch-chip" onclick="openPlayer('${p.id}')">

        ${p.playerStatus !== "ok" ? `style="border-color:${stt?.color || "var(--red)"}"` : ""}>
      <div class="nm">${esc(p.nickname)}</div>
      <div class="pt">${wp ? wp.points + " pts" : (p.averagePoints || 0).toLocaleString("es-ES", { maximumFractionDigits: 1 }) + " med"}</div>
    </div>`;
  };
  const myTotal = lineupTotal(c, ids);

/* Modo entrenador: nota a tus decisiones de compra/venta usando el histórico */
function coachCard(c){
  const sells = state.moves[c].filter(m => m.type === "sell" && m.pid && m.price);
  if (sells.length < 2) return "";
  const n1 = v => (+v).toLocaleString("es-ES", { maximumFractionDigits: 1 });
  let withProfit = 0, timingSum = 0, timingN = 0, tableMoney = 0;
  let best = null, worst = null;
  for (const m of sells) {
    if (m.profit != null) {
      if (m.profit > 0) withProfit++;
      if (!best || m.profit > best.profit) best = m;
      if (!worst || m.profit < worst.profit) worst = m;
    }
    // timing: ¿vendiste cerca del pico que tocó entre la compra y la venta?
    const h = (state.history[c] || {})[String(m.pid)];
    const sellInt = m.date ? +m.date.replace(/-/g, "") : null;
    if (h && sellInt) {
      const upto = h.filter(e => e[0] <= sellInt);
      if (upto.length > 2) {
        const peak = Math.max(...upto.slice(-60).map(e => e[1]));
        if (peak > 0) { timingSum += m.price / peak; timingN++; tableMoney += Math.max(0, peak - m.price); }
      }
    }
  }
  const okPct = sells.filter(m => m.profit != null).length ? withProfit / sells.filter(m => m.profit != null).length : 0;
  const timing = timingN ? timingSum / timingN : null;
  const nota = Math.round(Math.min(10, Math.max(0, okPct * 6 + (timing || 0.7) * 4)) * 10) / 10;
  const lesson = timing == null ? "" : timing >= 0.93 ? "Vendes muy cerca del pico: ojo de mercado fino. 👌"
    : timing >= 0.8 ? `Sueles vender al ${Math.round(timing * 100)} % del pico: aguanta un pelín más las subidas.`
    : `Vendes pronto (al ${Math.round(timing * 100)} % del pico): te has dejado ~${fmtM(tableMoney)} en la mesa.`;
  return `<div class="section-title">🎓 Modo entrenador</div>
  <div class="card" style="padding:13px 15px;margin-bottom:14px;font-size:12.5px;line-height:1.6;color:var(--text-2)">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
      <span style="font-family:'Sora',sans-serif;font-size:26px;font-weight:800;color:var(--acc)">${n1(nota)}</span>
      <span style="font-size:11px;color:var(--text-3)">nota de tus ${sells.length} ventas<br>(beneficio + puntería con el pico)</span>
    </div>
    ✅ ${Math.round(okPct * 100)} % de tus ventas con beneficio.
    ${lesson ? "<br>📐 " + lesson : ""}
    ${best && best.profit > 0 ? `<br>🏆 Mejor: <b>${esc(best.name)}</b> ${fmtMSign(best.profit)}.` : ""}
    ${worst && worst.profit < 0 ? ` 💀 Peor: <b>${esc(worst.name)}</b> ${fmtMSign(worst.profit)}.` : ""}
  </div>`;
}

/* =====================================================================
   CUENTA FANTASY: login oficial + servidor puente + MI LIGA
   El login va DIRECTO navegador -> login.laliga.es (servidor oficial B2C,
   admite CORS). La contraseña no pasa por ningún otro sitio y no se guarda.
   Las llamadas de datos con tu sesión van por TU Cloudflare Worker.
   ===================================================================== */
const AUTHCFG = {
  tokenBase: "https://login.laliga.es/laligadspprob2c.onmicrosoft.com/oauth2/v2.0/token",
  authorizeBase: "https://login.laliga.es/laligadspprob2c.onmicrosoft.com/oauth2/v2.0/authorize",
  loginPolicy: "B2C_1A_ResourceOwnerv2",
  altPolicy: "B2C_1A_5ULAIP_PARAMETRIZED_SIGNIN",
  clientId: "af88bcff-1157-40a0-b579-030728aacf0b",
  redirect: "authredirect://com.lfp.laligafantasy",
  socialRedirect: "https://jwt.ms", // única URL https registrada; jwt.ms solo muestra el code, no lo usa
};

/* --- Login social (Google / Apple / Facebook): flujo Authorization Code + PKCE.
   El usuario inicia sesión en la página OFICIAL de LaLiga y copia el enlace de
   vuelta (que lleva el ?code=). El intercambio code->token va directo del
   navegador al servidor de LaLiga (tiene CORS). No pasa por ningún tercero. --- */
function b64url(bytes){
  return btoa(String.fromCharCode(...bytes)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
async function pkcePair(){
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier));
  return { verifier, challenge: b64url(new Uint8Array(digest)) };
}
async function buildSocialUrl(){
  const { verifier, challenge } = await pkcePair();
  const stt = b64url(crypto.getRandomValues(new Uint8Array(12)));
  // localStorage y no sessionStorage: en iOS, al saltar a Safari para el login,
  // el sistema puede congelar la app instalada y perder la sesión temporal
  localStorage.setItem("fs_pkce", JSON.stringify({ verifier, state: stt, at: Date.now() }));
  const params = new URLSearchParams({
    p: AUTHCFG.altPolicy, client_id: AUTHCFG.clientId, response_type: "code",
    redirect_uri: AUTHCFG.socialRedirect, scope: "openid offline_access",
    code_challenge: challenge, code_challenge_method: "S256", state: stt, nonce: stt,
    response_mode: "query",
  });
  return `${AUTHCFG.authorizeBase}?${params.toString()}`;
}
async function socialExchange(pastedUrl){
  const raw = String(pastedUrl).trim();
  const errM = raw.match(/[?&#]error_description=([^&\s]+)/);
  if (errM) {
    const msg = decodeURIComponent(errM[1].replace(/\+/g, " ")).split("Correlation")[0];
    throw new Error("LaLiga devolvió un error: " + msg);
  }
  // acepta la URL completa de jwt.ms o el código suelto pegado a mano
  const m = raw.match(/[?&#]code=([^&\s]+)/) || (/^[A-Za-z0-9._~-]{20,}$/.test(raw) ? [null, raw] : null);
  if (!m) throw new Error("Ahí no viene el código. En la pestaña de jwt.ms, TOCA la barra de direcciones (se desplegará la dirección completa), cópiala entera y pégala aquí.");
  const code = decodeURIComponent(m[1]);
  const saved = JSON.parse(localStorage.getItem("fs_pkce") || "{}");
  if (!saved.verifier || (saved.at && Date.now() - saved.at > 30 * 60000)) {
    throw new Error("Sesión de login caducada. Pulsa de nuevo «Entrar con Google» y repite.");
  }
  const body = new URLSearchParams({
    grant_type: "authorization_code", client_id: AUTHCFG.clientId, code,
    redirect_uri: AUTHCFG.socialRedirect, code_verifier: saved.verifier, scope: "openid offline_access",
  });
  const r = await fetch(`${AUTHCFG.tokenBase}?p=${AUTHCFG.altPolicy}`, {
    method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body,
  });
  const d = await r.json().catch(() => ({}));
  // con login social B2C emite la sesión como id_token (sin access_token); vale igual como Bearer
  if (d.id_token && !d.access_token) d.access_token = d.id_token;
  if (!r.ok || !d.access_token) {
    const msg = (d.error_description || d.error || `El servidor respondió ${r.status} sin token (campos: ${Object.keys(d).join(",") || "ninguno"})`).split("\r")[0];
    throw new Error(msg);
  }
  d.expAt = Date.now() + ((+d.expires_in || +d.id_token_expires_in || 3000) * 1000);
  d.policy = AUTHCFG.altPolicy;
  localStorage.removeItem("fs_pkce");
  saveAuth(d);
  return d;
}
function saveAuth(a){
  state.auth = a;
  if (a) localStorage.setItem(LS.auth, JSON.stringify(a));
  else localStorage.removeItem(LS.auth);
}
function authValid(){ return !!(state.auth?.access_token && (state.auth.expAt || 0) > Date.now() + 60000); }

async function fantasyLogin(email, pass){
  const body = new URLSearchParams({
    grant_type: "password", client_id: AUTHCFG.clientId,
    scope: `openid ${AUTHCFG.clientId} offline_access`,
    redirect_uri: AUTHCFG.redirect, username: email, password: pass, response_type: "id_token",
  });
  const r = await fetch(`${AUTHCFG.tokenBase}?p=${AUTHCFG.loginPolicy}`, {
    method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body,
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok || !d.access_token) {
    const raw = (d.error_description || d.error || "Error de conexión con LaLiga").split("\r")[0];
    throw new Error(raw.includes("AADB2C90225") ? "Email o contraseña incorrectos" : raw);
  }
  d.expAt = Date.now() + ((+d.expires_in || 3000) * 1000);
  d.policy = AUTHCFG.loginPolicy;
  saveAuth(d);
  return d;
}

async function fantasyRefresh(){
  const rt = state.auth?.refresh_token;
  if (!rt) { saveAuth(null); throw new Error("Sesión caducada, vuelve a iniciar sesión"); }
  for (const pol of [state.auth.policy || AUTHCFG.loginPolicy, AUTHCFG.altPolicy]) {
    try {
      const body = new URLSearchParams({
        grant_type: "refresh_token", refresh_token: rt,
        client_id: AUTHCFG.clientId, scope: `openid ${AUTHCFG.clientId} offline_access`,
      });
      const r = await fetch(`${AUTHCFG.tokenBase}?p=${pol}`, {
        method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body,
      });
      const d = await r.json().catch(() => ({}));
      if (d.id_token && !d.access_token) d.access_token = d.id_token;
      if (r.ok && d.access_token) {
        d.expAt = Date.now() + ((+d.expires_in || +d.id_token_expires_in || 3000) * 1000);
        d.policy = pol;
        if (!d.refresh_token) d.refresh_token = rt;
        saveAuth(d);
        return d;
      }
    } catch(e) { /* probamos la otra política */ }
  }
  saveAuth(null);
  throw new Error("No se pudo renovar la sesión, vuelve a iniciar sesión");
}

function fantasyLogout(){
  saveAuth(null);
  state.liga = { loading:false, data:{}, errors:[] };
  render();
  toast("Sesión cerrada");
}

async function authFetch(path, opts){
  if (!state.workerUrl) throw new Error("Falta configurar el servidor puente");
  if (!state.auth) throw new Error("Inicia sesión primero");
  if (!authValid()) await fantasyRefresh();
  const doFetch = () => fetch(state.workerUrl.replace(/\/+$/, "") + path, {
    method: (opts && opts.method) || "GET",
    headers: {
      "Authorization": "Bearer " + state.auth.access_token, "x-lang": "es",
      ...(opts && opts.body ? { "Content-Type": "application/json" } : {}),
    },
    body: opts && opts.body ? JSON.stringify(opts.body) : undefined,
    signal: AbortSignal.timeout(15000),
  });
  let r = await doFetch();
  if (r.status === 401) { await fantasyRefresh(); r = await doFetch(); }
  const text = await r.text();
  let data = null;
  try { data = text.trim() ? JSON.parse(text) : null; } catch(e) { data = text; }
  if (!r.ok) {
    const err = new Error(`HTTP ${r.status} en ${path.split("?")[0]}`);
    err.status = r.status; err.data = data;
    throw err;
  }
  return data;
}

const unwrapList = d => Array.isArray(d) ? d : (Array.isArray(d?.elements) ? d.elements : (Array.isArray(d?.leagues) ? d.leagues : []));

async function loadLiga(force){
  const c = comp();
  const st = state.liga;
  if (st.loading) return;
  if (!force && st.data[c] && Date.now() - (st.data[c].at || 0) < 120000) return;
  if (!state.workerUrl || !state.auth) return;
  st.loading = true; st.errors = [];
  if (state.view === "liga") render();
  const out = { at: Date.now() };
  const errs = [];
  const step = async (key, fn) => {
    try { out[key] = await fn(); }
    catch(e) {
      errs.push({ key, msg: e.message, extra: (typeof e.data === "object" && e.data) ? JSON.stringify(e.data).slice(0, 200) : String(e.data || "").slice(0, 200) });
    }
  };

  await step("me", () => authFetch("/api/v4/user/me?x-lang=es"));
  await step("leagues", async () => unwrapList(await authFetch(`/api/v1/competition/${c}/leagues?x-lang=es`)));
  const leagues = out.leagues || [];
  let sel = state.myLeague[c];
  if (!sel || !leagues.some(l => String(l.id) === String(sel.leagueId))) {
    const l0 = leagues[0];
    sel = l0 ? { leagueId: String(l0.id), name: l0.name || "Mi liga", teamId: null } : null;
  }
  if (sel) {
    const lg = leagues.find(l => String(l.id) === String(sel.leagueId));
    const tid = lg?.team?.id ?? lg?.teamId ?? null;
    if (tid) sel.teamId = String(tid);
    sel.name = lg?.name || sel.name;
    state.myLeague[c] = sel;
    localStorage.setItem(LS.league, JSON.stringify(state.myLeague));

    await step("standing", async () => unwrapList(await authFetch(`/api/v1/competition/${c}/leagues/${sel.leagueId}/standing?x-lang=es`)));

    // si la liga no traía mi teamId, lo buscamos en la clasificación por el manager
    if (!sel.teamId && out.standing && out.me) {
      const meId = out.me.id ?? out.me.userId ?? null;
      const meName = out.me.managerName ?? out.me.nickname ?? out.me.name ?? null;
      const row = out.standing.find(r => {
        const m = (r.team && r.team.manager) || r.manager || {};
        return (meId && String(m.id ?? m.userId) === String(meId)) || (meName && (m.managerName === meName || m.name === meName));
      });
      const rid = row?.team?.id ?? row?.teamId ?? null;
      if (rid) { sel.teamId = String(rid); localStorage.setItem(LS.league, JSON.stringify(state.myLeague)); }
    }

    await step("market", async () => unwrapList(await authFetch(`/api/v1/competition/${c}/league/${sel.leagueId}/market?x-lang=es`)));
    const prevFirstAct = st.data[c] ? String(unwrapList(st.data[c].activity)[0]?.id ?? "") : null;
    await step("activity", () => authFetch(`/api/v1/competition/${c}/leagues/${sel.leagueId}/activity/0?x-lang=es`));
    // si hay operaciones nuevas en la liga (compras/ventas/cláusulas), las
    // plantillas cacheadas quedan viejas: se invalidan y se recargan solas
    const newFirstAct = String(unwrapList(out.activity)[0]?.id ?? "");
    if (prevFirstAct != null && newFirstAct && prevFirstAct !== newFirstAct) {
      state.rivalTeams[c] = {};
      state.actFull[c] = null;
      toast("Operaciones nuevas en tu liga: plantillas actualizadas", "ok");
    }
    if (sel.teamId) {
      await step("money", () => authFetch(`/api/v1/competition/${c}/teams/${sel.teamId}/money?x-lang=es`));
      await step("team", () => authFetch(`/api/v1/competition/${c}/leagues/${sel.leagueId}/teams/${sel.teamId}?x-lang=es`));
    }
  }
  st.data[c] = out;
  st.errors = errs;
  st.loading = false;
  snapshotWealth(c);
  scheduleSync(); // sube dinero/plantilla frescos a la nube personal
  // el historial se mantiene al día en segundo plano: así tus compras/ventas
  // reales entran solas en Mi Plantilla y Movimientos con precio y fecha exactos
  if (state.auth && !state.actFull[c]?.done) loadFullActivity(c);
  if (state.view === "liga") render();
}

/* =====================================================================
   MI LIGA · historial completo de actividad, presupuestos y operaciones
   ===================================================================== */
const INITIAL_BUDGET = 100000000;

async function loadFullActivity(c, force){
  const sel = state.myLeague[c];
  if (!sel) return;
  const st = state.actFull[c] || (state.actFull[c] = { items: [], done: false, loading: false });
  if (st.loading || (st.done && !force)) return;
  st.loading = true;

      const items = unwrapList(raw) || [];

      st.items.push(...items);

    }
    st.done = true;
  } catch(e) {
    state.liga.errors.push({ key: "actividad completa", msg: e.message, extra: "" });
  }
  st.loading = false;
  if (state.view === "liga") render();

  if (st.done) syncRealMoves(true).then(() => syncDraftPlayers(c));

/* Esquema REAL de la actividad (visto en LaLigaApp): activityTypeId
   (1 compró en mercado · 31 fichó a otro mánager · 32 clausuló · 33 vendió ·
   6 premio de jornada · 7 alineación incorrecta · 9 se unió · 4 blindó),
   user1Id/user1Name = quien actúa, user2Id/user2Name = contraparte,
   amount, playerMasterId/playerName/player, createdAt/timestamp. */
const ACT_LABEL = { 1:"compró", 31:"fichó", 32:"clausuló", 33:"vendió", 6:"premio de jornada", 7:"alineación incorrecta", 9:"se unió a la liga", 4:"blindó" };

function parseAct(a){
  const t = +(a.activityTypeId ?? 0);
  const pm = (a.playerMaster && typeof a.playerMaster === "object") ? a.playerMaster
           : ((a.player && typeof a.player === "object") ? a.player : null);
  const pid = a.playerMasterId ?? a.playerId ?? (pm ? pm.id : null);
  return {
    id: String(a.id ?? a.activityId ?? `${t}|${a.createdAt ?? a.timestamp ?? ""}|${pid ?? ""}|${a.user1Id ?? a.user1Name ?? ""}|${a.amount ?? ""}`),
    type: t,
    user1Id: a.user1Id != null ? String(a.user1Id) : null,
    user1Name: a.user1Name || null,
    user2Id: a.user2Id != null ? String(a.user2Id) : null,
    user2Name: a.user2Name || null,
    pid: pid != null ? String(pid) : null,
    name: (pm && (pm.nickname || pm.name)) || a.playerName || (typeof a.player === "string" ? a.player : "") || "",
    money: a.amount ?? a.money ?? null,
    date: a.createdAt ?? a.timestamp ?? a.date ?? null,
    week: a.weekNumber ?? null,
    desc: a.description || a.title || "",
  };
}

/* managerId/managerName -> teamId, a partir de la clasificación */
function managerMaps(c){
  const d = state.liga.data[c];
  const byId = new Map(), byName = new Map(), nameOf = new Map();
  for (const r of (d && d.standing) || []) {
    const team = r.team || r;
    const m = team.manager || {};
    const tid = String(team.id ?? "");
    if (m.id != null) byId.set(String(m.id), tid);
    if (m.managerName) { byName.set(m.managerName, tid); nameOf.set(tid, m.managerName); }
  }
  return { byId, byName, nameOf };
}
function actTeam(a, maps, which){
  const id = which === 1 ? a.user1Id : a.user2Id;
  const nm = which === 1 ? a.user1Name : a.user2Name;
  return (id && maps.byId.get(id)) || (nm && maps.byName.get(nm)) || null;
}

/* presupuestos de todos los equipos a partir del historial completo.
   100M iniciales + ventas − compras/cláusulas + premios de jornada REALES
   (tipo 6 del historial); si la liga no los emitiera, 100.000 €/punto. */
function computeBudgets(c){
  const d = state.liga.data[c];
  const act = state.actFull[c];
  const standing = (d && d.standing) || [];
  if (!act || !act.done || !standing.length) return null;
  const maps = managerMaps(c);

  const agg = {};
  const A = tid => agg[tid] || (agg[tid] = { buys: 0, sells: 0, prizes: 0, nBuys: 0, nSells: 0 });
  let hasPrizes = false;
  for (const raw of act.items) {
    const a = parseAct(raw);
    if (a.money == null) continue;
    const m = Math.abs(+a.money);
    const t1 = actTeam(a, maps, 1), t2 = actTeam(a, maps, 2);
    if (a.type === 6) { if (t1) { A(t1).prizes += m; hasPrizes = true; } }
    else if (a.type === 33) { if (t1) { A(t1).sells += m; A(t1).nSells++; } }
    else if (a.type === 1 || a.type === 31 || a.type === 32) {
      if (t1) { A(t1).buys += m; A(t1).nBuys++; }
      if (t2) { A(t2).sells += m; A(t2).nSells++; } // el que recibe el traspaso/cláusula cobra
    }
  }

  const myId = state.myLeague[c] && state.myLeague[c].teamId;
  const myMoney = ligaMoney(d && d.money);
  const rows = standing.map((r, i) => {
    const team = r.team || r;
    const tid = String(team.id ?? "");
    const ops = agg[tid] || { buys: 0, sells: 0, prizes: 0, nBuys: 0, nSells: 0 };
    const points = +(r.points ?? r.teamPoints ?? 0);
    const extra = hasPrizes ? ops.prizes : Math.round(100000 * points);
    const base = INITIAL_BUDGET - ops.buys + ops.sells;
    return {
      tid, pos: r.position ?? i + 1,
      name: team.name || (team.manager && team.manager.managerName) || "Equipo",
      manager: (team.manager && (team.manager.managerName || team.manager.name)) || "",
      points,
      teamValue: team.teamValue != null ? +team.teamValue : null,
      ...ops, extra, base,
      budget: (myId && tid === String(myId) && myMoney != null) ? myMoney : base + extra,
      isMe: !!(myId && tid === String(myId)),
    };
  });

  let incomplete = false;
  const me = rows.find(r => r.isMe);
  if (me && myMoney != null && Math.abs(myMoney - (me.base + me.extra)) > 3000000) incomplete = true;
  return { rows, hasPrizes, incomplete };
}
/* proyección de la clasificación final de la liga privada: ritmo actual de
   puntos por jornada jugada (jornadas = premios tipo 6 cobrados) × las que quedan */
function projectionHtml(c, B){
  const act = state.actFull[c];
  if (!act?.done) return "";
  const maps = managerMaps(c);
  const weeksPlayed = {};
  for (const raw of act.items) {
    const a = parseAct(raw);
    if (a.type !== 6) continue;
    const t1 = actTeam(a, maps, 1);
    if (t1) weeksPlayed[t1] = (weeksPlayed[t1] || 0) + 1;
  }
  const maxPlayed = Math.max(1, ...Object.values(weeksPlayed));
  const total = Object.keys(state.calFull[c]?.weeks || {}).length || (c === "2" ? 42 : 38);
  const cur = state.meta?.comps?.[c]?.weekNumber || 1;
  const remaining = Math.max(0, total - cur + 1);
  const rows = B.rows.map(r => {
    const played = weeksPlayed[r.tid] || maxPlayed;
    const rate = r.points / Math.max(1, played);
    return { ...r, rate, proj: Math.round(r.points + rate * remaining) };
  }).sort((a, b) => b.proj - a.proj);
  const me = rows.find(r => r.isMe);
  const leader = rows[0];
  let chase = "";
  if (me && leader && leader.tid !== me.tid) {
    const need = remaining > 0 ? (leader.proj - me.points) / remaining : 0;
    chase = `Para acabar primero necesitas <b>${need.toLocaleString("es-ES",{maximumFractionDigits:1})} pts/jornada</b> (llevas ${me.rate.toLocaleString("es-ES",{maximumFractionDigits:1})}).`;
  } else if (me && leader && leader.tid === me.tid) {
    chase = `Vas camino de ganar la liga: mantén el ritmo de ${me.rate.toLocaleString("es-ES",{maximumFractionDigits:1})} pts/jornada. 👑`;
  }
  return `<details class="card" style="padding:0;margin-bottom:10px">
    <summary style="padding:12px 14px;cursor:pointer;font-size:13px;font-weight:700;color:var(--text-2);list-style:none">🔮 Proyección final (a ${remaining} jornadas del final)</summary>
    <div style="padding:0 14px 12px">
      ${rows.map((r, i) => `<div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12.5px">
        <span class="rival-pos ${r.isMe ? "me" : ""}" style="width:22px;height:22px;font-size:11px">${i + 1}</span>
        <span style="flex:1;font-weight:${r.isMe ? 800 : 500}">${esc(r.manager || r.name)}${r.isMe ? " (tú)" : ""}</span>
        <span style="color:var(--text-3);font-size:11px">${r.rate.toLocaleString("es-ES",{maximumFractionDigits:1})}/j</span>
        <b style="font-variant-numeric:tabular-nums;color:var(--acc)">~${nfES.format(r.proj)}</b>
      </div>`).join("")}
      ${chase ? `<div style="font-size:12px;color:var(--text-2);margin-top:9px;line-height:1.5">${chase}</div>` : ""}
      <div style="font-size:10.5px;color:var(--text-3);margin-top:6px">Proyección simple: ritmo actual × jornadas restantes. El mercado la puede volcar — de eso va Fantasy Studio.</div>
    </div>
  </details>`;
}

/* serpentín: evolución de posiciones de la liga privada, jornada a jornada */
async function loadSerpent(c){
  const sel = state.myLeague[c];
  const wk = state.meta?.comps?.[c];
  if (!sel || !wk) return;
  const st = state.serpent || (state.serpent = {});
  if (st[c]?.loading || st[c]?.done) return;
  st[c] = { loading: true, weeks: [], byTeam: {} };
  render();
  const lastW = wk.previousWeek ?? (wk.weekNumber - 1);
  for (let w = 1; w <= lastW; w++) {
    try {
      const rows = unwrapList(await authFetch(`/api/v1/competition/${c}/leagues/${sel.leagueId}/standing/${w}?x-lang=es`));
      if (!rows.length) continue;
      // ordena por puntos ACUMULADOS hasta esa jornada si vienen; si el endpoint
      // ya da position, la usamos tal cual
      st[c].weeks.push(w);
      rows.forEach((r, i) => {
        const team = r.team || r;
        const tid = String(team.id ?? "");
        const t = st[c].byTeam[tid] || (st[c].byTeam[tid] = { name: team.manager?.managerName || team.name || "?", pos: {} });
        t.pos[w] = r.position ?? i + 1;
      });
    } catch(e) { /* jornada sin datos */ }
  }
  st[c].loading = false;
  st[c].done = true;
  render();
}

function serpentHtml(c){
  const sp = state.serpent?.[c];
  if (!sp) return `<button class="btn-ghost" style="width:100%;margin-bottom:10px" onclick="loadSerpent('${c}')">📈 Cargar serpentín (evolución de posiciones)</button>`;
  if (sp.loading) return `<div class="card" style="padding:16px;margin-bottom:10px;text-align:center;color:var(--text-3);font-size:12px">Leyendo las clasificaciones de cada jornada…</div>`;
  const weeks = sp.weeks;
  if (weeks.length < 2) return `<div class="card" style="padding:13px;margin-bottom:10px;font-size:12px;color:var(--text-3)">El serpentín necesita al menos 2 jornadas cerradas — vuelve tras la próxima.</div>`;
  const tids = Object.keys(sp.byTeam);
  const N = tids.length;
  const W = 460, H = 40 + N * 26, PL = 30, PR = 96, PT = 14, PB = 20;
  const x = i => PL + i * ((W - PL - PR) / Math.max(1, weeks.length - 1));
  const y = pos => PT + (pos - 1) * ((H - PT - PB) / Math.max(1, N - 1));
  const myId = String(state.myLeague[c]?.teamId || "");
  const palette = ["#60a5fa", "#f472b6", "#fb923c", "#a78bfa", "#22d3ee", "#facc15", "#34d399", "#f87171", "#c084fc", "#fbbf24"];
  let li = 0;
  const lines = tids.map(tid => {
    const t = sp.byTeam[tid];
    const mine = tid === myId;
    const col = mine ? "var(--acc)" : palette[li++ % palette.length];
    const pts = weeks.map((w, i) => t.pos[w] != null ? `${x(i).toFixed(1)},${y(t.pos[w]).toFixed(1)}` : null).filter(Boolean);
    if (pts.length < 2) return "";
    const lastPos = t.pos[weeks[weeks.length - 1]];
    return `<polyline points="${pts.join(" ")}" fill="none" stroke="${col}" stroke-width="${mine ? 3.4 : 1.8}" opacity="${mine ? 1 : 0.75}" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="${W - PR + 6}" y="${y(lastPos) + 3}" font-size="9.5" font-weight="${mine ? 800 : 500}" fill="${col}">${esc(t.name.slice(0, 12))}</text>`;
  }).join("");
  return `<div class="card" style="padding:12px;margin-bottom:10px">
    <h4 style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text-3);margin-bottom:8px">📈 Serpentín de la liga</h4>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
      ${weeks.map((w, i) => `<text x="${x(i)}" y="${H - 4}" text-anchor="middle" font-size="9" fill="var(--text-3)">J${w}</text>`).join("")}
      ${lines}
    </svg>
  </div>`;
}

/* foto diaria de los presupuestos (en este dispositivo) para ver quién acumula caja */
function snapshotBudgets(c, rows){
  const t = +new Date().toLocaleDateString("sv-SE", { timeZone: "Europe/Madrid" }).replace(/-/g, "");
  const all = load("fs_budget_hist", {});
  const cc = all[c] || (all[c] = {});
  for (const r of rows) {
    const arr = cc[r.tid] || (cc[r.tid] = []);
    if (!arr.length || arr[arr.length - 1][0] < t) arr.push([t, r.budget]);
    else arr[arr.length - 1][1] = r.budget;
    if (arr.length > 200) arr.splice(0, arr.length - 200);
  }
  try { localStorage.setItem("fs_budget_hist", JSON.stringify(all)); } catch(e){}
  return cc;
}
function seriesDelta7(series){
  if (!series || series.length < 2) return null;
  const last = series[series.length - 1];
  const target = intMinusDays(last[0], 7);
  let base = series[0];
  for (const e of series) { if (e[0] <= target) base = e; else break; }
  return last[1] - base[1];
}
function sparkFromSeries(series, w, h){
  if (!series || series.length < 2) return "";
  const W = w || 58, H = h || 22, P = 2;
  const vals = series.map(e => e[1]);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max - min) || 1;
  const step = (W - P*2) / (series.length - 1);
  const coords = series.map((e,i) => `${(P + i*step).toFixed(1)},${(H - P - ((e[1]-min)/range)*(H-P*2)).toFixed(1)}`).join(" ");
  const col = vals[vals.length-1] >= vals[0] ? "var(--green)" : "var(--red)";
  return `<svg viewBox="0 0 ${W} ${H}" style="width:${W}px;height:${H}px" preserveAspectRatio="none"><polyline points="${coords}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

/* valor histórico de un jugador en una fecha (para profit de plantillas iniciales) */
function histValueAt(c, pid, dateInt){
  const h = (state.history[c] || {})[String(pid)];
  if (!h || !h.length) return null;
  let best = h[0];
  for (const e of h) { if (e[0] <= dateInt) best = e; else break; }
  return best[1];
}

/* precios de compra reales por equipo+jugador según el historial */
function purchaseMap(c){
  const act = state.actFull[c];
  const map = {};
  if (!act || !act.done) return map;
  const maps = managerMaps(c);
  for (const raw of act.items) {
    const a = parseAct(raw);
    if ((a.type === 1 || a.type === 31 || a.type === 32) && a.pid && a.money != null) {
      const t1 = actTeam(a, maps, 1);
      if (t1) map[t1 + ":" + a.pid] = Math.abs(+a.money);
    }
  }
  return map;
}
async function toggleRival(tid){
  const c = comp();
  state.rivalOpen = state.rivalOpen === tid ? null : tid;
  const cache = state.rivalTeams[c] || (state.rivalTeams[c] = {});
  if (state.rivalOpen && !cache[tid]) {
    render();
    try {
      cache[tid] = await authFetch(`/api/v1/competition/${c}/leagues/${state.myLeague[c].leagueId}/teams/${tid}?x-lang=es`);
    } catch(e) {
      cache[tid] = { error: e.message };
    }
  }
  render();
}

/* ---------- operaciones reales: pujar, vender, retirar ---------- */
async function ligaAction(desc, fn){
  try {
    await fn();
    toast(desc + " ✔", "ok");
    vibrate(16);
    closeModal();
    loadLiga(true);
  } catch(e) {
    const extra = (typeof e.data === "object" && e.data) ? (e.data.message || e.data.code || "") : "";
    toast(`No se pudo: ${e.message}${extra ? " · " + extra : ""}`, "err");
  }
}

    </div>`, ov => {
      bindMoney(ov.querySelector("#bidAmount"));
      // simulador: ¿a quién superas con esta cantidad?
      const simEl = ov.querySelector("#bidSim");
      const simulate = () => {
        if (!simEl) return;
        const amount = moneyVal(ov.querySelector("#bidAmount"));
        const B = computeBudgets(c);
        if (!amount || !B) { simEl.innerHTML = B ? "" : `<div style="font-size:11px;color:var(--text-3)">Abre la pestaña Rivales una vez para activar el simulador de puja.</div>`; return; }
        const ratios = bidRatios(c);
        const pRef = state.byId[c].get(String(pidStr));
        const refVal = pRef ? pVal(pRef) : +price;
        const rivals = B.rows.filter(r => !r.isMe).map(r => {
          const cash = maxCash(r);
          const est = Math.max(+price, Math.round(refVal * (ratios[r.tid] || 1.08)));

          : beaten >= rivals.length - 1 ? ["🟡", `Ajustada: ${risky.map(r => esc(r.name)).join(", ")} suele llegar a ~${fmtM(risky[0].est)}.`]
