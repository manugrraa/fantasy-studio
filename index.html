/* ---------- sincronizar movimientos reales de mi liga ---------- */
async function syncRealMoves(auto){
  const c = comp();
  if (!state.auth || !state.myLeague[c]) { if (!auto) toast("Conéctate en Mi Liga primero", "err"); return; }
  if (!auto) toast("Leyendo el historial de tu liga…");
  await loadFullActivity(c);
  const act = state.actFull[c];
  if (!act?.done) { if (!auto) toast("No se pudo leer la actividad", "err"); return; }
  const myId = String(state.myLeague[c].teamId || "");
  const maps = managerMaps(c);
  const existing = new Set(state.moves[c].map(m => m.actId).filter(Boolean));
  const news = [];
  for (const raw of act.items) {
    const a = parseAct(raw);
    if (a.money == null || existing.has(a.id)) continue;
    const t1 = actTeam(a, maps, 1), t2 = actTeam(a, maps, 2);
    let kind = null;
    if ((a.type === 1 || a.type === 31 || a.type === 32) && t1 === myId) kind = "buy";
    else if ((a.type === 33 && t1 === myId) || ((a.type === 1 || a.type === 31 || a.type === 32) && t2 === myId)) kind = "sell";
    if (!kind) continue;
    const local = a.pid ? state.byId[c].get(a.pid) : null;
    a.name = a.name || (local ? local.nickname : "");
    if (!a.name) continue;
    a._kind = kind;
    news.push(a);
  }
  if (!news.length) { if (!auto) toast("Movimientos ya al día con tu liga", "ok"); return; }
  const buys = news.filter(a => a._kind === "buy").length;
  const sells = news.length - buys;
  if (!auto && !confirm(`Se importarán ${news.length} movimientos reales de tu liga (${buys} compras, ${sells} ventas). Las ventas calculan su beneficio contra tu precio de compra en Mi Plantilla si lo tienes. ¿Continuar?`)) return;
  const resumen = [];
  for (const a of news.reverse()) { // de viejo a nuevo
    const date = a.date ? String(a.date).slice(0, 10) : todayISO();
    const money = Math.abs(+a.money);
    if (a._kind === "sell") {
      const entry = state.squad[c].find(e => String(e.pid) === a.pid);
      const buyPrice = entry ? entry.buyPrice : null;
      state.moves[c].push({ id: uid(), actId: a.id, real: true, type: "sell", pid: a.pid, name: a.name, price: money, date, buyPrice, profit: buyPrice != null ? money - buyPrice : null });
      if (entry) state.squad[c] = state.squad[c].filter(e => e.id !== entry.id);
      resumen.push(`venta ${a.name} +${fmtM(money)}`);
    } else {
      const local = a.pid ? state.byId[c].get(a.pid) : null;
      state.moves[c].push({ id: uid(), actId: a.id, real: true, type: "buy", pid: a.pid, name: a.name, pos: local ? String(local.positionId) : null, price: money, date });
      const entry = a.pid ? squadEntry(a.pid) : null;
      if (entry) {
        // ya lo tenías a mano: se corrige al precio y fecha REALES de la compra
        entry.buyPrice = money;
        entry.buyDate = date;
        entry.imported = true;
      } else if (a.pid && local) {
        state.squad[c].push({ id: uid(), pid: a.pid, name: a.name, pos: String(local.positionId), teamId: String(local.teamId), buyPrice: money, buyDate: date, custom: false, imported: true });
      }
      resumen.push(`compra ${a.name} ${fmtM(money)}`);
    }
  }
  persist();
  render();
  vibrate(14);
  toast((auto ? "🔄 Tu liga trajo " + news.length + (news.length === 1 ? " operación: " : " operaciones: ") : news.length + " movimientos importados: ") + resumen.slice(0, 2).join(" · ") + (resumen.length > 2 ? " …" : ""), "ok");
}

/* plantilla inicial: los jugadores que vinieron CON el equipo (sin compra en el
   historial) valen lo que valían el día del alta en la liga, con esa fecha */
function syncDraftPlayers(c){
  const d = state.liga.data[c];
  const act = state.actFull[c];
  if (!state.auth || !d?.team || !act?.done) return;
  const myId = String(state.myLeague[c]?.teamId || "");
  const maps = managerMaps(c);

  // día en que me dieron el equipo: mi alta en la liga (tipo 9); si no consta,
  // el registro más antiguo del historial
  let joinDate = null;
  for (const raw of act.items) {
    const a = parseAct(raw);
    if (a.type === 9 && actTeam(a, maps, 1) === myId && a.date) joinDate = String(a.date).slice(0, 10);
  }
  if (!joinDate) {
    const dates = act.items.map(r => parseAct(r).date).filter(Boolean).map(x => String(x).slice(0, 10)).sort();
    if (!dates.length) return;
    joinDate = dates[0];
  }
  const joinInt = +joinDate.replace(/-/g, "");

  const pmap = purchaseMap(c);
  const fixed = [];
  for (const x of (d.team.players || d.team.playerTeams || [])) {
    const pm = x.playerMaster || x.player || x;
    const pid = String(pm.id ?? "");
    if (!pid || pmap[myId + ":" + pid] != null) continue; // ese sí lo compraste: precio real ya asignado
    const local = state.byId[c].get(pid);
    if (!local) continue;
    const v0 = histValueAt(c, pid, joinInt) ?? pVal(local);
    const entry = squadEntry(pid);
    if (entry) {
      if (entry.draft) continue; // ya ajustado
      entry.buyPrice = v0;
      entry.buyDate = joinDate;
      entry.draft = true;
      fixed.push(local.nickname);
    } else {
      state.squad[c].push({ id: uid(), pid, name: local.nickname, pos: String(local.positionId), teamId: String(local.teamId), buyPrice: v0, buyDate: joinDate, custom: false, draft: true, imported: true });
      fixed.push(local.nickname);
    }
  }
  if (fixed.length) {
    persist();
    render();
    toast("🎁 Plantilla inicial con su valor de origen (" + joinDate.split("-").reverse().slice(0, 2).join("/") + "): " + fixed.slice(0, 3).join(", ") + (fixed.length > 3 ? " +" + (fixed.length - 3) : ""), "ok");
  }
}

    <button class="btn-ghost" style="padding:8px 12px;font-size:12px" onclick="fantasyLogout()">Salir</button>
  </div>
  ${leagues.length > 1 ? `<div class="chips-row no-scrollbar">${leagues.map(l =>
    `<button class="chip ${sel && String(l.id) === String(sel.leagueId) ? "active" : ""}" onclick="pickLeague('${esc(String(l.id))}')">${esc(l.name || "Liga")}</button>`).join("")}</div>` : ""}`;

  if (!leagues.length) {
    return headHtml + `<div class="card"><div class="empty-state"><div class="big">🏝️</div>
      No se ha encontrado ninguna liga tuya en ${MODES[state.mode].label}.<br>
      Prueba a cambiar de modo arriba, o recarga.</div></div>
      ${diagHtml()}`;
  }

  const isLive = !!state.meta?.comps?.[c]?.isLive;
  const TABS = [
    ...(isLive ? [["directo","🔴 Directo"]] : []),
    ["mercado","Mercado del día"],["pujas","Mis pujas"],["ventas","Mis ventas"],["equipo","Mi equipo"],["once","Once ideal"],["clausulas","🔓 Cláusulas"],["rivales","Rivales"],["prensa","📰 Prensa"],["actividad","Actividad"],
    ...(!isLive ? [["directo","Directo"]] : []),
  ];
  const tabsHtml = `<div class="chips-row no-scrollbar" style="margin-bottom:12px">${TABS.map(([id,l]) =>
    `<button class="chip ${state.ligaTab === id ? "active" : ""}" onclick="state.ligaTab='${id}';render()">${l}</button>`).join("")}</div>`;

  let body = "";
  if (state.ligaTab === "directo") body = ligaTabDirecto(c, d);
  else if (state.ligaTab === "mercado") body = ligaTabMercado(c, d);
  else if (state.ligaTab === "pujas") body = ligaTabPujas(c, d);
  else if (state.ligaTab === "ventas") body = ligaTabVentas(c, d);
  else if (state.ligaTab === "equipo") body = ligaTabEquipo(c, d);
  else if (state.ligaTab === "once") body = ligaTabOnce(c, d);
  else if (state.ligaTab === "clausulas") body = ligaTabClausulas(c, d);
  else if (state.ligaTab === "prensa") body = ligaTabPrensa(c, d);
  else if (state.ligaTab === "rivales") body = ligaTabRivales(c, d);
  else body = ligaTabActividad(c, d);

  return headHtml + tabsHtml + body + diagHtml() +
    `<div style="font-size:11px;color:var(--text-3);margin-top:14px;line-height:1.5">
      Las pujas y ventas van a tu liga REAL, siempre con confirmación previa.
    </div>`;
}

/* rivales que podrían pujar un precio dado: dinero estimado + deuda permitida
   (en el juego puedes endeudarte hasta el 20% del valor de tu plantilla) */
function possibleBidders(c, price, excludeTid){
  const B = computeBudgets(c);
  if (!B) return null;
  return B.rows
    .filter(r => !r.isMe && String(r.tid) !== String(excludeTid || ""))
    .map(r => ({ ...r, maxBid: r.budget + (r.teamValue ? Math.round(r.teamValue * 0.2) : 0) }))
    .filter(r => r.maxBid >= price)
    .sort((a, b) => b.maxBid - a.maxBid);
}

/* --- pestaña: once ideal para la próxima jornada --- */
function ligaTabOnce(c, d){
  const teamPlayers = d.team ? (d.team.players || d.team.playerTeams || []) : [];
  if (!teamPlayers.length) return `<div class="card"><div class="empty-state"><div class="big">📋</div>No se pudo leer tu equipo</div></div>`;
  const n1 = v => (+v).toLocaleString("es-ES", { maximumFractionDigits: 1 });
  const scored = teamPlayers.map(x => {
    const pm = x.playerMaster || x.player || x;
    const pid = String(pm.id ?? "");
    const local = state.byId[c].get(pid);
    if (!local) return { pm, pid, pos: String(pm.positionId ?? "3"), score: 0, why: "sin datos", ok: true };
    const riv = rivalDifficulty(c, local.teamId);
    const okStatus = local.playerStatus === "ok";
    let score = form3(local) * 2 + (local.averagePoints || 0);
    if (riv) score += riv.level === 1 ? 1.5 : riv.level === 3 ? -1.5 : 0;
    if (!okStatus) score = -100;
    const why = okStatus
      ? `forma ${n1(form3(local))} · media ${n1(local.averagePoints || 0)}${riv && riv.rival ? ` · vs ${esc(riv.rival.shortName || riv.rival.name)} ${riv.level === 1 ? "🟢" : riv.level === 3 ? "🔴" : "🟡"}` : ""}`
      : (STATUS[local.playerStatus] || {}).label || "no disponible";
    return { pm, pid, pos: String(local.positionId), score, why, ok: okStatus, local };
  });
  const by = k => scored.filter(s => s.pos === k && s.pos !== "5").sort((a, b) => b.score - a.score);
  const G = by("1"), D = by("2"), M = by("3"), F = by("4");
  const FORMS = [[3,4,3],[3,5,2],[4,3,3],[4,4,2],[4,5,1],[5,3,2],[5,4,1]];
  let best = null;
  for (const [nd, nm, nf] of FORMS) {
    if (G.length < 1 || D.length < nd || M.length < nm || F.length < nf) continue;
    const xi = [G[0], ...D.slice(0, nd), ...M.slice(0, nm), ...F.slice(0, nf)];
    if (xi.some(s => !s.ok)) { /* se permite, pero penaliza solo */ }
    const total = xi.reduce((a, s) => a + Math.max(s.score, 0), 0);
    if (!best || total > best.total) best = { f: [nd, nm, nf], xi, total };
  }
  if (!best) return `<div class="card"><div class="empty-state">No hay jugadores suficientes para montar un once (necesitas portero, defensas, medios y delanteros)</div></div>`;
  const inXI = new Set(best.xi.map(s => s.pid));
  const bench = scored.filter(s => !inXI.has(s.pid) && s.pos !== "5").sort((a, b) => b.score - a.score);
  const row = s => ligaPlayerRow(s.pm, `<div class="p-right">
    <div class="p-val">${s.score > -50 ? n1(Math.max(s.score, 0)) : "—"}</div>
    <div class="p-sub">${s.why}</div>
  </div>`);
  const group = (label, list) => list.length ? `<div class="pl-group-head">${label}</div><div class="card" style="margin-bottom:8px">${list.map(row).join("")}</div>` : "";
  return `
  <div class="card" style="padding:13px 15px;margin-bottom:12px;display:flex;align-items:center;gap:12px">
    <div style="font-family:'Sora',sans-serif;font-size:20px;font-weight:800;color:var(--acc)">${best.f.join("-")}</div>
    <div style="flex:1;font-size:12px;color:var(--text-2);line-height:1.5">
      Once sugerido por <b>forma reciente, media y dificultad del próximo rival</b>. Los lesionados/sancionados quedan fuera solos.
    </div>
  </div>
  ${group("Portero", best.xi.slice(0, 1))}
  ${group("Defensas", best.xi.slice(1, 1 + best.f[0]))}
  ${group("Centrocampistas", best.xi.slice(1 + best.f[0], 1 + best.f[0] + best.f[1]))}
  ${group("Delanteros", best.xi.slice(1 + best.f[0] + best.f[1]))}
  ${bench.length ? group("Banquillo", bench) : ""}
  <div style="font-size:11px;color:var(--text-3);margin-top:10px">La alineación se cambia en la app oficial; esto es la recomendación de Fantasy Studio.</div>`;
}

/* --- ofertas recibidas por mis jugadores --- */
async function scanOffers(){
  const c = comp();
  const d = state.liga.data[c];
  const sel = state.myLeague[c];
  const teamPlayers = d?.team ? (d.team.players || d.team.playerTeams || []) : [];
  if (!teamPlayers.length || !sel) { toast("Primero carga Mi equipo", "err"); return; }
  toast("Buscando ofertas por tus " + teamPlayers.length + " jugadores…");
  const found = [];
  for (const x of teamPlayers) {
    const pm = x.playerMaster || x.player || x;
    const ptId = (x.playerMaster || x.player) ? (x.id ?? x.playerTeamId) : (x.playerTeamId ?? null);
    if (ptId == null) continue;
    try {
      const raw = await authFetch(`/api/v1/competition/${c}/league/${sel.leagueId}/playerTeam/${ptId}/offer?x-lang=es`);
      const offers = unwrapList(raw).length ? unwrapList(raw) : (raw && raw.id != null ? [raw] : []);
      for (const off of offers) found.push({ pm, off, raw });
    } catch(e) { /* 404 = sin oferta para ese jugador */ }
  }
  d.offers = found;
  render();
  toast(found.length ? found.length + (found.length === 1 ? " oferta encontrada" : " ofertas encontradas") : "Nadie ha hecho ofertas por tus jugadores", found.length ? "ok" : undefined);
}
function offersHtml(c, d){
  if (!d.offers) return `<button class="btn-ghost" style="width:100%;margin-top:12px" onclick="scanOffers()">🔎 Buscar ofertas recibidas de rivales</button>`;
  if (!d.offers.length) return `<div style="font-size:11.5px;color:var(--text-3);margin-top:12px;text-align:center">Sin ofertas de rivales ahora mismo · <button style="color:var(--acc)" onclick="scanOffers()">volver a buscar</button></div>`;
  return `<div class="section-title" style="margin-top:16px">📩 Ofertas recibidas</div>
  <div class="card">${d.offers.map(({ pm, off }, i) => {
    const money = off.money ?? off.offerMoney ?? off.amount ?? null;
    const from = off.team?.manager?.managerName || off.buyerTeam?.manager?.managerName || "un rival";
    const marketId = off.marketId ?? off.market?.id ?? null;
    const canAct = marketId != null && off.id != null;
    return ligaPlayerRow(pm, `<div class="p-right" style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">
      <div><span class="p-val up">${money != null ? fmtM(+money) + " €" : "—"}</span>
        <div class="p-sub">de ${esc(from)}</div></div>

/* --- cláusulas: peligro para las mías y oportunidades en las suyas --- */
async function loadAllRivalTeams(c){
  const d = state.liga.data[c];
  const sel = state.myLeague[c];
  if (!d?.standing || !sel) return;
  const cache = state.rivalTeams[c] || (state.rivalTeams[c] = {});
  if (cache._all) return;
  for (const r of d.standing) {
    const tid = String((r.team || r).id ?? "");
    if (!tid || tid === String(sel.teamId) || cache[tid]) continue;
    try { cache[tid] = await authFetch(`/api/v1/competition/${c}/leagues/${sel.leagueId}/teams/${tid}?x-lang=es`); }
    catch(e) { cache[tid] = { error: e.message }; }
  }
  cache._all = true;
  if (state.view === "liga") render();
}

function maxCash(r){ return r.budget + (r.teamValue ? Math.round(r.teamValue * 0.2) : 0); }

/* patrón de puja por equipo: cuánto suelen pagar sobre el valor de mercado
   del día (de las compras del historial); 1.08 por defecto, tope 1..2 */
function bidRatios(c){
  const act = state.actFull[c];
  const out = {};
  if (!act || !act.done) return out;
  const maps = managerMaps(c);
  const acc = {};
  for (const raw of act.items) {
    const a = parseAct(raw);
    if (a.type !== 1 && a.type !== 31) continue;
    if (!a.pid || a.money == null || !a.date) continue;
    const tid = actTeam(a, maps, 1);
    if (!tid) continue;
    const dayVal = histValueAt(c, a.pid, +String(a.date).slice(0, 10).replace(/-/g, ""));
    if (!dayVal) continue;
    const ratio = Math.min(2, Math.max(1, Math.abs(+a.money) / dayVal));
    (acc[tid] = acc[tid] || []).push(ratio);
  }
  for (const tid in acc) out[tid] = acc[tid].reduce((x, y) => x + y, 0) / acc[tid].length;
  return out;
}

function ligaTabClausulas(c, d){
  const act = state.actFull[c];
  if (!act || !act.done) {
    if (!act || !act.loading) setTimeout(() => loadFullActivity(c), 30);
    return `<div class="card"><div class="empty-state"><div class="big">🔓</div>Calculando presupuestos de la liga…</div></div>`;
  }
  const B = computeBudgets(c);
  if (!B) return `<div class="card"><div class="empty-state">Sin clasificación todavía</div></div>`;
  const cache = state.rivalTeams[c] || {};
  if (!cache._all) {
    setTimeout(() => loadAllRivalTeams(c), 30);
    return `<div class="card"><div class="empty-state"><div class="big">🔓</div>Leyendo las cláusulas de todos los equipos…</div></div>`;
  }
  const money = ligaMoney(d.money);
  const myReach = money != null ? money + Math.round((B.rows.find(r => r.isMe)?.teamValue || 0) * 0.2) : null;

  // 1) mis jugadores en peligro: cláusula al alcance de algún rival
  const myPlayers = d.team ? (d.team.players || d.team.playerTeams || []) : [];
  const rivals = B.rows.filter(r => !r.isMe);
  const danger = [];
  for (const x of myPlayers) {
    const clause = x.buyoutClause;
    if (clause == null) continue;
    const pm = x.playerMaster || x.player || x;
    const threats = rivals.filter(r => maxCash(r) >= +clause).sort((a, b) => maxCash(b) - maxCash(a));
    if (threats.length) danger.push({ pm, clause: +clause, threats });
  }
  danger.sort((a, b) => a.clause - b.clause);

  // 2) cláusulas de rivales a mi alcance (chollo si cláusula < valor de mercado)
  const chances = [];
  for (const r of rivals) {
    const team = cache[r.tid];
    if (!team || team.error) continue;
    for (const x of (team.players || team.playerTeams || [])) {
      const clause = x.buyoutClause;
      if (clause == null || myReach == null || +clause > myReach) continue;
      const pm = x.playerMaster || x.player || x;
      const local = state.byId[c].get(String(pm.id ?? ""));
      const val = local ? pVal(local) : (pm.marketValue != null ? +pm.marketValue : null);
      chances.push({ pm, x, clause: +clause, val, owner: r.manager || r.name, ratio: val != null ? val / +clause : 0 });
    }
  }
  chances.sort((a, b) => b.ratio - a.ratio);

  return `
  <div class="card" style="padding:11px 14px;margin-bottom:12px;font-size:12px;color:var(--text-2);line-height:1.55">
    Alcance = dinero + deuda permitida (20% del valor de plantilla).${money != null ? ` El tuyo: <b style="color:var(--acc)">${fmtM(myReach)} €</b>.` : ""}
  </div>
  <div class="section-title">🚨 Tus jugadores en peligro (${danger.length})</div>
  ${danger.length ? `<div class="card">${danger.map(dd => {
      // asesor de blindaje: cláusula mínima para quedar fuera del alcance del rival más rico (+5% de margen)
      const worst = Math.max(...dd.threats.map(maxCash));
      const safe = Math.ceil(worst * 1.05 / 100000) * 100000;
      return ligaPlayerRow(dd.pm, `<div class="p-right">
      <div class="p-val">${fmtM(dd.clause)} €</div>
      <div class="p-sub" style="color:var(--red)">al alcance de ${dd.threats.slice(0,2).map(t => esc(t.manager || t.name)).join(", ")}${dd.threats.length > 2 ? " +" + (dd.threats.length - 2) : ""}</div>
      <div class="p-sub" style="margin-top:2px">🛡 blíndalo hasta <b style="color:var(--acc)">${fmtM(safe)}</b> <span style="color:var(--text-3)">(+${fmtM(safe - dd.clause)})</span></div>
    </div>`);
    }).join("")}</div>
    <div style="font-size:11px;color:var(--text-3);margin-top:6px;padding:0 4px">🛡 = cláusula mínima para quedar fuera del alcance del rival más rico, con un 5 % de margen. La subida se hace en la app oficial (cada juego cobra su tarifa por blindar).</div>`
    : `<div class="card" style="padding:14px;font-size:12.5px;color:var(--green)">✅ Ninguna de tus cláusulas está al alcance de un rival ahora mismo.</div>`}

  <div class="section-title">🎯 Cláusulas a tu alcance (${chances.length})</div>
  ${chances.length ? `<div class="card">${chances.slice(0, 25).map((ch, i) => ligaPlayerRow(ch.pm, `<div class="p-right" style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">
      <div><span class="p-val">${fmtM(ch.clause)} €</span>
        <div class="p-sub">${ch.val != null ? "vale " + fmtM(ch.val) + (ch.ratio >= 1.15 ? " · <b class='up'>chollo</b>" : "") : ""} · de ${esc(ch.owner)}</div></div>
      <button class="btn-ghost" style="padding:6px 11px;font-size:11.5px" onclick="event.stopPropagation();payClauseUI(${i})">Pagar cláusula</button>
    </div>`)).join("")}</div>` : `<div class="card" style="padding:14px;font-size:12.5px;color:var(--text-3)">Ninguna cláusula rival te resulta pagable ahora.</div>`}`;
}

/* =====================================================================
   COMPARADOR DE MÁNAGERS: yo contra un rival
   ===================================================================== */
function managerStyle(c, tid, row, avgOps){
  const act = state.actFull[c];
  const maps = managerMaps(c);
  let claus = 0;
  for (const raw of act?.items || []) {
    const a = parseAct(raw);
    if (a.type === 32 && actTeam(a, maps, 1) === String(tid)) claus++;
  }
  const ops = row.nBuys + row.nSells;
  if (claus >= 2) return "🔒 Clausulador";
  if (ops <= 2) return "🧘 Pasivo";
  if (ops >= avgOps * 1.6) return "🔄 Mercadillo andante";
  return "⚖ Equilibrado";
}

function teamProfitSum(c, tid, team, pmap, startInt){
  let sum = 0, n = 0;
  for (const x of (team?.players || team?.playerTeams || [])) {
    const pm = x.playerMaster || x.player || x;
    const pid = String(pm.id ?? "");
    const local = state.byId[c].get(pid);
    const val = local ? pVal(local) : (pm.marketValue != null ? +pm.marketValue : null);
    const paid = pmap[tid + ":" + pid] ?? (startInt ? histValueAt(c, pid, startInt) : null);
    if (val != null && paid != null) { sum += val - paid; n++; }
  }
  return { sum, n };
}

async function openManagerCompare(tid){
  const c = comp();
  const B = computeBudgets(c);
  if (!B) { toast("Abre Rivales primero", "err"); return; }

  const riv = B.rows.find(r => String(r.tid) === String(tid));
  if (!me || !riv) { toast("No encuentro tu equipo en la clasificación", "err"); return; }
  const cache = state.rivalTeams[c] || (state.rivalTeams[c] = {});
  const sel = state.myLeague[c];
  for (const t of [String(me.tid), String(riv.tid)]) {
    if (!cache[t] && !(t === String(sel.teamId) && state.liga.data[c]?.team)) {
      try { cache[t] = await authFetch(`/api/v1/competition/${c}/leagues/${sel.leagueId}/teams/${t}?x-lang=es`); }
      catch(e) { cache[t] = { error: e.message }; }

  }
  const myTeam = cache[String(me.tid)] || state.liga.data[c]?.team;
  const rivTeam = cache[String(riv.tid)];
  const act = state.actFull[c];

  const pMe = teamProfitSum(c, String(me.tid), myTeam, pmap, startInt);
  const pRiv = teamProfitSum(c, String(riv.tid), rivTeam, pmap, startInt);
  const avgOps = B.rows.reduce((a, r) => a + r.nBuys + r.nSells, 0) / (B.rows.length || 1);
  const wealth = r => r.budget + (r.teamValue || 0);

  const rows = [
    ["Posición", "#" + me.pos, "#" + riv.pos, riv.pos - me.pos],
    ["Puntos", me.points, riv.points, me.points - riv.points],
    ["Valor de equipo", fmtM(me.teamValue || 0), fmtM(riv.teamValue || 0), (me.teamValue||0) - (riv.teamValue||0)],

    ["Premios de jornada", "+" + fmtM(me.extra), "+" + fmtM(riv.extra), me.extra - riv.extra],
    ["Profit de su plantilla", pMe.n ? fmtMSign(pMe.sum) : "—", pRiv.n ? fmtMSign(pRiv.sum) : "—", (pMe.n ? pMe.sum : 0) - (pRiv.n ? pRiv.sum : 0)],
    ["Estilo", managerStyle(c, me.tid, me, avgOps), managerStyle(c, riv.tid, riv, avgOps), 0],
  ];
  openModal(`

    <div class="modal-body">
      <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:14px;text-align:center">
        <div><div style="font-size:14px;font-weight:800">${esc(me.manager || me.name)}</div><div style="font-size:10.5px;color:var(--acc)">TÚ</div></div>
        <div style="font-size:16px;font-weight:800;color:var(--text-3)">VS</div>
        <div><div style="font-size:14px;font-weight:800">${esc(riv.manager || riv.name)}</div><div style="font-size:10.5px;color:var(--text-3)">${esc(riv.name)}</div></div>
      </div>
      <div class="card" style="overflow:hidden">
        ${rows.map(([lbl, va, vb, diff]) => `
          <div style="display:grid;grid-template-columns:1fr 118px 1fr;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border);font-size:12.5px;font-variant-numeric:tabular-nums;align-items:center">
            <div style="text-align:right;font-weight:${diff > 0 ? 800 : 500};color:${diff > 0 ? "var(--green)" : "var(--text-2)"}">${va}</div>
            <div style="text-align:center;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text-3)">${lbl}</div>
            <div style="text-align:left;font-weight:${diff < 0 ? 800 : 500};color:${diff < 0 ? "var(--green)" : "var(--text-2)"}">${vb}</div>
          </div>`).join("")}
      </div>
      <div style="display:flex;gap:9px;margin-top:12px">
        <button class="btn-acc" style="flex:1" onclick="shareDuelImage()">🖼 Imagen</button>

  <button class="btn-ghost" style="width:100%;margin-top:6px" onclick="loadFullActivity(comp(), true)">Recalcular con el historial más reciente</button>`;
}

/* --- pestaña: 🔴 salón del directo --- */
function weekPts(c, pid, week){
  const p = state.byId[c].get(String(pid));
  const wp = p && (p.weekPoints || []).find(w => w.weekNumber === week);
  return wp ? (wp.points || 0) : null;
}

function ligaTabDirecto(c, d){
  const week = state.meta?.comps?.[c];
  const wn = week?.weekNumber;
  if (!wn) return `<div class="card"><div class="empty-state">Sin jornada activa</div></div>`;
  const isLive = !!week.isLive;

  // mi once (de Mi Plantilla); sin once, aviso
  const lu = state.lineup[c];
  let mineHtml, myLive = 0, myCount = 0;
  if (!lu || !lu.ids?.length) {
    mineHtml = `<div class="card" style="padding:16px;text-align:center;font-size:13px;color:var(--text-2)">
      Monta <b>tu once</b> en Mi Plantilla para seguirlo aquí en vivo.
      <button class="btn-acc" style="width:100%;margin-top:12px" onclick="setView('plantilla')">Ir a Mi Plantilla ›</button></div>`;
  } else {
    const rows = lu.ids.map(pid => {
      const p = state.byId[c].get(String(pid));
      if (!p) return "";
      const pts = weekPts(c, pid, wn);
      if (pts != null) { myLive += pts; myCount++; }
      return playerRow(p, { reason: pts != null ? `<b class="${pts >= 5 ? "up" : pts < 0 ? "down" : ""}">${pts} pts en la J${wn}</b>` : `<span style="color:var(--text-3)">aún sin puntuar</span>`, noSpark: true });
    }).join("");
    mineHtml = `
    <div class="stat-grid" style="margin-bottom:12px">
      ${statTile("Mis puntos J" + wn, `<span style="color:var(--acc)">${myLive}</span>`, myCount + "/11 han puntuado")}
      ${statTile("Dinero generado", "+" + fmtM(myLive * 100000) + " €", "a 100.000 €/punto")}
    </div>
    <div class="card">${rows}</div>`;
  }

  // clasificación en vivo estimada de la liga: puntos previos + jornada actual
  // de cada plantilla rival (sus 11 mejores puntuaciones de la jornada)
  const act = state.actFull[c];
  if (!act || (!act.done && !act.loading)) setTimeout(() => loadFullActivity(c), 30);
  const B = computeBudgets(c);
  const cache = state.rivalTeams[c] || {};
  let liveTable = "";
  if (!B) {
    liveTable = `<div class="section-title">Clasificación en vivo (estimada)</div>
      <div class="card"><div class="empty-state" style="padding:20px">Preparando la clasificación de tu liga…</div></div>`;
  }
  if (B) {
    if (!cache._all) {
      setTimeout(() => loadAllRivalTeams(c), 30);
      liveTable = `<div class="section-title">Clasificación en vivo (estimada)</div>
        <div class="card"><div class="empty-state" style="padding:20px">Cargando los equipos de tus rivales…</div></div>`;
    } else {
      const sel = state.myLeague[c];
      const rows = B.rows.map(r => {
        let team = cache[r.tid];
        if (r.isMe && (!team || team.error)) team = d.team;
        let jpts = null;
        if (r.isMe && lu?.ids?.length) {
          jpts = lu.ids.reduce((a, pid) => a + (weekPts(c, pid, wn) || 0), 0);
        } else if (team && !team.error) {
          const all = (team.players || team.playerTeams || [])
            .map(x => { const pm = x.playerMaster || x.player || x; return weekPts(c, pm.id, wn) || 0; })
            .sort((a, b) => b - a).slice(0, 11);
          jpts = all.reduce((a, b) => a + b, 0);
        }
        return { ...r, jpts: jpts ?? 0, total: r.points + (jpts ?? 0) };
      }).sort((a, b) => b.total - a.total);
      liveTable = `<div class="section-title">Clasificación en vivo (estimada)</div>
      <div class="card">${rows.map((r, i) => {
        const moved = r.pos - (i + 1);
        return `<div class="p-row" onclick="openRivalLive('${r.tid}')">
          <span class="rival-pos ${r.isMe ? "me" : ""}">${i + 1}</span>
          <div class="p-main"><div class="p-name">${esc(r.manager || r.name)}${r.isMe ? ` <span class="badge acc" style="padding:1px 6px;font-size:9px">YO</span>` : ""}</div>
            <div class="p-meta">J${wn}: <b class="${r.jpts >= 40 ? "up" : ""}">+${r.jpts}</b>${moved ? ` · ${moved > 0 ? "▲" : "▼"}${Math.abs(moved)}` : ""}</div></div>
          <div class="p-right"><div class="p-val">${nfES.format(r.total)}</div><div class="p-sub">pts totales</div></div>
          <span style="color:var(--text-3);margin-left:2px">›</span>
        </div>`;
      }).join("")}</div>
      <div style="font-size:10.5px;color:var(--text-3);margin-top:8px;padding:0 4px">
        Estimación con las 11 mejores puntuaciones de cada plantilla en la J${wn} (los onces reales de los rivales no son visibles). Toca un equipo para ver sus jugadores y puntos. Los datos entran solos cada ~15 min.
      </div>`;
    }
  }

  return `
  <div class="card" style="padding:13px 15px;margin-bottom:12px;display:flex;align-items:center;gap:11px">
    <span class="sync-dot ${isLive ? "pulsing" : ""}" style="background:${isLive ? "var(--red)" : "var(--text-3)"}"></span>
    <div style="flex:1;font-size:13px;font-weight:700">Jornada ${wn} ${isLive ? "EN JUEGO" : "· sin partidos ahora"}</div>
    <button class="icon-btn" onclick="autoCheck().then(()=>render())" title="Refrescar">${IC.refresh}</button>
  </div>
  ${mineHtml}
  ${liveTable}`;
}

/* ficha en vivo de un equipo de la liga: todos sus jugadores con los puntos
   de la jornada, igual que mi once (desde la clasificación del Directo) */
function openRivalLive(tid){
  const c = comp();
  const week = state.meta?.comps?.[c];
  const wn = week?.weekNumber;
  if (!wn) return;
  const d = state.liga.data[c];
  const B = computeBudgets(c);
  const r = B?.rows.find(x => String(x.tid) === String(tid));
  const isMe = !!r?.isMe;
  let team = (state.rivalTeams[c] || {})[String(tid)];
  if (isMe && (!team || team.error)) team = d?.team;
  const title = esc(r?.manager || r?.name || "Equipo");
  if (!team || team.error) {
    openModal(`${modalHead("🔴 " + title)}<div class="modal-body">
      <div class="empty-state" style="padding:24px">${team?.error ? esc(team.error) : "Cargando su equipo… vuelve a abrirlo en unos segundos."}</div></div>`);
    return;
  }
  const lu = isMe ? state.lineup[c] : null;
  const luIds = lu?.ids?.length ? new Set(lu.ids.map(String)) : null;
  const players = (team.players || team.playerTeams || []).map(x => {
    const pm = x.playerMaster || x.player || x;
    const pid = String(pm.id ?? "");
    return { pm, pid, pts: weekPts(c, pid, wn) };
  }).sort((a, b) => (b.pts ?? -99) - (a.pts ?? -99));
  // qué puntuaciones cuentan: mi once real si existe; para rivales, sus 11 mejores
  const counted = luIds
    ? new Set(players.filter(x => luIds.has(x.pid)).map(x => x.pid))
    : new Set(players.filter(x => x.pts != null).slice(0, 11).map(x => x.pid));
  const jpts = players.reduce((a, x) => a + (counted.has(x.pid) ? (x.pts || 0) : 0), 0);
  const scored = players.filter(x => x.pts != null).length;
  openModal(`
    ${modalHead("🔴 " + title + (isMe ? " · YO" : ""))}
    <div class="modal-body">
      <div class="stat-grid" style="margin-bottom:12px">
        ${statTile("Puntos J" + wn, `<span style="color:var(--acc)">${jpts}</span>`, scored + "/" + players.length + " han puntuado")}
        ${statTile("Total en vivo", nfES.format((r?.points || 0) + jpts), nfES.format(r?.points || 0) + " + J" + wn)}
      </div>
      <div class="card">${players.map(x => {
        const badge = counted.has(x.pid)
          ? `<span class="badge acc" style="padding:1px 6px;font-size:9px">${luIds ? "ONCE" : "CUENTA"}</span>`
          : `<span style="color:var(--text-3)">${x.pts == null ? "sin puntuar" : "no cuenta"}</span>`;
        return ligaPlayerRow(x.pm, `<div class="p-right">
          <div class="p-val ${x.pts != null ? (x.pts >= 5 ? "up" : x.pts < 0 ? "down" : "") : ""}">${x.pts != null ? x.pts + " pts" : "—"}</div>
          <div class="p-sub">${badge}</div>
        </div>`);
      }).join("")}</div>
      <div style="font-size:10.5px;color:var(--text-3);margin-top:8px">
        ${luIds ? "Cuentan los 11 de tu once." : "El once real del rival no es visible: cuentan sus 11 mejores puntuaciones de la J" + wn + "."}
        ${week.isLive ? " Los puntos entran solos cada ~15 min: puedes dejar la ficha abierta." : ""}
        Toca un jugador para abrir su ficha.
      </div>
    </div>`);
}

/* --- pestaña: prensa de la liga (titulares con los datos del historial) --- */
function ligaTabPrensa(c, d){
  const act = state.actFull[c];
  if (!act || !act.done) {
    if (!act || !act.loading) setTimeout(() => loadFullActivity(c), 30);
    return `<div class="card"><div class="empty-state"><div class="big">📰</div>Redactando la crónica de tu liga…</div></div>`;
  }
  const B = computeBudgets(c);
  if (!B) return `<div class="card"><div class="empty-state">Sin clasificación todavía</div></div>`;
  const maps = managerMaps(c);
  const claus = {};
  const weeks6 = {};
  for (const raw of act.items) {
    const a = parseAct(raw);
    const t1 = actTeam(a, maps, 1);
    if (!t1) continue;
    if (a.type === 32) claus[t1] = (claus[t1] || 0) + 1;
    if (a.type === 6) weeks6[t1] = (weeks6[t1] || 0) + 1;
  }
  const name = r => esc(r.manager || r.name);
  const rows = B.rows;
  const avgOps = rows.reduce((a, r) => a + r.nBuys + r.nSells, 0) / (rows.length || 1);
  const by = fn => [...rows].sort((a, b) => fn(b) - fn(a))[0];
  const heads = [];
  const rico = by(r => r.extra / Math.max(1, weeks6[r.tid] || 1));
  if (rico && rico.extra) heads.push(["💰", `<b>${name(rico)}</b>, la gallina de los huevos de oro: ${fmtM(Math.round(rico.extra / Math.max(1, weeks6[rico.tid] || 1)))} de premio por jornada.`]);
  const martillo = by(r => r.nBuys + r.nSells);
  if (martillo && martillo.nBuys + martillo.nSells > 0) heads.push(["🔨", `<b>${name(martillo)}</b> no suelta el martillo: ${martillo.nBuys + martillo.nSells} operaciones ya.`]);
  const clausTid = Object.keys(claus).sort((a, b) => claus[b] - claus[a])[0];
  if (clausTid) { const r = rows.find(x => x.tid === clausTid); if (r) heads.push(["🔒", `<b>${name(r)}</b>, rey de la cláusula: ${claus[clausTid]} ${claus[clausTid] === 1 ? "robo" : "robos"} a domicilio.`]); }
  const gastador = by(r => r.buys);
  if (gastador && gastador.buys) heads.push(["💸", `<b>${name(gastador)}</b> quema la tarjeta: ${fmtM(gastador.buys)} gastados en fichajes.`]);
  const vendedor = by(r => r.sells);
  if (vendedor && vendedor.sells) heads.push(["🤑", `<b>${name(vendedor)}</b>, el mercader: ${fmtM(vendedor.sells)} ingresados en ventas.`]);
  const monje = [...rows].sort((a, b) => (a.nBuys + a.nSells) - (b.nBuys + b.nSells))[0];
  if (monje && monje.nBuys + monje.nSells <= 2) heads.push(["🧘", `<b>${name(monje)}</b> medita: solo ${monje.nBuys + monje.nSells} ${monje.nBuys + monje.nSells === 1 ? "operación" : "operaciones"}. ¿Estrategia o siesta?`]);

  window._lastPrensa = {
    heads: heads.map(([e, t]) => e + " " + t.replace(/<[^>]+>/g, "")),
    styles: rows.map(r => `${r.pos}. ${r.manager || r.name}${r.isMe ? " (yo)" : ""} — ${managerStyle(c, r.tid, r, avgOps)} (${r.nBuys + r.nSells} ops)`),
  };
  return `
  <div class="section-title">📰 Titulares de la liga
    <button style="margin-left:auto;color:var(--acc);font-size:11.5px;font-weight:700" onclick="sharePrensaText()">💬 Compartir texto ›</button>
  </div>
  ${heads.map(([e, t]) => `<div class="card" style="padding:13px 15px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start">
    <div style="font-size:22px">${e}</div>
    <div style="font-size:13px;line-height:1.55;color:var(--text-2)">${t}</div>
  </div>`).join("")}
  <div class="section-title">Estilo de cada mánager</div>
  <div class="card">${rows.map(r => `<div class="p-row" style="cursor:default">
    <span class="rival-pos ${r.isMe ? "me" : ""}">${r.pos}</span>
    <div class="p-main"><div class="p-name">${name(r)}${r.isMe ? " (tú)" : ""}</div>
      <div class="p-meta">${r.nBuys + r.nSells} ops · ${fmtM(r.buys)} gastados · ${fmtM(r.sells)} vendidos</div></div>
    <span class="badge">${managerStyle(c, r.tid, r, avgOps)}</span>
  </div>`).join("")}</div>`;
}

/* --- pestaña: actividad --- */
function ligaTabActividad(c, d){
  const act = state.actFull[c];
  const items = act && act.done ? act.items : unwrapList(d.activity) || [];
  if (!items.length) return `<div class="card"><div class="empty-state"><div class="big">📭</div>Sin actividad reciente</div></div>`;
  const maps = managerMaps(c);
  const who = (a, n) => (n === 1 ? a.user1Name : a.user2Name) || maps.nameOf.get(actTeam(a, maps, n)) || null;
  return `
  ${!(act && act.done) ? `<button class="btn-ghost" style="width:100%;margin-bottom:10px" onclick="loadFullActivity(comp())">Cargar historial completo</button>`
    : `<div style="display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-3);margin-bottom:10px">
        <span style="flex:1">${items.length} operaciones en total</span>
        <button style="color:var(--acc);font-weight:600" onclick="copyRawActivity()">Copiar muestra técnica</button>
      </div>`}
  <div class="card">${items.slice(0, 80).map(raw => {
    const a = parseAct(raw);
    const gasto = a.type === 1 || a.type === 31 || a.type === 32;
    const ingreso = a.type === 33 || a.type === 6;
    const u1 = who(a, 1) || "Alguien", u2 = who(a, 2);
    const money = a.money != null ? Math.abs(+a.money) : null;
    let frase;
    if (a.type === 6) frase = `<b>${esc(u1)}</b> ganó <b>${fmtM(money||0)} €</b> de premio${a.week ? " (J" + a.week + ")" : " de jornada"}`;
    else if (a.type === 7) frase = `<b>${esc(u1)}</b> no puntuó por alineación incorrecta${a.week ? " (J" + a.week + ")" : ""}`;
    else if (a.type === 9) frase = `<b>${esc(u1)}</b> se unió a la liga`;
    else if (ACT_LABEL[a.type]) frase = `<b>${esc(u1)}</b> ${ACT_LABEL[a.type]}${a.name ? ` a <b>${esc(a.name)}</b>` : ""}${money ? ` por <b>${fmtM(money)} €</b>` : ""}${u2 ? ` a <b>${esc(u2)}</b>` : ""}`;
    else frase = esc(a.desc || "Operación");
    return `<div class="mv-row">
      <div class="mv-icon ${ingreso ? "sell" : gasto ? "buy" : ""}" ${!ingreso && !gasto ? 'style="background:var(--card-2);color:var(--text-3)"' : ""}>${ingreso ? IC.upar : gasto ? IC.down : IC.moves}</div>
      <div class="p-main">
        <div style="font-size:12.5px;line-height:1.5;color:var(--text-2)">${frase}</div>
        <div class="p-meta">${a.date ? fmtDate(a.date) : ""}</div>
      </div>
    </div>`;
  }).join("")}</div>`;
}

function importLigaSquad(){
  const c = comp();
  const d = state.liga.data[c];
  const list = d?.team ? (d.team.players || d.team.playerTeams || []) : [];
  if (!list.length) { toast("No hay equipo que importar", "err"); return; }
  const nuevos = list.filter(x => { const pm = x.playerMaster || x.player || x; return pm?.id && !squadEntry(pm.id); });
  if (!nuevos.length) { toast("Ya están todos en Mi Plantilla"); return; }
  if (!confirm(`Se añadirán ${nuevos.length} jugadores a Mi Plantilla con su valor de mercado actual como precio de compra (edítalo luego si pagaste otra cosa). ¿Continuar?`)) return;
  for (const x of nuevos) {
    const pm = x.playerMaster || x.player || x;
    const local = state.byId[c].get(String(pm.id));
    const price = +(x.buyingPrice ?? x.purchasePrice ?? pm.marketValue ?? (local ? pVal(local) : 0)) || 0;
    const entry = { id: uid(), pid: String(pm.id), name: pm.nickname || pm.name || (local?.nickname ?? "Jugador"),
      pos: String(pm.positionId ?? local?.positionId ?? "3"), teamId: String(pm.teamId ?? local?.teamId ?? ""),
      buyPrice: price, buyDate: todayISO(), custom: !local, imported: true };
    state.squad[c].push(entry);
    state.moves[c].push({ id: uid(), type:"buy", pid: entry.pid, name: entry.name, pos: entry.pos, price, date: entry.buyDate, linkedEntry: entry.id, imported: true });
  }
  persist();
  toast(nuevos.length + " jugadores importados", "ok");
  render();
}

/* ---------- exportación CSV (Excel en español: ; y BOM) ---------- */
function dlCSV(name, rows){
  const csv = "﻿" + rows.map(r => r.map(v => {
    const s = String(v ?? "");
    return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(";")).join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast("CSV descargado: ábrelo con Excel", "ok");
}

  openModal(`

function exportCSVKind(kind){
  const c = comp();
  const hoy = todayISO();
  if (kind === "movs") {
    const rows = [["Fecha", "Tipo", "Jugador", "Posición", "Precio", "Beneficio", "Origen"]];
    for (const m of [...state.moves[c]].sort((a, b) => (a.date || "").localeCompare(b.date || ""))) {
      rows.push([m.date || "", m.type === "buy" ? "Compra" : "Venta", m.name, (POS[String(m.pos)] || {}).tag || "", m.price || 0, m.type === "sell" ? (m.profit ?? "") : "", m.real ? "Liga" : "Manual"]);
    }
    dlCSV(`movimientos_${hoy}.csv`, rows);
  } else if (kind === "plantilla") {
    const rows = [["Jugador", "Posición", "Equipo", "Origen", "Precio compra", "Fecha compra", "Valor actual", "Plusvalía", "Cambio hoy"]];
    for (const e of state.squad[c]) {
      const p = e.custom ? null : state.byId[c].get(String(e.pid));
      const val = p ? pVal(p) : "";
      rows.push([e.name, (POS[String(e.pos)] || {}).tag || "", p ? (teamOf(p)?.name || "") : "", e.draft ? "De inicio" : "Compra", e.buyPrice || 0, e.buyDate || "", val, p ? val - (e.buyPrice || 0) : "", p ? deltas(c, e.pid).d1 : ""]);
    }
    dlCSV(`plantilla_${hoy}.csv`, rows);
  } else if (kind === "patrimonio") {
    const arr = load("fs_wealth_hist", {})[c] || [];
    const rows = [["Fecha", "Patrimonio", "Dinero", "Valor equipo"]];
    for (const e of arr) rows.push([String(e[0]).replace(/(\d{4})(\d{2})(\d{2})/, "$1-$2-$3"), e[1], e[2], e[3]]);
    if (rows.length < 2) { toast("Aún no hay historial de patrimonio", "err"); return; }
    dlCSV(`patrimonio_${hoy}.csv`, rows);
  } else if (kind === "rivales") {
    const bh = load("fs_budget_hist", {})[c] || {};
    const maps = state.liga.data[c] ? managerMaps(c) : { nameOf: new Map() };
    const rows = [["Fecha", "Mánager", "Presupuesto estimado"]];
    for (const tid in bh) for (const e of bh[tid]) {
      rows.push([String(e[0]).replace(/(\d{4})(\d{2})(\d{2})/, "$1-$2-$3"), maps.nameOf.get(tid) || tid, e[1]]);
    }
    if (rows.length < 2) { toast("Abre Rivales alguna vez para acumular historial", "err"); return; }
    dlCSV(`caja_rivales_${hoy}.csv`, rows);
  }
}

/* ---------- 📕 anuario de la temporada ---------- */
function openYearbook(){
  const c = comp();
  const st = squadStats(c);
  const wealth = load("fs_wealth_hist", {})[c] || [];
  const sells = state.moves[c].filter(m => m.type === "sell" && m.profit != null);
  const buys = state.moves[c].filter(m => m.type === "buy");
  const best = sells.length ? sells.reduce((a, b) => a.profit > b.profit ? a : b) : null;
  const worst = sells.length ? sells.reduce((a, b) => a.profit < b.profit ? a : b) : null;
  const bigBuy = buys.length ? buys.reduce((a, b) => (a.price || 0) > (b.price || 0) ? a : b) : null;
  const okPct = sells.length ? Math.round(sells.filter(m => m.profit > 0).length / sells.length * 100) : null;
  // mi mejor jornada: suma de las 11 mejores puntuaciones de mi plantilla por jornada
  let bestWeek = null;
  const wn = state.meta?.comps?.[c]?.weekNumber || 1;
  for (let w = 1; w <= wn; w++) {
    const pts = state.squad[c]
      .map(e => e.custom ? null : state.byId[c].get(String(e.pid)))
      .filter(Boolean)
      .map(p => { const x = (p.weekPoints || []).find(q => q.weekNumber === w); return x ? x.points || 0 : 0; })
      .sort((a, b) => b - a).slice(0, 11);
    const total = pts.reduce((a, b) => a + b, 0);
    if (total > 0 && (!bestWeek || total > bestWeek.total)) bestWeek = { w, total };
  }
  const B = state.liga.data[c] ? computeBudgets(c) : null;
  const me = B?.rows.find(r => r.isMe);
  const wDelta = wealth.length >= 2 ? wealth[wealth.length - 1][1] - wealth[0][1] : null;
  const item = (e, t) => `<div class="card" style="padding:12px 14px;margin-bottom:8px;display:flex;gap:11px;align-items:flex-start">
    <div style="font-size:19px">${e}</div><div style="font-size:12.5px;line-height:1.55;color:var(--text-2)">${t}</div></div>`;
  openModal(`
    ${modalHead("📕 Anuario 2026/27")}
    <div class="modal-body">
      <div style="font-size:11.5px;color:var(--text-3);margin-bottom:12px">${MODES[state.mode].label} · hasta hoy (${new Date().toLocaleDateString("es-ES")}). Al acabar la temporada, este será tu libro del año.</div>
      ${me ? item("🏆", `Vas <b>${me.pos}º</b> con <b>${me.points} puntos</b> en tu liga.`) : ""}
      ${wDelta != null ? item(wDelta >= 0 ? "📈" : "📉", `Patrimonio: <b>${fmtM(wealth[wealth.length - 1][1])} €</b> (${fmtMSign(wDelta)} desde el inicio).`) : ""}
      ${item("💼", `Plantilla: <b>${st.n}</b> jugadores, ${fmtM(st.current)} € de valor, latente ${fmtMSign(st.latent)}.`)}
      ${okPct != null ? item("🎓", `${sells.length} ventas, <b>${okPct} %</b> con beneficio (${fmtMSign(st.realized)} realizados).`) : ""}
      ${best && best.profit > 0 ? item("🥇", `Tu mejor operación: <b>${esc(best.name)}</b> ${fmtMSign(best.profit)}.`) : ""}
      ${worst && worst.profit < 0 ? item("💀", `La espinita: <b>${esc(worst.name)}</b> ${fmtMSign(worst.profit)}.`) : ""}
      ${bigBuy ? item("💎", `Tu fichaje más caro: <b>${esc(bigBuy.name)}</b> por ${fmtM(bigBuy.price)}.`) : ""}
      ${bestWeek ? item("🔥", `Tu mejor jornada: <b>J${bestWeek.w}</b> con ~${bestWeek.total} puntos de plantilla.`) : ""}
      <button class="btn-acc" style="width:100%;margin-top:6px" onclick="shareYearbookImage()">🖼 Compartir anuario como imagen</button>
    </div>`);
  window._lastYearbook = { me, wealth, st, okPct, sells: sells.length, best, worst, bigBuy, bestWeek, realized: st.realized };
}

/* ⚽ celebración en directo: si un jugador mío puntúa entre refresco y
   refresco, se celebra con toast y vibración */
function snapshotLivePts(){
  const c = comp();
  const wn = state.meta?.comps?.[c]?.weekNumber;
  const ids = new Set([...(state.lineup[c]?.ids || []).map(String), ...state.squad[c].filter(e => !e.custom).map(e => String(e.pid))]);
  const cur = {};
  for (const pid of ids) {
    const p = state.byId[c].get(pid);
    const wp = p && (p.weekPoints || []).find(x => x.weekNumber === wn);
    if (wp) cur[pid] = wp.points || 0;
  }
  return { c, wn, cur };
}
function celebrateChanges(){
  const now = snapshotLivePts();
  const prev = window._livePts;
  window._livePts = now;
  if (!prev || prev.c !== now.c || prev.wn !== now.wn) return;
  for (const pid in now.cur) {
    const before = prev.cur[pid];
    const after = now.cur[pid];
    if (before != null && after > before) {
      const p = state.byId[now.c].get(pid);
      if (p) {
        toast(`⚽ ¡${p.nickname} está puntuando! +${after - before} (lleva ${after})`, "ok");
        vibrate([40, 60, 40]);
      }
    }
  }
}

function dailyBrief(){
  const today = todayISO();
  if (localStorage.getItem("fs_brief_day") === today) return;
  const c = comp();
  const items = [];
  for (const w of state.watch[c]) {
    if (!w.target) continue;
    const p = state.byId[c].get(String(w.pid));
    if (p && targetReached(w, pVal(p))) items.push(["🎯", `<b>${esc(p.nickname)}</b> está en tu precio objetivo (${fmtM(pVal(p))} €).`]);
  }
  for (const b of comebackRadar(c).slice(0, 2)) {
    items.push(["🩹", `<b>${esc(b.p.nickname)}</b> ha vuelto, con −${fmtM(b.disc)} de descuento sobre su pico.`]);
  }
  for (const e of state.squad[c]) {
    if (e.custom) continue;
    const a = minutesAlert(c, e.pid);
    if (a && a.sev === 2) {
      const p = state.byId[c].get(String(e.pid));
      if (p) items.push(["⏱", `<b>${esc(p.nickname)}</b> ${a.txt} — atento a su titularidad.`]);
    }
  }
  let top = null;
  for (const e of state.squad[c]) {
    if (e.custom) continue;
    const d = deltas(c, e.pid).d1;
    if (d && (!top || Math.abs(d) > Math.abs(top.d))) top = { pid: e.pid, d };
  }
  if (top && Math.abs(top.d) >= 200000) {
    const p = state.byId[c].get(String(top.pid));
    if (p) items.push([top.d > 0 ? "🚀" : "📉", `<b>${esc(p.nickname)}</b> ${fmtMSign(top.d)} hoy, tu mayor movimiento.`]);
  }
  localStorage.setItem("fs_brief_day", today);
  if (!items.length) return;
  openModal(`
    ${modalHead("☀️ Buenos días")}
    <div class="modal-body">
      <div style="font-size:12.5px;color:var(--text-3);margin-bottom:12px">${items.length === 1 ? "Una novedad" : items.length + " novedades"} desde tu última visita:</div>
      ${items.slice(0, 5).map(([e, t]) => `<div class="card" style="padding:12px 14px;margin-bottom:8px;display:flex;gap:11px;align-items:flex-start">
        <div style="font-size:19px">${e}</div>
        <div style="font-size:12.5px;line-height:1.55;color:var(--text-2)">${t}</div>
      </div>`).join("")}
      <button class="btn-acc" style="width:100%;margin-top:6px" onclick="closeModal();setView('consejos')">Ver todos los consejos</button>
    </div>`);
}

/* badge en el icono de la app (iOS 16.4+ instalada y Android):
   nº de objetivos alcanzados + jugadores tuyos con movimiento fuerte hoy */
function updateBadge(){
  if (!("setAppBadge" in navigator)) return;
  try {
    let n = 0;
    for (const cc of ["1", "2"]) {
      for (const w of state.watch[cc] || []) {
        if (!w.target) continue;
        const p = state.byId[cc]?.get(String(w.pid));
        if (p && targetReached(w, pVal(p))) n++;
      }
      for (const e of state.squad[cc] || []) {
        if (e.custom) continue;
        if (Math.abs(deltas(cc, e.pid).d1) >= 400000) n++;
      }
    }
    if (n > 0) navigator.setAppBadge(n);
    else if (navigator.clearAppBadge) navigator.clearAppBadge();
  } catch(e) { /* navegador sin badges */ }
}

(function init(){
  const theme = localStorage.getItem(LS.theme);
  if (theme) document.documentElement.dataset.theme = theme;
  applyThemeBtn();
  applyMode();
  // enlaces profundos de los accesos directos: ?view=liga&tab=mercado, etc.
  try {
    const q = new URLSearchParams(location.search);
    const v = q.get("view");
    if (v && VIEWS.some(x => x.id === v)) state.view = v;
    const tb = q.get("tab");
    if (tb) state.ligaTab = tb;
    if (v) history.replaceState(null, "", location.pathname);
  } catch(e){}
  renderNav();
  loadAll().then(() => {
    render();
    checkTargets({ silent: true });
    updateBadge();
    window._livePts = snapshotLivePts();
    setTimeout(dailyBrief, 900); // brief matinal, solo la primera apertura del día
  }).catch(err => {
    document.getElementById("main").innerHTML =
      `<div class="empty-state"><div class="big">📡</div>No se pudieron cargar los datos.<br>
      <span style="font-size:12px">${esc(err.message)}</span><br><br>
      <button class="btn-acc" onclick="location.reload()">Reintentar</button></div>`;
  });
  // refresco del contador de jornada cada minuto
  setInterval(() => { if (state.view === "resumen" && state.meta) render(); }, 60000);
  // comprobación de datos nuevos (meta.json pesa ~400 bytes, es baratísimo):
  // cada 2 min con jornada en vivo, cada 5 min si no
  setInterval(() => {
    const live = state.meta?.comps?.[comp()]?.isLive;
    const mins = Math.floor(Date.now() / 60000);
    if (mins % (live ? 2 : 5) === 0) autoCheck();
  }, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) autoCheck(); });
  // Mi Liga: refresco periódico suave (loadLiga ya limita a 1 vez cada 2 min)
  setInterval(() => { if (state.view === "liga" && state.auth && !document.hidden) loadLiga(); }, 120000);
  // barra inferior: se oculta mientras el teclado está abierto para que no "flote"
  if (window.visualViewport) {
    let baseH = window.visualViewport.height;
    window.visualViewport.addEventListener("resize", () => {
      const h = window.visualViewport.height;
      if (h > baseH) baseH = h;
      document.body.classList.toggle("kb-open", h < baseH * 0.78);
    });
  }
  // service worker: notificaciones en Android + app instalable
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
})();
</script>
