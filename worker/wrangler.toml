name = "fantasy-proxy"
main = "fantasy-proxy.js"
compatibility_date = "2026-08-01"
workers_dev = true

[[kv_namespaces]]
binding = "SYNC"
id = "fd1bb848f3f34d3a8ece4e5e17193a2b"

# Reloj puntual del bot: cada 5 min el Worker decide (en hora de Madrid) qué
# workflow lanzar — datos cada 15 min, resumen 8:45, sala de guerra, semanal y
# mensual. Ver scheduled() en fantasy-proxy.js.
[triggers]
crons = ["*/5 * * * *"]
