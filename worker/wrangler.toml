name = "fantasy-proxy"
main = "fantasy-proxy.js"
compatibility_date = "2026-08-01"
workers_dev = true

[[kv_namespaces]]
binding = "SYNC"
id = "fd1bb848f3f34d3a8ece4e5e17193a2b"

# Disparo del workflow de datos a la 01:00 de Madrid (valores nuevos del juego)
# y a la 01:32 (el parte de precios por Telegram sale a partir de la 01:25).
# UTC: hora 23 = madrugada de verano (CEST); hora 0 = madrugada de invierno.
[triggers]
crons = ["5,20,32 23 * * *", "5,20,32 0 * * *"]
